<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 — Claude Code 学习站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; padding: 20px; }
  .wrap { max-width: 800px; margin: 0 auto; }

  /* Password Gate */
  .gate { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 60px 40px; text-align: center; margin-top: 15vh; }
  .gate h1 { font-size: 1.4em; color: #f0f6fc; margin-bottom: 8px; }
  .gate .sub { color: #8b949e; font-size: 0.85em; margin-bottom: 28px; }
  .gate input { width: 260px; padding: 12px 16px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 1.1em; text-align: center; letter-spacing: 0.15em; font-family: "SF Mono", Consolas, monospace; }
  .gate input:focus { border-color: #58a6ff; outline: none; }
  .gate .btn { margin-top: 16px; padding: 10px 36px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 0.95em; font-weight: 700; cursor: pointer; }
  .gate .btn:hover { background: #2ea043; }
  .gate .err { color: #f85149; font-size: 0.82em; margin-top: 12px; min-height: 20px; }

  /* Main Panel */
  .hidden { display: none !important; }
  .panel { }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 0; border-bottom: 1px solid #21262d; }
  header h1 { font-size: 1.2em; color: #f0f6fc; }
  header .info { font-size: 0.78em; color: #8b949e; }

  .section { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .section h2 { font-size: 1.05em; color: #f0f6fc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 140px; }
  .field label { display: block; font-size: 0.82em; color: #8b949e; margin-bottom: 4px; font-weight: 600; }
  .field input, .field select { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 0.9em; }
  .field input:focus, .field select:focus { border-color: #58a6ff; outline: none; }

  .btn { padding: 9px 20px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; font-size: 0.9em; }
  .btn-gen { background: #238636; color: #fff; }
  .btn-gen:hover { background: #2ea043; }
  .btn-out { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
  .btn-out:hover { background: #30363d; }
  .btn-danger { background: transparent; color: #f85149; border: 1px solid #f85149; }
  .btn-danger:hover { background: rgba(248,81,73,0.1); }

  /* Result */
  .result { margin-top: 16px; display: none; }
  .result.show { display: block; }
  .code-box { background: #0d1117; border: 2px solid #238636; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .code-box .big { font-family: "SF Mono", Consolas, monospace; font-size: 1.8em; font-weight: 800; color: #58a6ff; letter-spacing: 0.06em; word-break: break-all; margin: 8px 0 12px; }
  .email-pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 14px; font-size: 0.82em; line-height: 1.7; white-space: pre-wrap; color: #c9d1d9; max-height: 240px; overflow-y: auto; }

  /* Records Table */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 0.88em; }
  .search:focus { border-color: #58a6ff; outline: none; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.75em; font-weight: 700; }
  .badge-A { background: rgba(163,113,247,0.2); color: #a371f7; }
  .badge-S { background: rgba(210,153,29,0.2); color: #d2991d; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #21262d; color: #8b949e; font-size: 0.8em; }
  td { padding: 8px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: rgba(88,166,255,0.04); }
  .empty { text-align: center; padding: 40px; color: #8b949e; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.88em; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ══════ Gate ══════ -->
  <div class="gate" id="gate">
    <h1>🔐 管理后台</h1>
    <p class="sub">Claude Code 学习站</p>
    <input type="password" id="pw-input" placeholder="请输入密码" autofocus>
    <br>
    <button class="btn" onclick="doLogin()">进入后台</button>
    <div class="err" id="gate-err"></div>
  </div>

  <!-- ══════ Panel ══════ -->
  <div class="panel hidden" id="panel">

    <header>
      <div>
        <h1>🔐 管理后台</h1>
        <span class="info">本地工具 · 不公开</span>
      </div>
      <button class="btn btn-danger" onclick="doLogout()">退出</button>
    </header>

    <!-- 生成器 -->
    <div class="section">
      <h2>🎲 生成激活码</h2>
      <div class="row">
        <div class="field">
          <label>客户邮箱</label>
          <input type="email" id="cust-email" placeholder="xxx@qq.com">
        </div>
        <div class="field" style="flex:0 0 160px;">
          <label>类型</label>
          <select id="gen-type">
            <option value="single">S 码 · 单主题 ¥5</option>
            <option value="all">A 码 · 全站 ¥99</option>
          </select>
        </div>
        <div class="field" style="flex:0 0 200px;" id="topic-col">
          <label>主题</label>
          <select id="gen-topic"></select>
        </div>
        <div style="padding-top:20px;">
          <button class="btn btn-gen" onclick="doGenerate()">🎲 生成并记录</button>
        </div>
      </div>

      <div class="result" id="result">
        <div class="code-box">
          <div style="font-size:0.78em;color:#8b949e;">激活码</div>
          <div class="big" id="code-display"></div>
          <button class="btn btn-out" onclick="copyResultCode()" id="btn-copy-code">📋 复制激活码</button>
        </div>
        <h3 style="font-size:0.9em;color:#8b949e;margin-bottom:8px;">📧 邮件回复模板</h3>
        <div class="email-pre" id="email-body"></div>
        <button class="btn btn-out" style="margin-top:8px;" onclick="copyResultEmail()">📋 复制邮件模板</button>
      </div>
    </div>

    <!-- 记录 -->
    <div class="section">
      <h2>📋 支付记录 <span style="font-weight:400;color:#8b949e;font-size:0.75em;" id="rec-count"></span></h2>
      <div class="toolbar">
        <input class="search" type="text" id="search-input" placeholder="🔍 搜邮箱或激活码..." oninput="renderRecords()">
        <button class="btn btn-out" onclick="exportCSV()">📥 导出 CSV</button>
        <button class="btn btn-out" onclick="importCSV()">📤 导入 CSV</button>
      </div>
      <div id="records-table"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════ Config ══════
var PASSWORD_HASH = '6f12b755a8346d0af16dd799c9f81008520961a11d752b6bd2c5681fa766d00c';
var MAX_TRIES = 3;
var LOCK_MINUTES = 5;

// ══════ Topic Registry ══════
var TOPIC_ORDER = [
  'pc-basics','open-ps','install-cc','first-chat','file-basics','troubleshoot','deepseek',
  'ai-for-business','talk-to-ai','ai-writing','bridge-to-coding',
  'intro','plan','shortcuts','convo','init','workflow'
];
var TOPIC_NAMES = {
  'pc-basics':'认识你的电脑','open-ps':'打开 PowerShell',
  'install-cc':'安装 Claude Code','first-chat':'第一次对话',
  'file-basics':'文件与文件夹','troubleshoot':'遇到错误怎么办',
  'deepseek':'国内也能用',
  'ai-for-business':'AI 能帮你做什么','talk-to-ai':'让 AI 听懂你',
  'ai-writing':'让 AI 帮你写文案','bridge-to-coding':'接下来学什么',
  intro:'Claude Code 简介',plan:'/plan 命令完全指南',
  shortcuts:'快捷键大全',convo:'对话技巧入门',
  init:'项目初始化',workflow:'日常工作流'
};

// ══════ Activation Code Engine ══════
var CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SECRET_SALT = 0xCC1E4;

function topicToChar(topicId) {
  var idx = TOPIC_ORDER.indexOf(topicId);
  return idx >= 0 ? CHARS[idx + 1] : 'X';
}

function computeCheck(prefix) {
  var hash = SECRET_SALT;
  for (var i = 0; i < prefix.length; i++) {
    hash = ((hash << 5) - hash) + prefix.charCodeAt(i);
    hash = hash | 0;
  }
  var result = '';
  for (var j = 0; j < 4; j++) {
    result += CHARS[Math.abs((hash >> (j * 5)) % CHARS.length)];
  }
  return result;
}

function generateCode(type, topicId) {
  var typeChar = type === 'all' ? 'A' : 'S';
  var topicChar = type === 'all' ? '0' : topicToChar(topicId);
  var random = CHARS[Math.floor(Math.random() * CHARS.length)]
             + CHARS[Math.floor(Math.random() * CHARS.length)];
  var prefix = 'CC-' + typeChar + topicChar + random;
  var check = computeCheck(prefix);
  return prefix + '-' + check;
}

// ══════ Records Store ══════
function getRecords() {
  try { return JSON.parse(localStorage.getItem('cc-admin-records') || '[]'); }
  catch(e) { return []; }
}
function saveRecords(records) {
  localStorage.setItem('cc-admin-records', JSON.stringify(records));
}
function addRecord(email, type, topicId, code) {
  var records = getRecords();
  records.unshift({
    date: new Date().toISOString().split('T')[0],
    email: email,
    type: type,
    topicId: topicId,
    topicName: type === 'all' ? '全站永久解锁' : (TOPIC_NAMES[topicId] || topicId),
    code: code
  });
  saveRecords(records);
}

// ══════ Password Gate ══════
async function doLogin() {
  var pw = document.getElementById('pw-input').value;
  var errEl = document.getElementById('gate-err');

  // Check lockout
  var lockData = JSON.parse(sessionStorage.getItem('cc-admin-lock') || '{"tries":0,"until":0}');
  if (lockData.until > Date.now()) {
    var mins = Math.ceil((lockData.until - Date.now()) / 60000);
    errEl.textContent = '已锁定，请 ' + mins + ' 分钟后重试';
    return;
  }

  var encoder = new TextEncoder();
  var hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pw));
  var hashArray = Array.from(new Uint8Array(hashBuffer));
  var hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');

  if (hashHex === PASSWORD_HASH) {
    // Success
    sessionStorage.removeItem('cc-admin-lock');
    sessionStorage.setItem('cc-admin-auth', '1');
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('pw-input').value = '';
    initUI();
    renderRecords();
  } else {
    lockData.tries = (lockData.tries || 0) + 1;
    var remaining = MAX_TRIES - lockData.tries;
    if (remaining <= 0) {
      lockData.until = Date.now() + LOCK_MINUTES * 60000;
      lockData.tries = 0;
      sessionStorage.setItem('cc-admin-lock', JSON.stringify(lockData));
      errEl.textContent = '密码错误次数过多，锁定 ' + LOCK_MINUTES + ' 分钟';
    } else {
      sessionStorage.setItem('cc-admin-lock', JSON.stringify(lockData));
      errEl.textContent = '密码错误，还剩 ' + remaining + ' 次机会';
    }
  }
}

function doLogout() {
  sessionStorage.removeItem('cc-admin-auth');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('pw-input').focus();
}

// ══════ UI Init ══════
function initUI() {
  var sel = document.getElementById('gen-topic');
  sel.innerHTML = '';
  TOPIC_ORDER.forEach(function(id) {
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = TOPIC_NAMES[id] + ' (' + id + ')';
    sel.appendChild(opt);
  });

  document.getElementById('gen-type').addEventListener('change', function() {
    document.getElementById('topic-col').style.display = this.value === 'all' ? 'none' : '';
  });
}

// ══════ Generate ══════
function doGenerate() {
  var email = document.getElementById('cust-email').value.trim();
  if (!email || email.indexOf('@') < 0) { toast('请先填写客户邮箱'); return; }

  var type = document.getElementById('gen-type').value;
  var topicId = type === 'all' ? '' : document.getElementById('gen-topic').value;
  var code = generateCode(type, topicId);

  // Record
  addRecord(email, type, topicId, code);

  // Display
  document.getElementById('code-display').textContent = code;
  document.getElementById('result').classList.add('show');
  _curCode = code;

  // Email template
  var topicName = type === 'all' ? '全站永久解锁' : (TOPIC_NAMES[topicId] || topicId);
  var template =
    '主题：Claude Code 学习站 激活码\n\n' +
    '你好！\n\n' +
    '已收到你的付款，激活码如下：\n\n' +
    '    ' + code + '\n\n' +
    '使用方式：\n' +
    '1. 打开 https://www.hcpthanks.com/pay/recover.html\n' +
    '2. 输入上方激活码\n' +
    '3. 即可解锁「' + topicName + '」\n\n' +
    (type === 'all'
      ? '全站 17 个主题永久解锁，后续更新永久免费。\n\n'
      : '仅解锁这一个主题的付费内容。如需全站解锁（¥99），访问：\n' +
        'https://www.hcpthanks.com/pay/pay.html?plan=all\n\n') +
    '激活码已发送到你的邮箱，随时可查，永不丢失。\n' +
    '如有问题，回复此邮件即可。\n\n' +
    '— Claude Code 学习站';
  document.getElementById('email-body').textContent = template;
  _curEmail = template;

  // Reset copy button
  var b = document.getElementById('btn-copy-code');
  b.textContent = '📋 复制激活码';
  b.style.background = '';
  b.style.color = '';

  renderRecords();
  toast('✅ 已生成并记录');
}

var _curCode = '';
var _curEmail = '';

function copyResultCode() {
  navigator.clipboard.writeText(_curCode).then(function() {
    var b = document.getElementById('btn-copy-code');
    b.textContent = '✅ 已复制';
    b.style.background = '#238636';
    b.style.color = '#fff';
    toast('激活码已复制');
  });
}

function copyResultEmail() {
  navigator.clipboard.writeText(_curEmail).then(function() {
    toast('邮件模板已复制');
  });
}

// ══════ Records ══════
function renderRecords() {
  var records = getRecords();
  var query = (document.getElementById('search-input') || {}).value || '';
  query = query.trim().toLowerCase();

  if (query) {
    records = records.filter(function(r) {
      return r.email.toLowerCase().indexOf(query) >= 0 ||
             r.code.toLowerCase().indexOf(query) >= 0;
    });
  }

  document.getElementById('rec-count').textContent = '(' + records.length + '条)';

  var container = document.getElementById('records-table');
  if (!records.length) {
    container.innerHTML = '<div class="empty">' + (query ? '无匹配记录' : '暂无记录，生成激活码后自动显示') + '</div>';
    return;
  }

  var html = '<table><thead><tr><th>日期</th><th>邮箱</th><th>类型</th><th>主题</th><th>激活码</th></tr></thead><tbody>';
  records.forEach(function(r) {
    var badge = r.type === 'all' ? '<span class="badge badge-A">A码</span>' : '<span class="badge badge-S">S码</span>';
    html += '<tr>' +
      '<td>' + r.date + '</td>' +
      '<td>' + esc(r.email) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + esc(r.topicName) + '</td>' +
      '<td style="font-family:monospace;">' + esc(r.code) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function esc(s) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(s));
  return div.innerHTML;
}

// ══════ CSV ══════
function exportCSV() {
  var records = getRecords();
  if (!records.length) { toast('没有记录可导出'); return; }

  var csv = '﻿日期,客户邮箱,类型,主题,激活码\n';
  records.forEach(function(r) {
    var typeLabel = r.type === 'all' ? 'A码-全站' : 'S码-单主题';
    csv += r.date + ',' + r.email + ',' + typeLabel + ',' + r.topicName + ',' + r.code + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'claude-code-支付记录-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 CSV 已下载');
}

function importCSV() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      var text = reader.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // BOM
      var lines = text.trim().split('\n');
      var imported = [];
      for (var i = 1; i < lines.length; i++) {
        var parts = lines[i].split(',');
        if (parts.length >= 5) {
          var typeLabel = parts[2].trim();
          imported.push({
            date: parts[0].trim(),
            email: parts[1].trim(),
            type: typeLabel.indexOf('A') >= 0 ? 'all' : 'single',
            topicName: parts[3].trim(),
            code: parts[4].trim()
          });
        }
      }
      if (imported.length === 0) { toast('CSV 格式不正确或为空'); return; }

      // Merge: dedupe by code, keep existing
      var existing = getRecords();
      var seen = {};
      existing.forEach(function(r) { seen[r.code] = true; });
      var added = 0;
      imported.forEach(function(r) {
        if (!seen[r.code]) {
          existing.push(r);
          seen[r.code] = true;
          added++;
        }
      });
      existing.sort(function(a, b) { return b.date.localeCompare(a.date); });
      saveRecords(existing);
      renderRecords();
      toast('📤 导入完成，新增 ' + added + ' 条（跳过 ' + (imported.length - added) + ' 条重复）');
    };
    reader.readAsText(file);
  };
  input.click();
}

// ══════ Toast ══════
var _toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
}

// ══════ Auto-login check ══════
if (sessionStorage.getItem('cc-admin-auth') === '1') {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  initUI();
  renderRecords();
}

// Enter key on password
document.getElementById('pw-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
