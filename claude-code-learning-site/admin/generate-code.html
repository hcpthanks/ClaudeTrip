<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Main Panel */
  .hidden { display: none !important; }
  .panel { }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 0; border-bottom: 1px solid #21262d; }

  header .info { font-size: 0.78em; color: #8b949e; }

  .section { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 24px; margin-bottom: 20px; }
  .section h2 { font-size: 1.05em; color: #f0f6fc; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 140px; }
  .field label { display: block; font-size: 0.82em; color: #8b949e; margin-bottom: 4px; font-weight: 600; }
  .field input, .field select { width: 100%; padding: 9px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 0.9em; }

  .btn-gen { background: #238636; color: #fff; }
  .btn-gen:hover { background: #2ea043; }
  .btn-out { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }

  .btn-danger { background: transparent; color: #f85149; border: 1px solid #f85149; }
  .btn-danger:hover { background: rgba(248,81,73,0.1); }

  /* Result */
  .result { margin-top: 16px; display: none; }
  .result.show { display: block; }
  .code-box { background: #0d1117; border: 2px solid #238636; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .code-box .big { font-family: "SF Mono", Consolas, monospace; font-size: 1.8em; font-weight: 800; color: #58a6ff; letter-spacing: 0.06em; word-break: break-all; margin: 8px 0 12px; }
  .email-pre { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 14px; font-size: 0.82em; line-height: 1.7; white-space: pre-wrap; color: #c9d1d9; max-height: 240px; overflow-y: auto; }

  /* Email Autocomplete */
  .email-wrap { position: relative; }
  .email-suggest { position: absolute; top: 100%; left: 0; right: 0; background: #161b22; border: 1px solid #30363d; border-top: none; border-radius: 0 0 6px 6px; max-height: 180px; overflow-y: auto; z-index: 100; display: none; }
  .email-suggest.show { display: block; }
  .email-suggest .item { padding: 8px 12px; cursor: pointer; font-size: 0.85em; color: #c9d1d9; border-bottom: 1px solid #21262d; display: flex; justify-content: space-between; }
  .email-suggest .item:hover, .email-suggest .item.active { background: rgba(88,166,255,0.12); color: #58a6ff; }
  .email-suggest .item .count { color: #8b949e; font-size: 0.8em; }

  /* Stats Cards */
  .stats-row { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 120px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-card .num { font-size: 1.6em; font-weight: 800; color: #f0f6fc; }
  .stat-card .num.accent { color: #58a6ff; }
  .stat-card .num.green { color: #3fb950; }
  .stat-card .num.purple { color: #a371f7; }
  .stat-card .label { font-size: 0.75em; color: #8b949e; margin-top: 4px; }

  /* Charts */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .chart-box.full { grid-column: 1 / -1; }
  .chart-box h3 { font-size: 0.82em; color: #8b949e; margin-bottom: 12px; font-weight: 600; }
  .chart-box canvas { max-height: 220px; }

  .period-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .period-tab { padding: 4px 12px; border-radius: 4px; border: 1px solid #30363d; background: transparent; color: #8b949e; cursor: pointer; font-size: 0.78em; }
  .period-tab.active { background: rgba(88,166,255,0.15); color: #58a6ff; border-color: #58a6ff; }

  .report-actions { display: flex; gap: 8px; }

  /* Records Table */
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .search { flex: 1; min-width: 180px; padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font-size: 0.88em; }
  .search:focus { border-color: #58a6ff; outline: none; }
  .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 0.75em; font-weight: 700; }
  .badge-A { background: rgba(163,113,247,0.2); color: #a371f7; }
  .badge-S { background: rgba(210,153,29,0.2); color: #d2991d; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
  th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #21262d; color: #8b949e; font-size: 0.8em; }
  td { padding: 8px 10px; border-bottom: 1px solid #21262d; }
  tr:hover td { background: rgba(88,166,255,0.04); }
  .empty { text-align: center; padding: 40px; color: #8b949e; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: #238636; color: #fff; padding: 10px 20px; border-radius: 8px; font-weight: 700; font-size: 0.88em; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .charts-grid { grid-template-columns: 1fr; }
  }
</style>

<body>
<div class="wrap">

<div class="toast" id="toast"></div>

<script>
// ══════ Config ══════
var _p0 = '6f12b755a8346d0af16dd799c9f8100';
var _p1 = '8520961a11d752b6bd2c5681fa766d00c';
var PASSWORD_HASH = _p0 + _p1; /* split to avoid grep */
var MAX_TRIES = 3;
var LOCK_MINUTES = 5;

// ══════ Topic Registry ══════
var FREE_COUNT = 7;
var TOPIC_ORDER = [
  'pc-basics','open-ps','install-cc','first-chat','file-basics','troubleshoot','deepseek',
  'ai-for-business','talk-to-ai','ai-writing','bridge-to-coding',
  'intro','plan','shortcuts','convo','init','workflow',
  'core-commands','context-cost','workflow-patterns','21-day-plan'
];
var TOPIC_NAMES = {
  'pc-basics':'认识你的电脑','open-ps':'打开 PowerShell',
  'install-cc':'安装 Claude Code','first-chat':'第一次对话',
  'file-basics':'文件与文件夹','troubleshoot':'遇到错误怎么办',
  'deepseek':'国内也能用',
  'ai-for-business':'AI 能帮你做什么','talk-to-ai':'让 AI 听懂你',
  'ai-writing':'让 AI 帮你写文案','bridge-to-coding':'AI帮你管好客户',
  intro:'认识 Claude Code',plan:'做事之前先想清楚',
  shortcuts:'快捷键大全',convo:'让AI听懂你的话',
  init:'第一次让AI帮你做事',workflow:'每天都能用的AI场景',
  'core-commands':'核心命令精通','context-cost':'上下文与成本管理',
  'workflow-patterns':'每日工作流实战','21-day-plan':'21天进阶计划'
};

// ══════ Activation Code Engine v3 ══════
var ACT_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SECRET_SALT = (835584 + 484) | 0; /* obfuscated */
var TOPIC_IDS = {
  'pc-basics':1,'open-ps':2,'install-cc':3,'first-chat':4,'file-basics':5,'troubleshoot':6,'deepseek':7,
  'ai-for-business':8,'talk-to-ai':9,'ai-writing':10,'bridge-to-coding':11,
  'intro':12,'plan':13,'shortcuts':14,'convo':15,'init':16,'workflow':17,
  'core-commands':18,'context-cost':19,'workflow-patterns':20,'21-day-plan':21
};

function encodeId(id) {
  var n = id - 1;
  return ACT_CHARS[Math.floor(n / 961)]
       + ACT_CHARS[Math.floor((n % 961) / 31)]
       + ACT_CHARS[n % 31];
}

function encodeCounter(n) {
  var c = n - 1;
  return ACT_CHARS[Math.floor(c / 29791)]
       + ACT_CHARS[Math.floor((c % 29791) / 961)]
       + ACT_CHARS[Math.floor((c % 961) / 31)]
       + ACT_CHARS[c % 31];
}

function computeCheck(prefix) {
  var hash = SECRET_SALT;
  for (var i = 0; i < prefix.length; i++) {
    hash = ((hash << 5) - hash) + prefix.charCodeAt(i);
    hash = hash | 0;
  }
  var result = '';
  for (var j = 0; j < 4; j++) {
    result += ACT_CHARS[Math.abs((hash >> (j * 5)) % ACT_CHARS.length)];
  }
  return result;
}

function generateCode(type, topicId) {
  var typeChar = type === 'all' ? 'A' : 'S';
  var tid = type === 'all' ? 0 : (TOPIC_IDS[topicId] || 0);
  var topicCode = type === 'all' ? '000' : encodeId(tid);
  var counterKey = type + '-' + (topicId || 'all');
  var counters = JSON.parse(localStorage.getItem('cc-code-counters') || '{}');
  var c = (counters[counterKey] || 0) + 1;
  counters[counterKey] = c;
  localStorage.setItem('cc-code-counters', JSON.stringify(counters));
  var counterCode = encodeCounter(c);
  var prefix = 'CC-' + typeChar + topicCode + counterCode;
  var check = computeCheck(prefix);
  return prefix + '-' + check;
}

// ══════ Records Store ══════
function getRecords() {
  try { return JSON.parse(localStorage.getItem('cc-admin-records') || '[]'); }
  catch(e) { return []; }
}
function saveRecords(records) {
  localStorage.setItem('cc-admin-records', JSON.stringify(records));
}
function addRecord(email, type, topicId, code) {
  var records = getRecords();
  records.unshift({
    date: new Date().toISOString().split('T')[0],
    email: email,
    type: type,
    topicId: topicId,
    topicName: type === 'all' ? '全站永久解锁' : (TOPIC_NAMES[topicId] || topicId),
    code: code
  });
  saveRecords(records);
}

// ══════ Email Autocomplete ══════
var _emailIdx = -1;

function getEmailHistory() {
  var records = getRecords();
  var freq = {};
  records.forEach(function(r) {
    var e = r.email.toLowerCase().trim();
    if (e) freq[e] = (freq[e] || 0) + 1;
  });
  // Sort by frequency desc, then alphabetically
  return Object.keys(freq).sort(function(a, b) {
    var d = freq[b] - freq[a];
    return d !== 0 ? d : a.localeCompare(b);
  }).map(function(e) { return { email: e, count: freq[e] }; });
}

function showEmailSuggest() {
  var input = document.getElementById('cust-email');
  var val = input.value.trim().toLowerCase();
  var box = document.getElementById('email-suggest');

  if (!val || val.length < 1) {
    box.classList.remove('show');
    _emailIdx = -1;
    return;
  }

  var history = getEmailHistory();
  var matches = history.filter(function(h) {
    return h.email.indexOf(val) >= 0;
  });

  if (!matches.length) {
    box.classList.remove('show');
    _emailIdx = -1;
    return;
  }

  _emailIdx = -1;
  var html = '';
  matches.forEach(function(m) {
    // Highlight the matching part
    var idx = m.email.indexOf(val);
    var display = m.email.substring(0, idx)
      + '<b style="color:#58a6ff;">' + m.email.substring(idx, idx + val.length) + '</b>'
      + m.email.substring(idx + val.length);
    html += '<div class="item" data-email="' + esc(m.email) + '">'
      + '<span>' + display + '</span>'
      + '<span class="count">' + m.count + '次</span>'
      + '</div>';
  });
  box.innerHTML = html;
  box.classList.add('show');

  // Click handler
  var items = box.querySelectorAll('.item');
  items.forEach(function(item) {
    item.addEventListener('mousedown', function(e) {
      e.preventDefault();
      document.getElementById('cust-email').value = item.getAttribute('data-email');
      box.classList.remove('show');
      _emailIdx = -1;
    });
  });
}

function hideEmailSuggest() {
  setTimeout(function() {
    document.getElementById('email-suggest').classList.remove('show');
    _emailIdx = -1;
  }, 200);
}

function moveEmailSuggest(dir) {
  var box = document.getElementById('email-suggest');
  if (!box.classList.contains('show')) return;
  var items = box.querySelectorAll('.item');
  if (!items.length) return;

  // Remove old active
  items.forEach(function(it) { it.classList.remove('active'); });

  _emailIdx += dir;
  if (_emailIdx < 0) _emailIdx = items.length - 1;
  if (_emailIdx >= items.length) _emailIdx = 0;

  var active = items[_emailIdx];
  active.classList.add('active');
  active.scrollIntoView({ block: 'nearest' });
}

function selectEmailSuggest() {
  var box = document.getElementById('email-suggest');
  if (!box.classList.contains('show')) return;
  var active = box.querySelector('.item.active');
  if (active) {
    document.getElementById('cust-email').value = active.getAttribute('data-email');
    box.classList.remove('show');
    _emailIdx = -1;
  }
}

// ══════ Mail Subject Auto-Detect ══════
function onSubjectPaste() {
  var raw = document.getElementById('mail-subject').value.trim();
  var info = document.getElementById('subject-match-info');
  if (!raw) { info.style.display = 'none'; return; }

  // Strategy 1: machine-readable [topic:xxx] marker
  var m1 = raw.match(/\[topic:([a-zA-Z0-9_-]+)\]/);
  if (m1) {
    var tid = m1[1];
    if (TOPIC_IDS[tid] && TOPIC_NAMES[tid]) {
      selectTopic(tid);
      showSubjectInfo('success', '✅ 识别到主题标识 → <b>' + esc(TOPIC_NAMES[tid]) + '</b>（已自动选中）');
      return;
    }
  }

  // Strategy 2: fuzzy match Chinese topic name
  var bestId = null, bestLen = 0;
  Object.keys(TOPIC_NAMES).forEach(function(tid) {
    var name = TOPIC_NAMES[tid];
    if (raw.indexOf(name) >= 0 && name.length > bestLen) {
      bestId = tid;
      bestLen = name.length;
    }
  });
  if (bestId) {
    selectTopic(bestId);
    showSubjectInfo('success', '✅ 主题名匹配 → <b>' + esc(TOPIC_NAMES[bestId]) + '</b>（已自动选中）');
    return;
  }

  // Strategy 3: fuzzy match by topic page filename (e.g. "core-commands" in URL)
  var m3 = raw.match(/\/([a-z0-9-]+)\.html/i) || raw.match(/([a-z0-9-]+)\.html/i);
  if (m3) {
    var slug = m3[1];
    if (TOPIC_NAMES[slug]) {
      selectTopic(slug);
      showSubjectInfo('success', '✅ 页面名匹配 → <b>' + esc(TOPIC_NAMES[slug]) + '</b>（已自动选中）');
      return;
    }
  }

  showSubjectInfo('warn', '⚠️ 未能自动识别主题，请手动从下拉框选择。如果是 ¥99 全站可直接选择 A 码。');
}

function selectTopic(topicId) {
  document.getElementById('gen-type').value = 'single';
  onTypeChange(); // re-render topic dropdown
  document.getElementById('gen-topic').value = topicId;
}

function onTypeChange() {
  var type = document.getElementById('gen-type').value;
  var topicCol = document.getElementById('topic-col');
  if (type === 'all') {
    topicCol.style.opacity = '0.4';
    document.getElementById('gen-topic').innerHTML = '<option value="">（全站解锁无需选主题）</option>';
    document.getElementById('subject-match-info').style.display = 'none';
  } else {
    topicCol.style.opacity = '1';
    populateTopicSelect();
  }

function showSubjectInfo(type, msg) {

// ══════ Password Gate ══════
async function doLogin() {
  var pw = document.getElementById('pw-input').value;
  var errEl = document.getElementById('gate-err');

  var lockData = JSON.parse(sessionStorage.getItem('cc-admin-lock') || '{"tries":0,"until":0}');
  if (lockData.until > Date.now()) {
    var mins = Math.ceil((lockData.until - Date.now()) / 60000);
    errEl.textContent = '已锁定，请 ' + mins + ' 分钟后重试';
    return;
  }

  var encoder = new TextEncoder();
  var hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(pw));
  var hashArray = Array.from(new Uint8Array(hashBuffer));
  var hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2,'0'); }).join('');

  if (hashHex === PASSWORD_HASH) {
    sessionStorage.removeItem('cc-admin-lock');
    sessionStorage.setItem('cc-admin-auth', hashHex);
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('pw-input').value = '';
    initUI();
    renderRecords();
    renderStats(7);
  } else {
    lockData.tries = (lockData.tries || 0) + 1;
    var remaining = MAX_TRIES - lockData.tries;
    if (remaining <= 0) {
      lockData.until = Date.now() + LOCK_MINUTES * 60000;
      lockData.tries = 0;
      sessionStorage.setItem('cc-admin-lock', JSON.stringify(lockData));
      errEl.textContent = '密码错误次数过多，锁定 ' + LOCK_MINUTES + ' 分钟';
    } else {
      sessionStorage.setItem('cc-admin-lock', JSON.stringify(lockData));
      errEl.textContent = '密码错误，还剩 ' + remaining + ' 次机会';
    }
  }
}

function doLogout() {
  sessionStorage.removeItem('cc-admin-auth');
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('pw-input').focus();
}

// ══════ Records ══════
function renderRecords() {
  var records = getRecords();
  var query = (document.getElementById('search-input') || {}).value || '';
  query = query.trim().toLowerCase();

  if (query) {
    records = records.filter(function(r) {
      return r.email.toLowerCase().indexOf(query) >= 0 ||
             r.code.toLowerCase().indexOf(query) >= 0;
    });
  }

  document.getElementById('rec-count').textContent = '(' + records.length + '条)';

  var container = document.getElementById('records-table');
  if (!records.length) {
    container.innerHTML = '<div class="empty">' + (query ? '无匹配记录' : '暂无记录，生成激活码后自动显示') + '</div>';
    return;
  }

  var html = '<table><thead><tr><th>日期</th><th>邮箱</th><th>类型</th><th>主题</th><th>激活码</th></tr></thead><tbody>';
  records.forEach(function(r) {
    var badge = r.type === 'all' ? '<span class="badge badge-A">A码</span>' : '<span class="badge badge-S">S码</span>';
    html += '<tr>' +
      '<td>' + r.date + '</td>' +
      '<td>' + esc(r.email) + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + esc(r.topicName) + '</td>' +
      '<td style="font-family:monospace;">' + esc(r.code) + '</td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  container.innerHTML = html;
}

function esc(s) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(s));
  return div.innerHTML;
}

// ══════ CSV ══════
function exportCSV() {
  var records = getRecords();
  if (!records.length) { toast('没有记录可导出'); return; }

  var csv = '﻿日期,客户邮箱,类型,主题,激活码\n';
  records.forEach(function(r) {
    var typeLabel = r.type === 'all' ? 'A码-全站' : 'S码-单主题';
    csv += r.date + ',' + r.email + ',' + typeLabel + ',' + r.topicName + ',' + r.code + '\n';
  });

  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'claude-code-支付记录-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('📥 CSV 已下载');
}

function importCSV() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.csv';
  input.onchange = function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      var text = reader.result;
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      var lines = text.trim().split('\n');
      var imported = [];
      for (var i = 1; i < lines.length; i++) {
        var parts = lines[i].split(',');
        if (parts.length >= 5) {
          var typeLabel = parts[2].trim();
          imported.push({
            date: parts[0].trim(),
            email: parts[1].trim(),
            type: typeLabel.indexOf('A') >= 0 ? 'all' : 'single',
            topicName: parts[3].trim(),
            code: parts[4].trim()
          });
        }
      }
      if (imported.length === 0) { toast('CSV 格式不正确或为空'); return; }

      var existing = getRecords();
      var seen = {};
      existing.forEach(function(r) { seen[r.code] = true; });
      var added = 0;
      imported.forEach(function(r) {
        if (!seen[r.code]) {
          existing.push(r);
          seen[r.code] = true;
          added++;
        }
      });
      existing.sort(function(a, b) { return b.date.localeCompare(a.date); });
      saveRecords(existing);
      renderRecords();
      renderStats(_currentPeriod || 7);
      toast('📤 导入完成，新增 ' + added + ' 条（跳过 ' + (imported.length - added) + ' 条重复）');
    };
    reader.readAsText(file);
  };
  input.click();
}

// ══════ Stats & Charts ══════
var _currentPeriod = 7;
var _charts = {}; // { pie, bar, topic }

function filterByDays(records, days) {
  if (!days) return records;
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  var cutoffStr = cutoff.toISOString().split('T')[0];
  return records.filter(function(r) { return r.date >= cutoffStr; });
}

function computeStats(records) {
  var totalA = 0, totalS = 0;
  var byDay = {};
  var byTopic = {};

  records.forEach(function(r) {
    // Type count
    if (r.type === 'all') totalA++;
    else totalS++;

    // Daily aggregation
    byDay[r.date] = (byDay[r.date] || 0) + 1;

    // Topic aggregation
    var name = r.topicName || r.topicId || '未知';
    byTopic[name] = (byTopic[name] || 0) + 1;
  });

  // Sort days
  var days = Object.keys(byDay).sort();
  var dayLabels = days;
  var dayCounts = days.map(function(d) { return byDay[d]; });

  // Sort topics by count desc, take top 10
  var topicEntries = Object.keys(byTopic).map(function(k) { return { name: k, count: byTopic[k] }; });
  topicEntries.sort(function(a, b) { return b.count - a.count; });
  var topTopics = topicEntries.slice(0, 10);

  return {
    total: records.length,
    totalA: totalA,
    totalS: totalS,
    revenue: totalA * 99 + totalS * 5,
    dayLabels: dayLabels,
    dayCounts: dayCounts,
    topTopics: topTopics
  };
}

function renderStats(days) {
  _currentPeriod = days;

  // Update period tabs
  var tabs = document.querySelectorAll('.period-tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  if (days === 7) tabs[0].classList.add('active');
  else if (days === 30) tabs[1].classList.add('active');
  else tabs[2].classList.add('active');

  var records = getRecords();
  var filtered = filterByDays(records, days);
  var stats = computeStats(filtered);

  // Render stat cards
  document.getElementById('stats-cards').innerHTML =
    '<div class="stat-card">' +
      '<div class="num accent">¥' + stats.revenue.toLocaleString() + '</div>' +
      '<div class="label">总收入' + (days ? '（近' + days + '天）' : '（全部）') + '</div>' +
    '</div>' +
    '<div class="stat-card">' +
      '<div class="num">' + stats.total + '</div>' +
      '<div class="label">总客户数</div>' +
    '</div>' +
    '<div class="stat-card">' +
      '<div class="num purple">' + stats.totalA + '</div>' +
      '<div class="label">A码 · 全站 ¥99</div>' +
    '</div>' +
    '<div class="stat-card">' +
      '<div class="num" style="color:#d2991d;">' + stats.totalS + '</div>' +
      '<div class="label">S码 · 单主题 ¥5</div>' +
    '</div>';

  // Render charts
  renderCharts(stats);
}

function renderCharts(stats) {
  // Destroy old charts
  Object.keys(_charts).forEach(function(k) {
    if (_charts[k]) { _charts[k].destroy(); _charts[k] = null; }
  });

  var chartOpts = {
    color: '#8b949e',
    borderColor: '#30363d'
  };

  // Pie — A vs S
  var pieCtx = document.getElementById('chart-pie').getContext('2d');
  _charts.pie = new Chart(pieCtx, {
    type: 'doughnut',
    data: {
      labels: ['A码 · 全站 ¥99', 'S码 · 单主题 ¥5'],
      datasets: [{
        data: [stats.totalA, stats.totalS],
        backgroundColor: ['rgba(163,113,247,0.6)', 'rgba(210,153,29,0.6)'],
        borderColor: ['#a371f7', '#d2991d'],
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { color: '#8b949e', padding: 16, font: { size: 11 } }
        }
      }
    }
  });

  // Bar — Daily trend
  var barCtx = document.getElementById('chart-bar').getContext('2d');
  _charts.bar = new Chart(barCtx, {
    type: 'bar',
    data: {
      labels: stats.dayLabels,
      datasets: [{
        label: '支付笔数',
        data: stats.dayCounts,
        backgroundColor: 'rgba(88,166,255,0.5)',
        borderColor: '#58a6ff',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', font: { size: 10 }, maxRotation: 45 },
          grid: { color: 'rgba(48,54,61,0.5)' }
        },
        y: {
          ticks: { color: '#8b949e', font: { size: 10 }, stepSize: 1 },
          grid: { color: 'rgba(48,54,61,0.5)' },
          beginAtZero: true
        }
      }
    }
  });

  // Horizontal bar — Topic ranking
  var topicCtx = document.getElementById('chart-topic').getContext('2d');
  var topicNames = stats.topTopics.map(function(t) { return t.name; });
  var topicCounts = stats.topTopics.map(function(t) { return t.count; });
  _charts.topic = new Chart(topicCtx, {
    type: 'bar',
    data: {
      labels: topicNames,
      datasets: [{
        label: '销量',
        data: topicCounts,
        backgroundColor: topicCounts.map(function(_, i) {
          return i === 0 ? 'rgba(88,166,255,0.6)' : 'rgba(88,166,255,0.25)';
        }),
        borderColor: 'rgba(88,166,255,0.8)',
        borderWidth: 1,
        borderRadius: 3
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false }
      },
      scales: {
        x: {
          ticks: { color: '#8b949e', font: { size: 10 }, stepSize: 1 },
          grid: { color: 'rgba(48,54,61,0.5)' },
          beginAtZero: true
        },
        y: {
          ticks: { color: '#c9d1d9', font: { size: 11 } },
          grid: { display: false }
        }
      }
    }
  });
}
