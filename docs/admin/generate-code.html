<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>激活码生成器 — Claude Code 学习站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 40px; max-width: 560px; width: 100%; }
  .card h1 { font-size: 1.5em; margin-bottom: 4px; color: #f0f6fc; }
  .card .sub { color: #8b949e; font-size: 0.85em; margin-bottom: 28px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-weight: 600; margin-bottom: 8px; color: #e6edf3; font-size: 0.95em; }
  .radios { display: flex; gap: 16px; }
  .radios label { display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; padding: 10px 16px; border: 1px solid #30363d; border-radius: 8px; transition: all .15s; }
  .radios label:hover { border-color: #58a6ff; }
  .radios input:checked + span { color: #58a6ff; font-weight: 700; }
  .radios label:has(input:checked) { border-color: #58a6ff; background: rgba(88,166,255,0.08); }

  select, button { width: 100%; padding: 12px 16px; border-radius: 8px; font-size: 0.95em; }
  select { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; cursor: pointer; }
  select:focus { border-color: #58a6ff; outline: none; }

  .btn-gen { background: #238636; color: #fff; border: none; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background .15s; }
  .btn-gen:hover { background: #2ea043; }

  .result { margin-top: 28px; display: none; }
  .result.show { display: block; }

  .code-box { background: #0d1117; border: 2px solid #30363d; border-radius: 10px; padding: 24px; text-align: center; margin-bottom: 20px; }
  .code-box .code { font-family: "SF Mono", "Cascadia Code", Consolas, monospace; font-size: 2em; font-weight: 800; color: #58a6ff; letter-spacing: 0.06em; word-break: break-all; margin-bottom: 12px; }
  .btn-copy { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all .15s; }
  .btn-copy:hover { background: #30363d; }
  .btn-copy.copied { background: #238636; border-color: #238636; color: #fff; }

  .email-box { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
  .email-box h3 { font-size: 0.9em; color: #8b949e; margin-bottom: 12px; }
  .email-box pre { white-space: pre-wrap; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.88em; line-height: 1.7; color: #c9d1d9; }
  .btn-copy-email { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85em; margin-top: 12px; }

  .info-row { display: flex; gap: 12px; align-items: center; margin-top: 6px; font-size: 0.8em; color: #8b949e; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 0.85em; }
  .badge-S { background: rgba(210,153,29,0.2); color: #d2991d; }
  .badge-A { background: rgba(163,113,247,0.2); color: #a371f7; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 激活码生成器</h1>
  <p class="sub">作者专用 · 不公开 · 生成后通过邮件发给客户</p>

  <div class="field">
    <label>课程类型</label>
    <div class="radios">
      <label><input type="radio" name="plan" value="single" checked><span>📄 单主题（S 码 / ¥5）</span></label>
      <label><input type="radio" name="plan" value="all"><span>⭐ 全站（A 码 / ¥99）</span></label>
    </div>
  </div>

  <div class="field" id="topic-field">
    <label>选择主题</label>
    <select id="topic-select"></select>
  </div>

  <button class="btn-gen" onclick="doGenerate()">🎲 生成激活码</button>

  <div class="result" id="result">
    <div class="code-box">
      <div style="font-size:0.78em;color:#8b949e;margin-bottom:8px;">
        激活码 · <span class="badge" id="badge-type"></span>
        <span id="info-topic" style="margin-left:6px;"></span>
      </div>
      <div class="code" id="code-display"></div>
      <button class="btn-copy" id="btn-copy-code" onclick="copyCode()">📋 复制激活码</button>
    </div>

    <div class="email-box">
      <h3>📧 邮件回复模板</h3>
      <pre id="email-template"></pre>
      <button class="btn-copy-email" onclick="copyEmail()">📋 复制邮件模板</button>
    </div>
  </div>
</div>

<script>
// ══════ Topic Registry (synced with nav.js) ══════
var TOPIC_ORDER = [
  'pc-basics','open-ps','install-cc','first-chat','file-basics','troubleshoot','deepseek',
  'ai-for-business','talk-to-ai','ai-writing','bridge-to-coding',
  'intro','plan','shortcuts','convo','init','workflow'
];
var TOPIC_NAMES = {
  'pc-basics':'认识你的电脑','open-ps':'打开 PowerShell',
  'install-cc':'安装 Claude Code','first-chat':'第一次对话',
  'file-basics':'文件与文件夹','troubleshoot':'遇到错误怎么办',
  'deepseek':'国内也能用',
  'ai-for-business':'AI 能帮你做什么','talk-to-ai':'让 AI 听懂你',
  'ai-writing':'让 AI 帮你写文案','bridge-to-coding':'接下来学什么',
  intro:'Claude Code 简介',plan:'/plan 命令完全指南',
  shortcuts:'快捷键大全',convo:'对话技巧入门',
  init:'项目初始化',workflow:'日常工作流'
};
var TOPIC_PAGES = {
  'pc-basics':'computer-basics.html','open-ps':'open-powershell.html',
  'install-cc':'install-claude-code.html','first-chat':'first-conversation.html',
  'file-basics':'file-basics.html','troubleshoot':'when-things-go-wrong.html',
  'deepseek':'deepseek-setup.html',
  'ai-for-business':'ai-for-business.html','talk-to-ai':'talk-to-ai.html',
  'ai-writing':'ai-writing.html','bridge-to-coding':'bridge-to-coding.html',
  intro:'claude-intro.html',plan:'plan-guide.html',
  shortcuts:'shortcuts.html',convo:'conversation-skills.html',
  init:'project-init.html',workflow:'daily-workflow.html'
};

// ══════ Activation Code Engine (synced with recovery.js) ══════
var CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var SECRET_SALT = 0xCC1E4;

function topicToChar(topicId) {
  var idx = TOPIC_ORDER.indexOf(topicId);
  return idx >= 0 ? CHARS[idx + 1] : 'X';
}

function computeCheck(prefix) {
  var hash = SECRET_SALT;
  for (var i = 0; i < prefix.length; i++) {
    hash = ((hash << 5) - hash) + prefix.charCodeAt(i);
    hash = hash | 0;
  }
  var result = '';
  for (var j = 0; j < 4; j++) {
    result += CHARS[Math.abs((hash >> (j * 5)) % CHARS.length)];
  }
  return result;
}

function generateCode(type, topicId) {
  var typeChar = type === 'all' ? 'A' : 'S';
  var topicChar = type === 'all' ? '0' : topicToChar(topicId);
  var random = CHARS[Math.floor(Math.random() * CHARS.length)]
             + CHARS[Math.floor(Math.random() * CHARS.length)];
  var prefix = 'CC-' + typeChar + topicChar + random;
  var check = computeCheck(prefix);
  return prefix + '-' + check;
}

// ══════ UI ══════
function initTopicSelect() {
  var sel = document.getElementById('topic-select');
  TOPIC_ORDER.forEach(function(id) {
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = TOPIC_NAMES[id] + ' (' + id + ')';
    sel.appendChild(opt);
  });
}

document.querySelectorAll('input[name="plan"]').forEach(function(r) {
  r.addEventListener('change', function() {
    document.getElementById('topic-field').style.display = this.value === 'all' ? 'none' : '';
  });
});

var currentPlan = 'single';
var currentTopic = '';
var currentCode = '';

function doGenerate() {
  currentPlan = document.querySelector('input[name="plan"]:checked').value;
  currentTopic = document.getElementById('topic-select').value;
  currentCode = generateCode(currentPlan, currentTopic);

  // Display code
  document.getElementById('code-display').textContent = currentCode;
  var badge = document.getElementById('badge-type');
  badge.textContent = currentPlan === 'all' ? 'A 码 · 全站' : 'S 码 · 单主题';
  badge.className = 'badge badge-' + (currentPlan === 'all' ? 'A' : 'S');
  document.getElementById('info-topic').textContent = currentPlan === 'all' ? '' : '· ' + TOPIC_NAMES[currentTopic];

  // Email template
  var topicName = currentPlan === 'all' ? '全站永久解锁' : TOPIC_NAMES[currentTopic];
  var template =
    '主题：Claude Code 学习站 激活码\n\n' +
    '你好！\n\n' +
    '已收到你的付款，激活码如下：\n\n' +
    '    ' + currentCode + '\n\n' +
    '使用方式：\n' +
    '打开 https://www.hcpthanks.com/claude-code-learning-site/pay/recover.html\n' +
    '输入上方激活码，即可解锁「' + topicName + '」。\n\n' +
    (currentPlan === 'all'
      ? '全站 17 个主题永久解锁，后续更新永久免费。\n\n'
      : '仅解锁这一个主题的付费内容。如需全站解锁（¥99），访问：\n' +
        'https://www.hcpthanks.com/claude-code-learning-site/pay/pay.html?plan=all\n\n') +
    '激活码已发送到你的邮箱，随时可查，永不丢失。\n' +
    '如有问题，回复此邮件即可。\n\n' +
    '— Claude Code 学习站';
  document.getElementById('email-template').textContent = template;

  // Reset copy buttons
  var b = document.getElementById('btn-copy-code');
  b.textContent = '📋 复制激活码';
  b.classList.remove('copied');

  document.getElementById('result').classList.add('show');
}

function copyCode() {
  navigator.clipboard.writeText(currentCode).then(function() {
    var b = document.getElementById('btn-copy-code');
    b.textContent = '✅ 已复制';
    b.classList.add('copied');
  });
}

function copyEmail() {
  var text = document.getElementById('email-template').textContent;
  navigator.clipboard.writeText(text).then(function() {
    var b = document.querySelector('.btn-copy-email');
    b.textContent = '✅ 已复制';
    setTimeout(function() { b.textContent = '📋 复制邮件模板'; }, 2000);
  });
}

// Init
initTopicSelect();
</script>
</body>
</html>
