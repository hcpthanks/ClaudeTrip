<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="支付成功！Claude Code 学习站进阶和专家课程已解锁。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<title>支付成功 — Claude Code 学习站</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .success-page { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .success-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 56px 48px;
    text-align: center; max-width: 520px; width: 100%;
  }
  .success-icon { font-size: 3.5em; margin-bottom: 20px; }
  .success-card h1 { font-size: 1.8em; margin-bottom: 12px; }
  .success-card .msg { color: var(--text-muted); margin-bottom: 32px; line-height: 1.6; }
  .success-card .next-steps {
    text-align: left; background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 24px; margin-bottom: 28px;
  }
  .success-card .next-steps h3 { margin-bottom: 10px; }
  .success-card .next-steps li { padding: 4px 0; font-size: 0.9em; }
</style>
</head>
<body>

<nav class="site-nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="../index.html" class="logo">Claude Code <span>学习站</span></a>
    <div class="nav-links" role="navigation" aria-label="页面导航">
      <a href="../index.html">首页</a>
      <a href="../index.html#beginner">入门</a>
    </div>
  </div>
</nav>

<main class="success-page" role="main">
  <div class="success-card" id="success-card">
    <!-- filled by JS -->
  </div>
</main>

<footer class="site-footer">
  <p><a href="../index.html">← 返回首页</a></p>
</footer>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/recovery.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var isAll = params.get('plan') === 'all';
var title = isAll ? '🎉 永久解锁成功！' : '✅ 解锁成功！';
var msg = isAll
  ? '入门 + 进阶 + 专家全部内容已解锁。<br>随时可以开始学习，内容更新永久免费。'
  : '本页剩余内容已解锁。<br>刷新页面即可查看全部内容。';
var steps = isAll
  ? ['加入微信答疑群（联系客服获取邀请）','从"进阶 · 多代理编排"开始学习','课程内容更新时会第一时间通知你']
  : ['返回刚才的页面继续学习','也可以从首页浏览其他课程','考虑 ¥99 永久解锁全站更划算'];
var btnText = isAll ? '开始学习 →' : '返回继续学习 →';
var btnHref = isAll ? '../index.html' : (
  (function() {
    var t = params.get('topic') || 'intro';
    var p = (window.TOPIC_PAGES || {})[t] || 'claude-intro.html';
    return '../beginner/' + p;
  })()
);

// Apply unlock for single-page purchases (all-access already set in pay.html)
if (!isAll) {
  var topicToUnlock = params.get('topic') || '';
  var topics = JSON.parse(localStorage.getItem('cc-learn-unlocked') || '[]');
  if (topicToUnlock && topics.indexOf(topicToUnlock) === -1) {
    topics.push(topicToUnlock);
    localStorage.setItem('cc-learn-unlocked', JSON.stringify(topics));
  }
}

// 激活码：优先使用 URL 传入的 code（真实支付服务端生成，与 recovery.js 同算法可校验）
// 无 code 时回退到客户端 generateActivationCode（模拟支付 / 旧版本兼容）
var urlCode = params.get('code');
var actCode = urlCode || generateActivationCode(
  isAll ? 'all' : 'single',
  params.get('topic') || ''
);

// 将服务端激活码也缓存到 localStorage（方便 recovery.js 查询）
if (urlCode) {
  var saved = JSON.parse(localStorage.getItem('cc-activation-codes') || '{}');
  saved[urlCode] = { type: isAll ? 'all' : 'single', topicId: params.get('topic') || '', ts: Date.now() };
  localStorage.setItem('cc-activation-codes', JSON.stringify(saved));
}

document.getElementById('success-card').innerHTML =
  '<div class="success-icon">' + (isAll ? '🎉' : '✅') + '</div>' +
  '<h1>' + title + '</h1>' +
  '<p class="msg">' + msg + '</p>' +
  '<div style="background:var(--bg);border:2px solid var(--orange);border-radius:12px;padding:24px;margin:20px 0;">' +
    '<p style="font-size:0.95em;font-weight:700;color:var(--orange);margin-bottom:4px;">⚠️ 请立即保存你的激活码</p>' +
    '<p style="font-size:0.78em;color:var(--text-muted);margin-bottom:16px;">此码仅显示一次，丢失后需联系客服手动恢复</p>' +
    '<p style="font-family:var(--font-mono);font-size:1.6em;font-weight:800;color:var(--text-high);letter-spacing:0.06em;word-break:break-all;margin-bottom:12px;">' + actCode + '</p>' +
    '<button onclick="var c=\'' + actCode + '\';navigator.clipboard.writeText(c).then(function(){this.textContent=\'✅ 已复制\'}.bind(this));" style="padding:10px 28px;border:none;background:var(--green);color:#000;border-radius:8px;cursor:pointer;font-size:0.9em;font-weight:700;">📋 一键复制激活码</button>' +
    '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--border);text-align:left;font-size:0.82em;color:var(--text-muted);line-height:1.8;">' +
      '<p style="font-weight:700;color:var(--text);margin-bottom:6px;">💾 建议保存方式（选一种即可）：</p>' +
      '<p>· 截图此页面，存到手机相册</p>' +
      '<p>· 复制到手机备忘录或记事本</p>' +
      '<p>· 微信发给自己（文件传输助手）</p>' +
      '<p style="margin-top:8px;color:var(--orange);font-size:0.95em;">⚠️ 丢失激活码 = 换设备后需重新购买</p>' +
      '<p style="font-size:0.9em;">如已丢失：联系微信客服，提供支付截图可重新获取</p>' +
    '</div>' +
  '</div>' +
  '<div class="next-steps"><h3>下一步</h3><ol style="padding-left:20px;line-height:2;">' +
    steps.map(function(s){return '<li>'+s+'</li>';}).join('') +
  '</ol></div>' +
  '<a href="' + btnHref + '" class="btn btn-primary" style="font-size:1em;padding:12px 36px;">' + btnText + '</a>' +
  (isAll ? '' : '<p style="margin-top:16px;"><a href="pay.html?plan=all" style="color:var(--purple);font-size:0.9em;">💜 还是 ¥99 永久解锁更划算 →</a></p>');
</script>
<script src="../assets/js/common.js"></script>
<script src="../assets/js/anti-theft.js"></script>
</body>
</html>
