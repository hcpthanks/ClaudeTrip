<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.tencentscf.com; frame-ancestors 'none'; base-uri 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="输入激活码恢复已购买的 Claude Code 学习站课程。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<title>恢复购买 — Claude Code 学习站</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .recover-page { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .recover-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 48px; text-align: center;
    max-width: 480px; width: 100%;
  }
  .recover-card h1 { font-size: 1.6em; margin-bottom: 8px; }
  .recover-card .sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.92em; line-height: 1.6; }
  .code-input {
    width: 100%; padding: 14px 18px; border-radius: var(--radius);
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 1.15em; font-family: var(--font-mono); text-align: center;
    letter-spacing: 0.08em; transition: border-color var(--duration-fast);
    text-transform: uppercase;
  }
  .code-input:focus { outline: none; border-color: var(--accent); }
  .code-input::placeholder { color: var(--text-faint); font-size: 0.8em; letter-spacing: 0; }
  .code-hint { color: var(--text-muted); font-size: 0.78em; margin-top: 8px; }
  .msg { margin-top: 20px; font-weight: 600; display: none; line-height: 1.6; }
  .msg.success { color: var(--green); display: block; }
  .msg.error { color: var(--red); display: block; }
  .msg.loading { color: var(--accent); display: block; }
  .btn-row { margin-top: 20px; }
  .device-notice { margin-top: 16px; padding: 10px 14px; background: rgba(88,166,255,0.06); border: 1px solid rgba(88,166,255,0.2); border-radius: 8px; font-size: 0.78em; color: var(--text-muted); line-height: 1.6; display: none; }
  .device-notice.show { display: block; }
  @media (max-width: 768px) {
    .recover-card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="../index.html" class="logo">Claude Code <span>学习站</span></a>
    <div class="nav-links" role="navigation" aria-label="页面导航">
      <a href="../index.html">首页</a>
    </div>
    <button class="nav-toggle" id="nav-toggle" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu">
    <a href="../index.html">🏠 首页</a>
    <a href="../index.html#pre-basics">🖥️ 预备课</a>
    <a href="../index.html#applied">💼 应用课</a>
    <a href="../index.html#beginner">🌱 入门</a>
    <a href="pay.html" class="mobile-cta">⚡ 支付</a>
  </div>
</nav>

<main class="recover-page" role="main">
  <div class="recover-card">
    <h1>🔑 恢复购买</h1>
    <p class="sub">输入支付成功后获得的激活码，<br>即可在新浏览器或新电脑上恢复课程。</p>

    <input
      type="text"
      class="code-input"
      id="code-input"
      placeholder="CC-SXXX-YYYY-ZZZZ"
      maxlength="17"
      autocomplete="off"
    >
    <p class="code-hint">格式：CC-SXXX-YYYY-ZZZZ，16 个字符（S=单页/A=全站）</p>

    <div class="msg" id="msg"></div>
    <div class="device-notice" id="device-notice"></div>
    <pre id="debug-log" style="display:none;margin-top:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px;font-size:0.72em;line-height:1.6;color:#8b949e;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;"></pre>

    <div class="btn-row">
      <button class="btn btn-primary" id="verify-btn" style="font-size:1em;padding:12px 40px;">
        验证激活 →
      </button>
    </div>

    <p style="margin-top:24px;font-size:0.82em;color:var(--text-faint);">
      找不到激活码？<br>发邮件至 hcpthanks@163.com，提供支付截图可人工处理。
    </p>
  </div>
</main>

<footer class="site-footer">
  <p><a href="../index.html">← 返回首页</a></p>
</footer>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/recovery.js"></script>
<script>
(function () {
  var input = document.getElementById('code-input');
  var btn = document.getElementById('verify-btn');
  var msg = document.getElementById('msg');
  var notice = document.getElementById('device-notice');

  // ══════ API 配置 ══════
  // 部署 API 网关后将下方地址替换为实际网关域名
  // 格式：https://service-xxx-xxxxxxxx.gz.apigw.tencentcs.com/release
  var API_BASE = 'https://1253632363-hkdthg8jb2.ap-beijing.tencentscf.com';

  // Auto-format: CC-SXXXYYYY-ZZZZ
  input.addEventListener('input', function () {
    var val = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (val.length > 2) val = val.substring(0,2) + '-' + val.substring(2);
    if (val.length > 11) val = val.substring(0,11) + '-' + val.substring(11);
    input.value = val.substring(0, 16);
  });

  function navigateToCourse(topicId) {
    if (!topicId) { window.location.href = '../index.html'; return; }
    var page = (window.TOPIC_PAGES || {})[topicId];
    if (page) {
      var idx = (window.TOPIC_ORDER || []).indexOf(topicId);
      var dir = idx < 7 ? 'pre-basics' : idx < 11 ? 'applied' : idx < 17 ? 'beginner' : 'intermediate';
      window.location.href = '../' + dir + '/' + page;
    } else {
      window.location.href = '../index.html';
    }
  }

  function verify() {
    var code = input.value.trim();
    msg.className = 'msg';
    msg.textContent = '';
    notice.className = 'device-notice';

    // ── Debug log ──
    var debug = document.getElementById('debug-log');
    debug.style.display = 'block';
    var log = [];
    log.push('输入码  : "' + code + '" (长度=' + code.length + ')');

    if (!code || code.length < 16) {
      msg.textContent = '请输入完整的激活码（CC-SXXX-YYYY-ZZZZ 格式）';
      msg.className = 'msg error';
      log.push('→ FAIL: 长度不足 16');
      debug.textContent = log.join('\n');
      return;
    }

    // ── 本地预检 ──
    log.push('verifyActivationCode 存在: ' + (typeof window.verifyActivationCode === 'function' ? 'YES' : 'NO!'));
    var localCheck = window.verifyActivationCode(code);
    log.push('本地校验: ' + JSON.stringify(localCheck));

    if (!localCheck) {
      msg.textContent = '激活码无效，请检查是否输入正确';
      msg.className = 'msg error';
      log.push('→ FAIL: 本地校验不通过');
      debug.textContent = log.join('\n');
      return;
    }

    // ── 云端校验 ──
    msg.textContent = '⏳ 正在云端验证...';
    msg.className = 'msg loading';
    btn.disabled = true;
    btn.textContent = '验证中...';

    var labels = { all: '全站永久解锁', single: '单页解锁' };

    window.verifyWithCloud(code, API_BASE, function (result) {
      btn.disabled = false;
      btn.textContent = '验证激活 →';

      if (result.ok) {
        log.push('云端校验: PASS');
        log.push('剩余设备数: ' + result.remaining);
        log.push('消息: ' + (result.message || ''));
        debug.textContent = log.join('\n');

        msg.textContent = '✅ ' + (labels[result.type] || '解锁') + '成功！即将跳转...';
        msg.className = 'msg success';

        // 显示剩余设备信息
        if (typeof result.remaining === 'number' && result.remaining >= 0) {
          notice.innerHTML = '💡 该激活码可在 <b>' + (result.remaining + 1) + '</b> 台设备上使用（最多 2 台）。<br>激活码仅限本人使用，请勿分享给他人。';
          notice.className = 'device-notice show';
        }

        setTimeout(function () {
          navigateToCourse(result.topicId);
        }, 2000);
      } else {
        log.push('云端校验: FAIL — ' + (result.error || ''));
        debug.textContent = log.join('\n');

        var errText = (result.error || '激活失败').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        msg.innerHTML = '❌ ' + errText.replace(/\n/g, '<br>');
        msg.className = 'msg error';
      }
    });
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') verify();
  });
})();
</script>
<script src="../assets/js/site-config.js"></script>
<script src="../assets/js/anti-theft.js"></script>
</body>
</html>
