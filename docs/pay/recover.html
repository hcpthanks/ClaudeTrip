<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="输入激活码恢复已购买的 Claude Code 学习站课程。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<title>恢复购买 — Claude Code 学习站</title>
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  .recover-page { min-height: calc(100vh - 56px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .recover-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-xl); padding: 48px; text-align: center;
    max-width: 480px; width: 100%;
  }
  .recover-card h1 { font-size: 1.6em; margin-bottom: 8px; }
  .recover-card .sub { color: var(--text-muted); margin-bottom: 28px; font-size: 0.92em; line-height: 1.6; }
  .code-input {
    width: 100%; padding: 14px 18px; border-radius: var(--radius);
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 1.15em; font-family: var(--font-mono); text-align: center;
    letter-spacing: 0.08em; transition: border-color var(--duration-fast);
    text-transform: uppercase;
  }
  .code-input:focus { outline: none; border-color: var(--accent); }
  .code-input::placeholder { color: var(--text-faint); font-size: 0.8em; letter-spacing: 0; }
  .code-hint { color: var(--text-muted); font-size: 0.78em; margin-top: 8px; }
  .msg { margin-top: 20px; font-weight: 600; display: none; }
  .msg.success { color: var(--green); display: block; }
  .msg.error { color: var(--red); display: block; }
  .btn-row { margin-top: 20px; }
  .divider { display: flex; align-items: center; margin: 32px 0 24px; color: var(--text-faint); font-size: 0.82em; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span { padding: 0 16px; }
  .order-input { width: 100%; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.95em; font-family: var(--font-mono); text-align: center; transition: border-color var(--duration-fast); }
  .order-input:focus { outline: none; border-color: var(--accent); }
  .order-hint { color: var(--text-muted); font-size: 0.76em; margin-top: 6px; }
  @media (max-width: 768px) {
    .recover-card { padding: 32px 20px; }
  }
</style>
</head>
<body>

<nav class="site-nav" aria-label="主导航">
  <div class="nav-inner">
    <a href="../index.html" class="logo">Claude Code <span>学习站</span></a>
    <div class="nav-links" role="navigation" aria-label="页面导航">
      <a href="../index.html">首页</a>
    </div>
  </div>
</nav>

<main class="recover-page" role="main">
  <div class="recover-card">
    <h1>🔑 恢复购买</h1>
    <p class="sub">输入支付成功后获得的激活码，<br>即可在新浏览器或新电脑上恢复课程。</p>

    <input
      type="text"
      class="code-input"
      id="code-input"
      placeholder="CC-XXXX-XXXX"
      maxlength="13"
      autocomplete="off"
    >
    <p class="code-hint">格式：CC-XXXX-XXXX，仅 10 个字符（支付成功时显示）</p>

    <div class="msg" id="msg"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="verify-btn" style="font-size:1em;padding:12px 40px;">
        验证激活 →
      </button>
    </div>

    <div class="divider"><span>或</span></div>

    <p style="font-size:0.9em;color:var(--text-muted);margin-bottom:12px;">通过订单号找回激活码</p>
    <input type="text" class="order-input" id="order-input" placeholder="输入订单号（如 CC250607A3K2XM）" maxlength="20" autocomplete="off">
    <p class="order-hint">订单号在支付成功页面显示过，或在浏览器历史记录中查找 pay/success.html</p>

    <div class="btn-row">
      <button class="btn" id="recover-btn" style="font-size:0.9em;padding:10px 32px;opacity:0.85;">
        查找激活码 →
      </button>
    </div>
    <div class="msg" id="order-msg"></div>

    <p style="margin-top:24px;font-size:0.82em;color:var(--text-faint);">
      以上方式都找不到？<br>联系微信客服，提供支付截图可人工处理。
    </p>
  </div>
</main>

<footer class="site-footer">
  <p><a href="../index.html">← 返回首页</a></p>
</footer>

<script src="../assets/js/nav.js"></script>
<script src="../assets/js/recovery.js"></script>
<script>
(function () {
  var input = document.getElementById('code-input');
  var btn = document.getElementById('verify-btn');
  var msg = document.getElementById('msg');

  // Auto-format input: CC-XXXX-XXXX
  input.addEventListener('input', function () {
    var val = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (val.length > 2) val = val.substring(0,2) + '-' + val.substring(2);
    if (val.length > 7) val = val.substring(0,7) + '-' + val.substring(7);
    input.value = val.substring(0, 13);
  });

  function verify() {
    var code = input.value.trim();
    msg.className = 'msg';
    msg.textContent = '';

    if (!code || code.length < 13) {
      msg.textContent = '请输入完整的激活码（CC-XXXX-XXXX 格式）';
      msg.className = 'msg error';
      return;
    }

    var result = verifyActivationCode(code);
    if (!result) {
      msg.textContent = '激活码无效，请检查是否输入正确';
      msg.className = 'msg error';
      return;
    }

    applyActivationCode(result);
    var labels = { all: '全站永久解锁', force: '强制解锁（跳过冷却）', single: '单页解锁' };
    msg.textContent = '✅ ' + (labels[result.type] || '解锁') + '成功！即将跳转...';
    msg.className = 'msg success';

    setTimeout(function () {
      if (result.type === 'all') {
        window.location.href = '../index.html';
      } else if (result.topicId) {
        var page = (window.TOPIC_PAGES || {})[result.topicId];
        if (page) {
          // Use topicPagePath logic: idx<6=pre-basics, <10=applied, >=10=beginner
          var idx = (window.TOPIC_ORDER || []).indexOf(result.topicId);
          var dir = idx < 6 ? 'pre-basics' : idx < 10 ? 'applied' : 'beginner';
          window.location.href = '../' + dir + '/' + page;
        } else {
          window.location.href = '../index.html';
        }
      } else {
        window.location.href = '../index.html';
      }
    }, 1500);
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') verify();
  });

  // ── Order number recovery ──
  var orderInput = document.getElementById('order-input');
  var recoverBtn = document.getElementById('recover-btn');
  var orderMsg = document.getElementById('order-msg');

  recoverBtn.addEventListener('click', function () {
    var orderNo = orderInput.value.trim().toUpperCase();
    orderMsg.className = 'msg';
    orderMsg.textContent = '';

    if (!orderNo || orderNo.length < 10) {
      orderMsg.textContent = '请输入有效的订单号';
      orderMsg.className = 'msg error';
      return;
    }

    recoverBtn.disabled = true;
    recoverBtn.innerHTML = '<span class="loader"></span>查找中...';
    orderMsg.textContent = '';

    var apiBase = (window.PAYMENT_CONFIG && window.PAYMENT_CONFIG.apiBase) || '/api';
    fetch(apiBase + '/recover-code?orderNo=' + encodeURIComponent(orderNo))
      .then(function (r) { return r.json().then(function (d) { return {ok: r.ok, data: d}; }); })
      .then(function (resp) {
        recoverBtn.disabled = false;
        recoverBtn.textContent = '查找激活码 →';

        if (!resp.ok) {
          orderMsg.textContent = resp.data.error || '未找到激活码，请检查订单号或联系客服';
          orderMsg.className = 'msg error';
          return;
        }

        // Found — fill and verify
        orderInput.value = resp.data.code;
        input.value = resp.data.code;
        orderMsg.textContent = '✅ 激活码已找到！正在验证...';
        orderMsg.className = 'msg success';

        // Auto-apply
        var result = verifyActivationCode(resp.data.code);
        if (result) {
          applyActivationCode(result);
          orderMsg.textContent = '✅ 激活码恢复成功！即将跳转...';
          setTimeout(function () {
            if (result.type === 'all') {
              window.location.href = '../index.html';
            } else if (result.topicId) {
              var page = (window.TOPIC_PAGES || {})[result.topicId];
              if (page) {
                var idx = (window.TOPIC_ORDER || []).indexOf(result.topicId);
                var dir = idx < 6 ? 'pre-basics' : idx < 10 ? 'applied' : 'beginner';
                window.location.href = '../' + dir + '/' + page;
              } else {
                window.location.href = '../index.html';
              }
            } else {
              window.location.href = '../index.html';
            }
          }, 1500);
        } else {
          orderMsg.textContent = '⚠️ 激活码格式异常，请尝试手动输入上方激活码验证';
          orderMsg.className = 'msg error';
        }
      })
      .catch(function () {
        recoverBtn.disabled = false;
        recoverBtn.textContent = '查找激活码 →';
        orderMsg.textContent = '网络错误，请稍后重试。如持续失败请联系客服。';
        orderMsg.className = 'msg error';
      });
  });

  orderInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') recoverBtn.click();
  });
})();
</script>
<script src="../assets/js/anti-theft.js"></script>
</body>
</html>
