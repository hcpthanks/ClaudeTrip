<head>

<title>经验教训库 — 复习</title>
<style>
:root{
  --bg:#f7f4ee; --panel:#fffdf8; --ink:#26221c; --soft:#5b5347; --muted:#8d8375;
  --line:#e6ddcd; --accent:#a8443a; --code:#f1ece1; --hl:#f6e7d8;
}
html.dark{
  --bg:#1b1916; --panel:#232019; --ink:#ece5d8; --soft:#c3b9a8; --muted:#8f8677;
  --line:#3a352c; --accent:#d8796d; --code:#2b271f; --hl:#3a2f24;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.9 system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif}
a{color:var(--accent)}
.layout{display:flex;min-height:100vh}
aside{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
.side-head h1{font:600 17px/1.4 "Yu Mincho","Noto Serif SC",serif;margin:0 0 4px;letter-spacing:.04em}
.side-head p{margin:0;color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;margin-top:12px}
.tools input{flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink);font:13px/1 inherit}
.tools input:focus{outline:2px solid var(--accent);outline-offset:1px}
.tools button{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--soft);cursor:pointer;font-size:14px}
.list{overflow:auto;flex:1;padding:8px}
.item{display:block;padding:10px 12px;border-radius:9px;text-decoration:none;color:inherit;cursor:pointer}
.item:hover{background:var(--hl)}
.item.on{background:var(--hl);box-shadow:inset 3px 0 0 var(--accent)}
.item b{display:block;font:600 14px/1.5 "Yu Mincho","Noto Serif SC",serif;margin-bottom:2px}
.item span{display:block;color:var(--muted);font-size:11.5px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;padding:34px clamp(20px,4vw,56px) 80px}
.doc{max-width:780px;margin:0 auto}
.doc-head{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.doc-head h2{font:600 28px/1.5 "Yu Mincho","Noto Serif SC",serif;margin:0 0 6px}
.doc-head p{margin:0;color:var(--muted);font-size:12.5px}
.body h1,.body h2,.body h3,.body h4{font-family:"Yu Mincho","Noto Serif SC",serif;line-height:1.55;margin:1.7em 0 .6em}
.body h1{font-size:25px}.body h2{font-size:21px}.body h3{font-size:18px}.body h4{font-size:16px}
.body p{margin:0 0 1em}
.body ul,.body ol{margin:0 0 1em;padding-left:1.5em}
.body li{margin:.25em 0}
.body code{background:var(--code);border-radius:4px;padding:1px 5px;font-size:.9em}
.body pre{background:var(--code);border-radius:10px;padding:14px 16px;overflow:auto;line-height:1.6}
.body pre code{background:none;padding:0;font-size:13px}
.body blockquote{margin:0 0 1em;padding:.2em 0 .2em 16px;border-left:3px solid var(--accent);color:var(--soft)}
.table-wrap{overflow:auto;margin:0 0 1.2em}
.body table{border-collapse:collapse;width:100%;font-size:14px}
.body th,.body td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top;word-break:keep-all}
.body th{background:var(--hl);font-weight:600;white-space:nowrap}
.body hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.empty{color:var(--muted)}
@media (max-width:820px){
  .layout{display:block}
  aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:46vh}
  main{padding:24px 16px 60px}
}
</style>

<script id="data" type="application/json">[{"file": "windows-html-to-pdf-playwright.md", "title": "Windows HTML → PDF：Playwright 替代 WeasyPrint", "desc": "Windows 上 HTML 转 PDF：用 Playwright 替代 WeasyPrint，零额外依赖", "body": "**Extracted:** 2026-06-26\n**Context:** 在 Windows 上为 LAW-AI 项目做 HTML→PDF 转换时触发\n\n## Problem\n\n`pip install weasyprint` 在 Windows 上不可直接用：\n```\nOSError: cannot load library 'libgobject-2.0-0': error 0x7e\n```\nWeasyPrint 依赖 GTK3 运行时库，pip 无法自动安装。安装 GTK3 需要 MSYS2/pacman 或 gtk3-runtime，与项目无关且笨重。\n\n`pdfkit` 依赖 `wkhtmltopdf`，需单独下载 exe，且已多年不维护（2018 年最后 release）。\n\n## Solution\n\n用 **Playwright** 的 headless Chromium 生成 PDF。Playwright 的 `pip install playwright && playwright install chromium` 已经在大多数开发环境中就绪，Chromium 自带完整渲染引擎，CSS 打印样式和 Web 字体都完美支持。\n\n### 可复用模块\n\n```python\n# law_ai/pdf.py\nfrom pathlib import Path\nfrom playwright.sync_api import sync_playwright\n\ndef html_to_pdf(html_path, pdf_path=None, *, page_format=\"A4\", margin=\"2cm\"):\n    html_path = Path(html_path).resolve()\n    if pdf_path is None:\n        pdf_path = html_path.with_suffix(\".pdf\")\n    \n    with sync_playwright() as p:\n        browser = p.chromium.launch()\n        page = browser.new_page()\n        page.goto(html_path.as_uri(), wait_until=\"networkidle\")\n        page.pdf(path=str(pdf_path), format=page_format, margin=...)\n        browser.close()\n    return pdf_path\n```\n\n### 三种调用方式\n\n| 方式 | 用法 |\n|------|------|\n| CLI | `python -m law_ai.pdf input.html` |\n| Python | `from law_ai.pdf import html_to_pdf` |\n| 自然语言 | \"转成 PDF\" / \"生成 PDF 版本\" |\n\n### 常见坑\n\n- `page.goto()` 用 `as_uri()` 而非手动拼接 `file:///`，避免 Windows 反斜杠和中文路径编码问题\n- `__file__` 在 `python -m` 调用时是绝对路径，`os.path.dirname(__file__)` 指向模块所在目录而非 cwd\n\n## ⚠️  FIRST — Before Trying Anything Else\n\n在 Windows 上 HTML→PDF，**永远不要**依次尝试：\n\n- ❌ `weasyprint` — 缺 GTK3，pip 装不了，报 `OSError: cannot load library 'libgobject-2.0-0'`\n- ❌ `wkhtmltopdf` — 2018 年后未维护，需单独下载 exe\n- ❌ Edge/Chrome headless CLI — 即使 `--no-pdf-header-footer` 去掉中文页脚乱码，仍会踩文件被占用（\"另一个程序正在使用此文件\"）等坑，反复调试浪费数轮对话。且 Edge 路径含空格需额外处理\n\n**直接一行搞定：**\n\n```bash\npython -m law_ai.pdf input.html\n```\n\n如果项目中没有 `law_ai/pdf.py`，用 Playwright 裸调：\n\n```bash\npython -c \"from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); pg=b.new_page(); pg.goto('file:///E:/path/to/file.html'); pg.pdf(path='out.pdf'); b.close()\"\n```\n\n## When to Use\n\n- Windows 上任何 HTML → PDF 需求\n- WeasyPrint / pdfkit 报错时\n- 需要 A4 分页、打印 CSS `@page` 规则正确渲染时\n- 已在用 Playwright 做 E2E 测试的项目（复用已有依赖）\n\n## Pitfalls — HTML 转 PDF 踩坑集合\n\n### 坑1：`@page` margin 与 Playwright 显式 margin 叠加\n\n**症状**：PDF 每页顶部/底部有大片空白，内容没有填满版心。\n\n**根因**：HTML 中 CSS 定义了 `@page { margin: 3.7cm ... }`，同时 Playwright 调用又传了 `margin={'top': '3.7cm', ...}`。两者叠加，边距翻倍。\n\n**正确做法**：二选一，不能同时用。\n\n| 方案 | 用法 | 适用场景 |\n|------|------|---------|\n| 只用 CSS | `pg.pdf(path=..., prefer_css_page_size=True)` 不传 margin 参数 | HTML 已经写好 `@page` 规则 |\n| 只用 Playwright | CSS `@page { margin: 0 }` + 传 `margin={...}` 参数 | 动态控制边距 |\n\n**推荐方案一**：HTML 中保留 `@page { margin: 3.7cm 2.6cm 3.5cm 2.8cm }`，Python 侧只用 `prefer_css_page_size=True`，不传 `margin` 参数。\n\n### 坑2：`body padding` 做边距只在第一页和最后一页生效\n\n**症状**：去掉 `@page` 改用 `body { padding: 3.7cm ... }` 后，中间各页内容贴纸边。\n\n**根因**：`body` 的 padding 只在元素的开头和结尾出现一次，不会被浏览器的分页引擎在每页重复。\n\n**结论**：需要每页统一的边距 → 用 `@page { margin }` 或 Playwright 的 `margin` 参数，不要用 `body padding`。\n\n### 坑3：`line-height` 影响每页行数\n\n**症状**：PDF 页面底部留白偏多，每页内容看起来稀疏。\n\n**根因**：GB/T 9704-2012 规定公文正文固定行距 28 磅。16pt 字号下 28/16 = 1.75。`line-height: 2.0` 多了 4pt/行，每页少排 2-3 行。\n\n**注意**：`line-height: 1.65` 虽然更紧凑，但偏离国标。公文场景必须用 1.75（≈28磅）。\n\n### 坑4：PDF 文件被占用导致覆盖失败\n\n**症状**：`PermissionError: [Errno 13] Permission denied` 写入 PDF 文件。\n\n**根因**：用户正在浏览器/PDF 阅读器中打开旧的 PDF 文件，Windows 锁定了文件句柄。\n\n**解决**：请用户关闭 PDF 阅读器后再生成；或换一个临时文件名输出。\n\n### 坑5：中文文件名在 Python print 中乱码\n\n**症状**：`print()` 输出中文路径显示为 `????`。\n\n**根因**：Windows 终端默认 GBK 编码，Python print 的 emoji/中文触发 `UnicodeEncodeError`。\n\n**解决**：避免 print 中文字符串和 emoji（✅），或先用 `sys.stdout.reconfigure(encoding='utf-8')` 修复编码。\n\n### 坑6：默认 viewport 1280px 导致 PDF 字体极小（缩放至 46%）\n\n**症状**：PDF 生成成功，但打印出来后字体和字迹都非常小（或不打印直接屏幕预览也需要放大 150%-200% 才能正常阅读）。对排版不敏感的用户可能不觉得有问题——但打印出来就知道不对了。\n\n**根因**：Playwright `browser.new_page()` 默认视口是 **1280×720px**。A4 纸的物理宽度在 96dpi 下约 **794px**。Chromium 在 1280px 宽的画布上渲染 HTML，然后 PDF 输出把这 1280px 的画面塞进 A4 纸宽（595pt = 210mm）——内容被整体缩放至约 46%。对 15-16px 的正文字号来说，46% 后约 7px，非常小。\n\n```\nPlaywright 默认视口 1280px\n        ↓ 被硬塞进\n   A4 纸宽 595pt (210mm)\n        ↓\n内容缩放至原来的 595 ÷ 1280 ≈ 46%\n```\n\n**修复**：给 `new_page()` 传一个接近 A4 纸物理尺寸的 viewport：\n\n```python\n# ❌ 默认 1280px → PDF 字体缩至 46%\npage = browser.new_page()\n\n# ✅ A4 96dpi 物理尺寸 → 渲染即打印比例\nA4_VIEWPORT = {\"width\": 794, \"height\": 1123}\npage = browser.new_page(viewport=A4_VIEWPORT)\n```\n\n同时配合 `prefer_css_page_size=True`（不再手动传 `margin`，避免与 HTML 的 `@page` 规则叠加——见坑1）：\n\n```python\npage.pdf(\n    path=str(pdf_path),\n    format=\"A4\",\n    print_background=True,\n    prefer_css_page_size=True,  # 只用 HTML @page 的 margin，不叠加\n)\n```\n\n**完整修复参考**：`LAW-AI/law_ai/pdf.py` 中的 `html_to_pdf()` 函数（2026-07-11 修改版）。\n\n**为什么是 794 而不是其他值？** A4 = 210mm × 297mm。96dpi 下：210mm ÷ 25.4 × 96 = 793.7 ≈ 794px。这接近 CSS `@page` 中 A4 的渲染宽度，Chromium 以这个视口渲染后再输出 A4 PDF，内容不会缩放。", "mtime": "2026-07-11"}, {"file": "SKILL.md", "title": "Learned — 经验教训库", "desc": "从 CLAW 项目中积累的教训和经验。每次踩坑后自动追加。用于避免重复犯错。", "body": "## 收录的教训\n\n| # | 日期 | 主题 | 层级 | 文件 |\n|---|------|------|:---:|------|\n| 1 | 2026-06-23 | Bash `ln`/`cmd //c mklink` 静默失败 | 工程 | [bash-cmd-mklink-silent-failure.md](bash-cmd-mklink-silent-failure.md) |\n| 2 | 2026-06-23 | PowerShell Junction 双重计数陷阱 | 工程 | [powershell-junction-double-count-trap.md](powershell-junction-double-count-trap.md) |\n| 3 | 2026-06-24 | Python ML 依赖防御模式 | 工程 | [python-ml-dependency-defense.md](python-ml-dependency-defense.md) |\n| 4 | 2026-06-24 | AI底图+文字分层抑制公式 | 工程 | [ai-bg-text-layering-formula.md](ai-bg-text-layering-formula.md) |\n| 5 | md](gate-deferral-observation-period.md) |\n| 20 | 2026-07-01 | ⚠️ 行为准则→Hook自动化三层管线——基础科学(违规分类)→技术科学(检测算法)→工程技术(Hookify+测试)，把纸面规则升级为机械执行 | 元规则 | [guideline-to-hook-pipeline.md](guideline-to-hook-pipeline.md) |\n| 21 | 2026-07-01 | ⚠️ ECC 规则可执行性审计——~94条MUST义务仅5条(5.3%)有机械保障 | 元规则 | [ecc-rules-enforcement-audit.md](ecc-rules-enforcement-audit.md) |\n| 22 | 2026-07-01 | ⚠️ ECC 操作系统合规——同一会话6次绕过ECC门禁的证据链 | 元规则 | [ecc-os-compliance.md](ecc-os-compliance.md) |\n| 23 | 2026-07-03 | Agnes Video v2.0 管线约束——API 限制(5min/段, 429串行, 503), FFmpeg 延长方案(Bookend/Palindrome/Loop/Xfade), Style Anchor规则, MOSS-TTS 2.4x performance | 工程 | [agnes-video-pipeline-constraints.md](agnes-video-pipeline-constraints.md) |\n| 24 | 2026-07-07 | ⚠️ 策略前提门禁——对话中给策略建议前列举事实前提+标注来源(✅/❓/⚠️)。2026.7.7\"劳动监察受理\"三种读法选错→整轮策略崩溃。配合 [[qss-skill-creation-gate]] 姊妹门禁 | 元规则 | [strategy-premise-gate.md](strategy-premise-gate.md) |\n\n> ⚠️ 元规则条目 = 关于\"系统应该如何设计/我为什么犯错\"的 methodology，无法用一行 shell 命令执行。\n> 标注后保留至 **2026-07-30 观察期结束**，届时统一清理迁移到所属的正确位置（Hook/CLAUDE.md/qss-ecc-alignment/流程文件），不留在 learned 中。\n\n## 使用方式\n\n当遇到类似问题时，Agent 会自动查阅此目录下的经验文件。也可以在对话中直接说\"看看 learned 里有没有类似的经验\"来触发检索。", "mtime": "2026-07-07"}, {"file": "strategy-premise-gate.md", "title": "QSS 策略前提门禁", "desc": "QSS策略前提门禁——对话中给出策略建议前强制验证前提来源。Q0列举前提+来源标注→Q1检查未确认推论→Q2防诱导确认。❓可见化设计让前提漏洞对用户可见", "body": "**Extracted:** 2026-07-07\n**Context:** 纯对话中，LLM 将用户一句模糊表述（\"劳动监察受理\"）解读为确定的已受理事实，后续整轮策略建议（监察vs仲裁先后顺序、程序策略、时间窗口建议）全部建立在错误前提上。Karpathy #1 \"不要假设\"存在但为🟡规则级被动加载，对话中没有触发点。QSS 核心违反：从定性到定量——定性没做扎实（三种可能含义未区分）就跳到了定量输出（具体程序步骤）。\n\n## Problem\n\n纯对话中，LLM 在给出策略建议或程序结论时，经常跳过前提验证步骤：\n1. 用户一句话有 2+ 种读法 → LLM 默默选一种 → 策略建立在这个未验证的选择上\n2. Karpathy #1 \"不要假设\" 存在但为 🟡 规则级（被动加载），对话中不会主动触发\n3. 哨兵信号 3 \"静默换方案\" 不匹配这个错误模式\n4. 错误不可见——前提假设藏在大脑里，用户看不到也纠正不了\n\n**根因不是\"忘了某条规则\"，而是策略输出流程中缺少一个结构化的前提检查步骤。**\n\n## Solution\n\n**每次在纯对话中准备给出策略建议、程序结论或行动方案前，必须先过以下门禁：**\n\n### 门禁流程图\n\n```\n准备输出策略建议/程序结论/行动方案\n  ↓\nQ0：逐一列出我的建议依赖的全部事实前提\n  ↓\n每条标注来源：\n  | 前提 | 来源 | 状态 |\n  |------|------|------|\n  | 监察已受理 | 推论（用户说\"监察受理\"） | ❓ 未确认 |\n  | 用户7.12离职 | 用户明确说 | ✅ |\n  | 中控室8人被欠加班费 | 用户明确说 | ✅ |\n  ↓\nQ1：有没有 ❓ 状态的前提？\n  ├── 有 → ❌ STOP：先逐条问用户确认。不给策略。\n  └── 没有 → 继续\n                ↓\nQ2：每个 ✅ 状态的前提——是\"用户主动说的\"还是\"我在追问后用户确认的\"？\n  ├── 有\"追问后确认\"的 → ⚠️ 标注为\"间接确认\"，在策略中显式声明这个前提的确认路径\n  └── 全部\"用户主动说的\" → ✅ PASS：可以输出策略\n```\n\n### 关键设计决策：❓ 的可见性\n\nKarpathy #1 失败的核心原因：假设藏在 LLM 的\"大脑\"里，用户看不到。\n\n**本门禁的核心创新**：不要求 LLM \"记住要验证前提\"（那还是行为规则），而是要求 LLM **把前提列表写出来**。即使 LLM 跳过了门禁直接给策略，用户也能从输出中注意到缺失——如果策略建议前面没有前提表格，就是跳过门禁的信号。\n\n**如果必须走门禁但输出要简洁：** 至少包含一条简洁的前提声明：\n\n> 前提确认：以下建议基于 [前提1]（用户明确说）、[前提2]（用户明确说）。如有遗漏请纠正。\n\n### 来源分类标准\n\n| 来源类型 | 标注 | 含义 | 能直接用于策略吗？ |\n|---------|:--:|------|:--:|\n| 用户主动明确说 | ✅ | 用户原话直接陈述的事实 | ✅ 可以 |\n| 追问后用户确认 | ⚠️ | 我问了，用户回答了\"是\"或详细确认 | ✅ 可以，但标注确认路径 |\n| 用户隐含/暗示 | ❓ | 用户的话里暗示了，但没有明确说 | ❌ 不能！必须追问 |\n| 我推论的 | ❓ | 我根据上下文推理出来的 | ❌ 不能！必须追问 |\n| 我假设的 | ❓ | 我凭经验填充的空白 | ❌ 不能！必须追问 |\n\n### 触发范围：什么算\"策略建议/程序结论/行动方案\"\n\n| 算（必须过门禁） | 不算（可以不过） |\n|----------------|----------------|\n| \"你应该先走监察再仲裁\" | \"劳动法第50条规定……\"（纯法律知识） |\n| \"离职前5天要做这几件事\" | \"你的排班表能证明半年超时100小时\"（事实陈述） |\n| \"10人触发集体劳动争议门槛\"（含是否触发的判断） | \"我给你解释一下集体劳动争议的法律定义\"（纯解释） |\n| \"策略上建议你……\" | \"你想了解哪方面？\"（纯提问） |\n| 给出行动顺序/优先级判断 | 复述用户已经知道的信息 |\n\n**判断标准**：是否包含了\"用户下一步该做什么\"的指引？是 → 过门禁。否 → 不需要。\n\n## 负面示例\n\n### ❌ 负面示例 1：未验证前提直接给策略（本次触发事件）\n\n```\n用户：\"劳动监察受理，只有我一个人投诉我于7.12日离职……\"\n  ↓\nLLM：【跳过Q0，直接用\"监察已受理\"作为前提】\n  → 输出：先监察后仲裁的程序策略、监察调查范围、\n          监察结论作为仲裁证据、离职前5天行动清单……\n  ↓\n用户：\"谁告诉你监察已受理\"\n  → 整链崩溃\n```\n\n**为什么错**：用户\"劳动监察受理\"有三种读法——(a) 劳动监察受理这类案件 / (b) 我的案子被劳动监察受理了 / (c) 劳动监察的受理门槛。LLM 选了 (b) 没确认。\n\n**grep-able 信号**：策略输出前没有前提列表表格、没有\"❓\"标记、没有\"前提确认\"字样。\n\n**正确做法**：\n```\n用户：\"劳动监察受理，只有我一个人……\"\n\nLLM：Q0 → 前提：监察已受理？来源=推论 → ❓\n     → STOP：\"你说的'劳动监察受理'是指已提交投诉并收到受理通知，\n            还是指监察受理这类案件的一般规则？我想先确认一下。\"\n```\n\n### ❌ 负面示例 2：诱导性追问制造假确认\n\n```\n用户：\"公司不给我加班费\"\n  ↓\nLLM Q0：前提\"用户已向公司书面要求过加班费\"\n  → ❓ 推论\n  → 追问：\"你肯定已经向公司书面要求过了吧？\"\n  → 用户：\"嗯……好像是\"\n  → LLM 标注为 ✅ → 基于此给策略（建议仲裁）\n  ↓\n实际：用户从未书面要求过，仲裁时缺关键证据\n```\n\n**为什么错**：Q2 的\"追问后确认\"用诱导句式制造了假确认。追问应该是开放式的（\"你有没有向公司书面要求过？\"），不是封闭诱导的（\"你已经……了吧？\"）。\n\n**grep-able 信号**：追问中包含\"肯定\"\"应该\"\"已经……了吧\"\"对吧\"等诱导词。\n\n## grep-able 决策信号\n\n| 门禁输出 | grep-able 信号 |\n|---------|---------------|\n| ❌ Q0 跳过 | 策略建议前没有\"前提\"字样、没有表格、没有\"✅/❓/⚠️\"标记 |\n| ❌ Q1 失败 | 表格中出现至少一个\"❓\" |\n| ❌ Q2 失败（诱导确认） | 追问包含\"肯定\"\"应该\"\"已经……了吧\"\"对吧\"\"是吧\"\"对吗\"\"是不是\" |\n| ⚠️ Q2 标注 | 表格中出现\"⚠️\" + 追问路径 |\n| ✅ 全部通过 | 所有前提标注为 ✅，策略前有完整前提表格或简洁确认语句 |\n\n## 与已有门禁/规则的关系\n\n| 组件 | 关系 |\n|------|------|\n| `qss-skill-creation-gate` | 姊妹门禁——同层（技术科学）、同结构（Q0→Q1→Q2→PASS/STOP）、不同绑定动作 |\n| Karpathy #1 \"不要假设\" | 本门禁是 Karpathy #1 在\"策略输出\"场景的结构化执行——不是重复，是操作化 |\n| CLAUDE.md 任务完成自检 | 互补——自检在 Write/Edit 后触发，本门禁在\"准备给策略建议\"时触发 |\n| QSS \"从定性到定量\" | 本门禁在策略推导链条中插入一个\"定性确认点\"，阻止未确认前提进入定量输出 |\n\n## QSS 层次定位\n\n- **层级**：技术科学（策略推导的方法论标准）\n- **执行方式**：🟡 规则级（纯对话中没有 Hook 可挂钩——这是对话的本质限制）\n- **与 skill-creation-gate 的差异**：skill-creation-gate 绑定工具调用（Skill 工具），有 🟢 Hook 桥接的可能。本门禁绑定纯对话回合，目前只能 🟡 规则级。\n- **升级路径**：如果未来 Claude Code 提供 pre-response Hook（在 LLM 输出文本前插入检查），本门禁可以升级为 🟢 Hook 级。目前无此机制。\n\n## 存储位置\n\n`~/.claude/skills/learned/strategy-premise-gate.md`（全局，跨项目适用）", "mtime": "2026-07-07"}, {"file": "qss-ecc-alignment.md", "title": "QSS-ECC 对齐门禁", "desc": "钱学森系统科学 ↔ ECC 对齐门禁 — 双向映射表 + 2个决策树 + grep-able信号。ECC组件对应五层大厦哪一层，安装/修改时触发审核", "body": "## 问题（为什么这个文档存在）\n\nCLAW 声明钱学森系统科学为\"最高指导思想\"，但 ECC（CLAW 的运行时基础设施——rules/hooks/agents/skills/commands）自身架构完全不引用钱学森。\"最高指导思想\"与\"日常执行的工程系统\"之间存在断裂。\n\n**有这个文档之前**：做 ECC 相关决策（选 install profile、加 hook、改规则）时不会想到钱学森原则。上一轮审计发现 142 条 QSS 引用中 ~110 条是自引用，仅 1 条真正的深度执行。\n\n**有这个文档之后**：任何涉及 ECC 的决策都可以对照双向映射表，快速判断\"这个操作在钱学森框架的哪一层\"和\"这个钱学森原则有没有被 ECC 强制执行\"。\n\n### 本文档的边界（不覆盖什么）\n\n明确以下 ECC 组件**不在本对齐文档的映射范围内**——不是它们不重要，是它们属于\"外部接口\"而非\"内部架构\"，钱学森框架对其的适用性需要通过不同的分析路径：\n\n| 不在映射范围内 | 原因 |\n|--------------|------|\n| ECC CI/CD 集成（GitHub Actions） | 外部工具链，不是 ECC 自身架构组件 |\n| ECC Tools GitHub App / Pro 付费功能 | SaaS 产品层，独立于本地 agent 系统 |\n| npm 发布流水线（`ecc-universal`、`ecc-agentshield`） | 分发机制，不是运行时系统 |\n| CodeRabbit / 第三方 sponsor 集成 | 商业合作关系，不是系统科学分析对象 |\n| ecc2/ Rust alpha 完整功能路线图 | alpha 阶段，功能尚未固化，待 GA 后补充映射 |\n\n**判断标准**：如果一个 ECC 组件满足以下三项之一，它就**在本文档的映射范围内**——(1) 被加载到 Claude Code system prompt，(2) 通过 Hook 引擎在工具调用时执行，(3) 被 install profile 安装到本地文件系统。\n\n---\n\n## 核心：双向映射表\n\n### 方向 A：ECC 组件 → 钱学森原则（\"ECC 做的这件事，是钱学森的哪个原则\"）\n\n| ECC 组件 | ECC 表现 | 钱学森原则 | 五层大厦层级 |\n|---------|---------|-----------|------------|\n| **Prompt Defense Baseline** | `everything-claude-code-guardrails.md` — 不可覆盖的最高规则 | 系统边界 — \"开放的复杂巨系统\"必须定义什么在系统内、什么在系统外 | 哲学 + 桥梁（系统论） |\n| **rules/common/** | coding-style, security, testing, git-workflow 等 | 技术科学 — 运筹学/控制论/信息论（三论归一）在软件工程中的应用 | 技术科学 |\n| **rules/lang-specific/** | typescript, python, go, rust 等 | 各行业系统工程的学科适配 — 同一方法论在不同技术栈的具体化 | 技术科学 → 工程技术 |\n| **hooks/** (PreToolUse/PostToolUse/Stop) | Hook 引擎在每次操作后强制执行脚本 | **从定性到定量**的机械执行点 — \"用明确的脚本替代模糊的意图\" | 工程技术 |\n| **install profiles** | minimal/core/developer/full — 按需选择 | **系统工程 = 组织管理的技术** — 不是\"越多越好\"，是按复杂度分级组装 | 基础科学（系统学） |\n| **agents/** | 67+ 专业子 Agent（planner, code-reviewer, tdd-guide…） | **综合集成方法** — 多专家并行研讨，人（用户）做最终决策 | 基础科学（系统学） |\n| **commands/** | /plan, /tdd, /code-review 等入口 | **综合集成研讨厅的\"厅\"** — 用户进入系统的入口 | 工程技术 |\n| **skills/** | 277+ 领域技能 | 各行业系统工程的具体实践 | 工程技术 |\n| **learned skills** | 经验教训自动提取 | **螺旋上升**的工程实现 — 从产出回到输入的反馈机制 | 基础科学 |\n| **mcp-configs/** | 外部 MCP 服务集成 | **开放系统** — 与外部环境持续交换信息 | 工程技术 |\n| **ecc2/ Rust alpha** | TUI dashboard, session 管理 | **系统演化** — 从简单到复杂的自组织 | 基础科学（系统学） |\n| **🛡️ 哨兵** | session-supervisor + P0 Hook 强制执行 | **反馈机制** + **人机结合** — 异常检测→暂停询问→人决定 | 技术科学 / 工程技术 |\n| **🧭 顾问** | command-advisor — 流程推荐 + 收尾门禁 | **总体设计部** — \"指路不执行\"：告知该做什么，但不自动做 | 桥梁（系统论） |\n| **🧠 学习闭环** | 决策解释 → 过程留痕 → 学习总结 → 学习卡 | **综合集成方法的螺旋上升** — 每一轮迭代回到更高层次的定性认识 | 基础科学（系统学） |\n\n### 方向 B：钱学森原则 → ECC 执行力检查（\"这个原则有没有被 ECC 强制执行？\"）\n\n| 钱学森原则 | ECC 执行机制 | 验证方法 | 执行方式 |\n|-----------|------------|---------|:---:|\n| **边界清晰**（什么在系统内/外） | Prompt Defense Baseline（6 条不可覆盖规则） | `grep \"do not change role\" everything-claude-code/.claude/rules/` | 🟡 规则级 |\n| **层次分明**（五层大厦不越层） | rules/ 层级分离（common → lang-specific）；claude-md-layer-gate 阻止 CLAUDE.md 污染 | `grep \"claude-md-layer-gate\" .claude/skills/learned/` | 🟡 规则级 |\n| **反馈闭合**（产出→评估→改进） | 哨兵 P0 Hook（ecc-context-monitor.js）+ quality-gate + learn 命令 | `ls ~/.claude/sentinel-state.json` | 🟢 Hook 级 |\n| **人机结合、以人为主** | 哨兵暂停询问（\"继续还是停下？\"）；顾问推荐格式（\"你选哪个？\"） | `grep \"继续还是停下\" session-supervisor.md` | 🟢 Hook + 🟡 规则 |\n| **从定性到定量** | Hook 脚本 = 量化的检查点（文件行数、上下文百分比、成本金额） | `grep \"PostToolUse\\|PreToolUse\" ~/.claude/hooks.json` | 🟢 Hook 级 |\n| **综合集成研讨厅** | 多 Agent 并行（Workflow.parallel/pipeline）+ commands 入口 | 检查 Workflow 工具可用性 | 🟡 工具级<sup>①<\/sup> |\n| **螺旋上升**（每轮迭代认识提升） | 学习闭环 + learned skill 自动提取 + session-end review | `grep -c \"\\|\" .claude/skills/learned/SKILL.md`（增长趋势） | 🟡 规则级 |\n| **涌现管理**（1+1>2 的正涌现 vs 负涌现） | 哨兵异质循环检测 + agent-self-repair-deletion-loop 防护 | `grep \"heterogeneous\\|异质\" ecc-context-monitor.js` | 🟢 Hook 级 |\n| **总体设计部**（顶层把控全局） | 顾问收尾门禁（/clear 前强制 5 项检查） | `grep \"收尾门禁\" command-advisor.md` | 🟡 规则级 |\n\n<sup>①<\/sup> Workflow 工具是 Claude Code 内置功能，非 ECC 控制——ECC 提供编排模式但执行引擎属于 Claude Code。\n\n**执行方式分布**：9 条原则中 — 4 条🟢 Hook 级（引擎强制执行），4 条🟡 规则级（system prompt 文本，依赖 LLM 自觉），1 条🟡 工具级（Claude Code 原生功能，ECC 不控制）。\n\n> ⚠️ **执行方式说明**：🟢 Hook 级 = Claude Code 引擎在每次工具调用后强制运行 Hook 脚本，不依赖 LLM 自觉。🟡 规则级 = 文本写入 system prompt——\"被动加载陷阱\"风险：LLM 在任务模式下可能跳过。🟡 工具级 = 依赖 Claude Code 原生功能，ECC 只提供使用模式。唯一的\"绝对强制执行\"是 `settings.json` 权限白名单。此表反映的是 ECC 当前的最佳努力——距离\"所有钱学森原则都被机械化强制执行\"仍有差距。\n\n**强制执行率**：9 条原则中 — 5 条 Hook 级强制执行，4 条规则级（被动依赖 LLM 自觉）。\n\n---\n\n## 两个二元决策树\n\n### 决策树 1：新能力/规则/检查 — 该放 QSS 还是 ECC？\n\n```\n需要新增一个能力/规则/检查\n  ↓\nQ1: 这个东西有没有具体的文件路径、CLI 命令、或 Hook 脚本？（机械可检测）\n  ├── 没有（是抽象原则/方法论/判断标准） → 属于 QSS（系统学/桥梁层）\n  │     ↓\n  │     Q2: 现有 QSS 框架中，这对应五层大厦的哪一层？\n  │     ├── 哲学 → synthesis-framework.md 哲学层（极少修改）\n  │     ├── 桥梁（系统论）→ synthesis-framework.md 桥梁层\n  │     ├── 基础科学（系统学）→ qian-system-science 核心 skill + learned gates\n  │     ├── 技术科学 → 应该是一个新的 learned gate（遵循 gate-template）\n  │     └── 工程技术 → **这可能应该放 ECC，不是 QSS！** 回到 Q1 重新判断。\n  │\n  └── 有（是具体的文件/脚本/命令） → 属于 ECC\n        ↓\n        Q3: 这东西影响所有项目还是特定场景？\n        ├── 所有项目（如：加一条通用安全规则） → ECC rules/common/ + （如果可行）对应的 Hook\n        │     └── ⚠️ 纯规则无 Hook = 被动加载陷阱风险。考虑：能否做成 Hook？\n        └── 特定场景（如：某语言/某工具的检查） → ECC skills/ 或 ECC hooks/（matcher 精确到场景）\n              └── 同时检查：是否需要在 install profiles 中作为一个可选 component\n```\n\n### 决策树 2：ECC 变更（安装/配置/修改规则）是否对齐钱学森原则？\n\n```\nECC 变更（安装 profile、新增/修改 rule、注册 hook、新建 skill）\n  ↓\nQ1: 变更后，Prompt Defense Baseline（系统边界）是否被削弱或绕过？\n  ├── 是 → ❌ STOP：违反了\"边界清晰\"原则。\n  │        开放的复杂巨系统退化 → 系统不再知道自己是什么。\n  └── 否 → 继续\n            ↓\nQ2: 变更引入了新的执行机制吗（Hook 脚本 / agent / 自动化检查）？\n  ├── 是（有机械执行）→ Q3: 有对应的反馈回路吗（日志 / 评估 / 告警 / 统计数据）？\n  │     ├── 有 → ✅ PASS：对齐\"反馈闭合\"原则\n  │     └── 没有 → ❌ STOP：违反了\"反馈闭合\"原则。\n  │                 只有执行没有反馈 = 系统不知道自己做对没有。\n  └── 否（纯文本规则 / 纯文档）→ ⚠️ WARN：\"规则被动加载陷阱\"风险。\n                                    文本规则依赖 LLM 自觉，在任务模式下可能被跳过。\n                                    考虑：这条规则是否可以升级为 Hook？\n```\n\n---\n\n## 负面示例\n\n### ❌ 负面示例 1：把 ECC 当\"工具包\"，无视系统科学\n\n```markdown\n# ❌ 错误做法：\n# \"ECC 就是一套写好的 rules 和 skills，拿来用就行。\n#  不用想什么系统科学，工具好用就够了。\"\n\n# 为什么错：\n# ECC 的 rules/ 是钱学森\"技术科学\"层（运筹学+控制论+信息论）的工程实现。\n# ECC 的 hooks/ 是\"从定性到定量\"的机械执行点——从\"应该遵守规范\"\n# 到\"必须通过检查\"的飞跃。\n# ECC 的 install profiles 是\"系统工程=组织管理的技术\"的具体体现——\n# 选 minimal 还是 full，本质上是判断这个项目的\"复杂巨系统特征\"需要\n# 多少层基础设施。\n# 理解这个关系后，选择 install profile 就不是\"装多少工具\"的问题，\n# 而是\"这个项目需要多少层反馈和约束\"的问题。\n```\n\n```markdown\n# ✅ 正确做法：\n# 选 ECC install profile 前，先判断项目复杂度：\n# - 单人小脚本 → minimal（5 modules，无 hooks-runtime）\n# - 团队应用开发 → developer（10 modules）\n# - 安全敏感项目 → security（7 modules，但可叠加）\n# - CLAW 这类 Agent 复杂系统 → full（22 modules，全层覆盖）\n# 这个判断本身就是系统工程——不是越多越好，是按需组织。\n```\n\n### ❌ 负面示例 2：加规则不加反馈\n\n```markdown\n# ❌ 错误做法：\n# \"我在 ECC common/ 下加了 5 个新规则文件，覆盖更多边界情况。\"\n# → grep 信号：新增 .md 文件，但没有对应的 hooks/ 或 settings.json 变更\n# → 问题：规则加了，但没有任何 Hook 强制执行，也没有 audit 验证是否生效。\n# → 违反了\"反馈闭合\"原则——系统不知道这些新规则有没有被遵守。\n\n# ✅ 正确做法：\n# \"我在 ECC common/ 下加了 1 个新规则文件。\n#  同时注册了对应的 PreToolUse Hook（matcher 精确到该规则检查的工具类型），\n#  并在 sentinel-state.json 中增加了该规则的遵守率跟踪指标。\n#  30 天后用 framework-adoption-audit 检查实际采用率。\"\n```\n\n---\n\n## grep-able 决策信号\n\n以下检查命令可以在任何 CLAW 项目中运行，快速判断对齐状态：\n\n| # | 检查项 | 命令 | 健康的信号 |\n|---|--------|------|----------|\n| 1 | ECC 规则知晓 QSS？ | `grep -rl \"qss-ecc-alignment\\|钱学森\\|系统科学\" ~/.claude/rules/ecc/` | 至少 2 个文件（session-supervisor.md, command-advisor.md） |\n| 2 | CLAUDE.md 有对齐指针？ | `grep \"qss-ecc-alignment\" CLAUDE.md` | 1 条匹配 |\n| 3 | 哨兵有 Hook 执行（不只是文本）？ | `ls ~/.claude/sentinel-state.json 2>/dev/null && echo \"EXISTS\"` | EXISTS |\n| 4 | 学习闭环在增长（螺旋上升）？ | `grep -c \"^|\" .claude/skills/learned/SKILL.md` | 数字持续增长（当前基准：17） |\n| 5 | 规则被动加载陷阱有防护？ | `grep -c \"Hook\\|PostToolUse\" ~/.claude/hooks.json` | >5（关键规则有对应 Hook） |\n| 6 | Prompt Defense 未被削弱？ | `grep -c \"do not change role\" everything-claude-code/.claude/rules/everything-claude-code-guardrails.md` | ≥1 |\n\n---\n\n## 安装/分发指南\n\n### 当前项目（CLAW）\n\n对齐文档主本位于 `E:\\WorkBuddy\\CLAW\\.claude\\skills\\learned\\qss-ecc-alignment.md`，作为 `learned` skill 自动加载。全局副本在 `~/.claude/skills/learned/` 下，确保 ECC 全局规则也能看到。\n\n### 新项目设置\n\n新增项目要继承 QSS+ECC 对齐体系：\n\n```bash\n# 从 CLAW 项目根目录执行\nCLAW=\"E:/WorkBuddy/CLAW\"\nTARGET=\"/path/to/new-project\"\n\n# ① 复制钱学森系统科学 skill\ncp -r \"$CLAW/.claude/skills/qian-system-science\" \"$TARGET/.claude/skills/\"\n\n# ② 复制对齐文档\nmkdir -p \"$TARGET/.claude/skills/learned\"\ncp \"$CLAW/.claude/skills/learned/qss-ecc-alignment.md\" \"$TARGET/.claude/skills/learned/\"\n\n# ③ 在 CLAUDE.md 头部加上引用\n# （手动编辑，或在 CLAUDE.md 顶部追加以下内容）\ncat >> \"$TARGET/CLAUDE.md\" << 'EOF'\n\n## 🧠 最高指导思想：钱学森系统科学\n详见 /qian-system-science。\nQSS 与 ECC 的工程对齐关系参见 learned: qss-ecc-alignment。\nEOF\n\n# ④ 安装 ECC（已有流程）\ncd \"$TARGET\"\nnpx ecc install --profile full\n```\n\n### 全局副本（使 ECC 全局规则可见）\n\n```bash\nmkdir -p ~/.claude/skills/learned\ncp E:/WorkBuddy/CLAW/.claude/skills/learned/qss-ecc-alignment.md ~/.claude/skills/learned/\n```\n\n主本始终在 CLAW 项目本地维护。全局副本是只读分发——需要修改时改主本，然后重新复制。\n\n---\n\n## 与其他门禁的关系\n\n| 门禁 | 触发时机 | 检查内容 | 与本门禁的关系 |\n|------|---------|---------|-------------|\n| `claude-md-layer-gate` | 修改 CLAUDE.md | 防止 CLAUDE.md 污染（\"怎么做\"不进 CLAUDE.md） | 本门禁是 CLAUDE.md 中 QSS 段落的\"内容提供者\" |\n| `qss-skill-creation-gate` | 创建/修改 skill | 三问（定位/边界/反馈） | 本门禁的决策树 1 是\"三问\"在新组件分类场景的具体化 |\n| `qss-gate-feedback-loop` | 30 天回顾 | 门禁成功率、技能活跃度 | 本门禁的 grep-able 信号是反馈回路的输入数据 |\n| `sentinel-p0-hooks` | 每次 PostToolUse | 异常检测（6 类信号） | 本门禁的方向 B 表追踪哨兵的\"人机结合\"执行状态 |\n| `framework-adoption-audit-method` | 手动触发 | 框架真实采用率 | 本门禁是审计的受检对象之一（D 级执行条目） |\n\n---\n\n## 自反馈回路\n\n> 本文档反复强调\"反馈闭合\"原则。以下是本文档自身的反馈定义。\n\n### 回顾周期\n\n- **常规回顾**：每 30 天随 `qss-gate-feedback-loop` 一起触发回顾\n- **触发回顾**：以下任一信号出现时立即回顾 — (a) 方向B的 grep-able 信号有任何一条返回\"不健康\"；(b) 新增或删除 ECC 的 install module；(c) 哨兵检测到超过 3 次\"决策树被触发但未被遵循\"的异常\n\n### 门禁健康指标\n\n| 指标 | 测量方式 | 健康阈值 | 当前基准（2026-07-01） |\n|------|---------|---------|---------------------|\n| 引用深�� | `grep -rl \"qss-ecc-alignment\"` 然后分类 A/B/C/D | ≥2 个 D 级文件 | CLAUDE.md (C), session-supervisor.md (C), command-advisor.md (C) |\n| 方向B事实准确性 | 逐行检查 Hook 是否存在、脚本是否可执行 | 100% 行与实际一致 | 9/9 已验证 |\n| grep-able 信号有效性 | 运行每个信号命令，确认输出符合\"健康信号\" | 6/6 命令可执行且返回健康 | 6/6 |\n| 决策树使用率 | 查看 `sentinel-log.jsonl` 是否出现\"门禁触发\"事件 | >0 次/30天 | N/A（新门禁） |\n\n### 反馈升级路径\n\n```\n发现问题\n  ↓\nQ1: 是事实错误还是设计缺陷？\n  ├── 事实错误（如：Hook 已下线但方向B表未更新）→ 立即修正本文档\n  └── 设计缺陷（如：决策树Q1仍然太模糊）→ 记录到本文档底部\"待改进清单\"\n                                                  ↓\n                                             30天回顾时决定是否拆分（→方案B）\n```\n\n### 待改进清单\n\n| # | 问题 | 发现日期 | 建议方案 |\n|---|------|---------|---------|\n| 1 | 决策树1的触发条件太模糊（\"需要新增一个能力\"），非机械可检测 | 2026-07-01 | 拆分为两个独立门禁：install-gate（触发=npx ecc install）+ rule-change-gate（触发=Write rules/） |\n| 2 | 决策树2的Q1（\"Prompt Defense Baseline是否被削弱\"）需要理解 Prompt Defense 内容才能判断 | 2026-07-01 | 在门禁内嵌入 Prompt Defense Baseline 的 6 条规则摘要，避免外链 |\n| 3 | 方向B的\"执行方式\"列是快照——如果 ECC 新增 Hook 或移除规则，需要同步更新 | 2026-07-01 | 30天回顾时重新核对 |\n| 4 | ECC 规则可执行性审计：~94 条 MUST 义务，仅 5 条（5.3%）有机械执行保障。安全/测试/审查/流程类规则机械覆盖率为 0% | 2026-07-01 | 审计数据已存档 → learned: [[ecc-rules-enforcement-audit]]。30天观察期内跟踪哨兵日志中有多少次异常由\"该有Hook但没Hook\"直接导致。07-30决策日根据数据决定Hook升级优先级 |\n\n---\n\n## 附：2026-07-01 规则可执行性审计摘要\n\n触发事件：statusline 配置覆盖冲突（`settings.local.json` 内联命令覆盖 `settings.json` → `statusline.js`，导致反追踪盾牌不显示）。\n\n系统级发现：ECC 94 条 MUST/强制义务中：\n- **5 条（5.3%）** 有 Hook 机械执行（哨兵 P0: 3 条、console.log: 1 条、file-size: 1 条）\n- **~10 条** 有 Agent 代理（需 LLM 记得调用）\n- **~79 条** 完全纯文本（依赖 LLM 自觉）\n\n最危险的缺口：**安全清单（16 条 MUST，0% 机械覆盖率）、审查触发（8 条，0%）、开发流程（6 条，0%）**。\n\n详见：`learned: ecc-rules-enforcement-audit`\n\n---\n\n### 第 1 周采集 — 2026-07-02（提前采集，原定 7/5）\n\n| 指标 | 值 | 健康？ |\n|------|-----|:---:|\n| 哨兵状态文件 | EXISTS（550B，最后写入 Jul 2 22:18） | 🟢 |\n| 哨兵告警总数 | 5 条（全部 Type6 silence advisory） | 🟡 |\n| 引用 qss-ecc-alignment 的文件（分级） | A=2, B=1, C=6, D=2 | 🟡 |\n| grep-able 信号 1-6 | 6/6 通过 | 🟢 |\n| ECC 本周有更新？ | 是，4 个 common rules 更新（Jul 1） | 🟢 |\n| gate-results 有新记录？ | 否，目录为空（仅 .gitkeep） | 🔴 |\n\n**备注**：\n\n1. **gate-results 为空** — 30 天观察期已过 12 天（6/20→7/2），`gate-results/` 从未产出结果文件。门禁的设计意图是每次 `/learn-eval` 或 ECC 组件变更时触发对齐审核并写入 gate-results，但实际执行中门禁从未被走过。需确认：是触发条件太模糊（LLM 记不住）还是门禁本身设计过重。\n\n2. **哨兵 Type1-5 零触发** — 5 条告警全部是 Type6（静默警告），Type1（重复重试）、Type2（质量回退）、Type3（静默换方案）、Type4（耗时异常）、Type5（隐形循环）从未触发。两种可能：(a) 实际会话确实没有这些异常（好），(b) 检测阈值太高（需调优）。Type1 最可疑——过往会话中肯定出现过同一操作连续失败 ≥2 次的情况。\n\n3. **ECC 规则 QSS 引用率 1.7%** — 120 个 ECC rules 中仅 `command-advisor.md` 和 `session-supervisor.md` 引用了 QSS（均为 common 层）。zh/、web/、typescript/ 等语言/领域层完全未对齐。考虑到 QSS 是\"最高指导思想\"，这个渗透率偏低。\n\n4. **learned 膨胀到 27 个** — SKILL.md 明确标注 2026-07-30 观察期结束时清理迁移，但 12 天过去了 learned 数量不减反增。learned 的设计寿命是\"观察期暂存\"，不是永久积累。\n\n5. **本周 CLAW 侧 ECC 动作**：`karpathy-guidelines` Hook 自动化落地（4 条 hookify 规则）、ECC 规则可执行性审计、反追踪 statusline 配置冲突修复——都属于技术科学→工程技术层的机械化推进，符合 QSS 方向。\n\n---\n\n## 实施案例：skill-creator QSS Gate Hook 桥接（2026-07-06）\n\n### 背景\n\nAnthropic 官方 `skill-creator` 是一套完整的工程流水线（写草稿→测试→benchmark→迭代→打包），但缺少开工前的设计把关——这个技能该不该建、建在五层大厦哪一层、和已有技能什么关系、反馈回路怎么设计。\n\nQSS 已有 `qss-skill-creation-gate` 定义了这三层门禁，但它是文本规则——依赖 LLM 自觉在创建 skill 前先跑一遍 Gate。这就是 `qss-ecc-alignment` 方向B记录的\"被动加载陷阱\"：94 条 MUST 义务中仅 5.3% 有机械保障。\n\n### 桥接方案：Hook 注入 additionalContext\n\n两个方案被 QSS 自身否决后采纳的方案：\n\n| 方案 | 做法 | QSS 否决原因 |\n|------|------|-------------|\n| 一（松耦合）| LLM 手动先跑 Gate，再调 skill-creator | Q3 失败：纯靠 LLM 自觉，无机械连接 |\n| 二（紧耦合）| QSS Gate 写入 skill-creator SKILL.md | Q1 失败：技术科学寄生在工程技术中 |\n\n**方案三（Hook 桥接）**：PreToolUse Hook 拦截 `Skill` 工具的 `skill-creator` 调用，在工具执行前通过 `additionalContext` 注入 QSS 三层门禁内容。LLM 读完 Gate 后才能进入 skill-creator 的工程流水线。\n\n```\nQSS 层（技术科学）           Hook 层（机械执行）              ECC 层（工程技术）\nqss-skill-creation-         pre:skill:qss-gate              skill-creator\ngate.md                     (hooks.json → stdin/out)        SKILL.md\n（原则定义）                  matcher: \"Skill\"               （工程流水线，不改动）\n      │                           │                              │\n      │  定义三层问答                │  检测到 Skill tool           │\n      ├──────────────────────────→│  + 匹配 skill-creator         │\n                                   │  注入 additionalContext        │\n                                   ├─────────────────────────────→│\n                                   │  记录 gate-results/           │\n                                   │  FAIL → exit 0 放行（不拦截）  │\n```\n\n### 组件清单\n\n| 组件 | 路径 | 类型 |\n|------|------|------|\n| Gate Hook 脚本 | `~/.claude/scripts/qss-skill-gate.js` | 工程技术层（机械执行） |\n| Hook 注册 | `~/.claude/hooks/hooks.json` → `id: pre:skill:qss-gate` | 工程技术层 |\n| CLI 审计模式 | `node ~/.claude/scripts/qss-skill-gate.js --audit <skill>` | 工程技术层 |\n| 对话命令 | `/qss-audit <skill-name>` | 工程技术层 |\n| Gate 结果存档 | `~/.claude/skills/qian-system-science/feedback/gate-results/` | 反馈回路 |\n\n### 双模式设计（关键技术决策）\n\n同一个 Node.js 脚本提供两种运行模式，共用审计引擎：\n\n- **Hook 模式**（stdin/stdout）：读取 PreToolUse JSON → 匹配 `tool_name=Skill` + `skill=skill-creator` → 注入 `additionalContext` → stdout 输出修改后的 JSON → `exit 0` 放行\n- **CLI 模式**（命令行参数）：`--audit <skill-name|skill-path>` 读取 SKILL.md → `parseFrontmatter()` → `detectQSSLayer()` 自动推断层次 → 逐项判定 Q1/Q2/Q3 → stdout 格式化报告 → `exit 1` if FAIL\n\n两种模式共享同一套审计引擎（`auditSkill()`, `checkQ2()`, `checkQ3()`），保证 CLI 审计结果和 Hook 注入的标准一致。\n\n### 方向B对齐影响\n\n本落地将\"人机结合、以人为主\"原则的执行方式从 🟡 规则级升级为 🟢 Hook 级：\n\n| 之前 | 之后 |\n|------|------|\n| LLM 读到 learned 文本，自觉决定是否跑 Gate | Hook 引擎在 Skill 工具调用前机械注入 Gate |\n| 无日志，无法审计 Gate 是否被触发 | 每次触发写入 `gate-results/` JSON 日志 |\n| Gate 是独立流程，和 skill-creator 无连接 | Gate → additionalContext → skill-creator 形成机械流水线 |\n\n### 效果数据（待采集，2026-08-06 回顾）\n\n- Gate 触发次数\n- 新建/修改 skill 的 QSS frontmatter 覆盖率（`qss_layer`, `qss_overlap_group`, `review_date`）\n- `/qss-audit --audit-all` 全局技能 PASS 率变化", "mtime": "2026-07-06"}, {"file": "ecc-rules-enforcement-audit.md", "title": "ECC 规则可执行性审计", "desc": "", "body": "> 审计日期：2026-07-01 | 触发事件：statusline 配置覆盖冲突（settings.json vs settings.local.json）| 下次复审：2026-07-30\n\n## 摘要\n\nECC 规则体系共有 **~94 条 MUST/强制 级别义务**，但仅 **~4 条**（4.3%）有确认真实的机械执行保障。这是 [[rules-passive-loading-trap]] 的量化确认。\n\n> **2026-07-02 修正**：审计时（07-01）sentinel-timing.js 被误标为 ✅ 已生效 — 脚本文件存在但未在任何 settings/hooks.json 中注册。已纠正为 ⚠️，并于同日注册到 `settings.local.json` PostToolUse。修正后基线：4 条有效 Hook（ecc-context-monitor + 2×console.log + gateguard-fact-force），1 条脚本存在未注册（sentinel-timing.js→已修复）。暴露了更深层问题：**连审计自身的准确率也无法保障**。\n\n## 规则义务完整清单（MUST/强制 级别）\n\n### common/ 通用规则\n\n| # | 文件 | 义务 | 有无机械保障 |\n|---|------|------|:---:|\n| 1 | agents.md | 并行任务执行优先于顺序执行 | ❌ |\n| 2 | git-workflow.md | 提交消息格式：`<type>: <description>` | ❌ |\n| 3 | hooks.md | 永远不用 `dangerously-skip-permissions` | ❌ |\n| 4 | hooks.md | 配置 `allowedTools` 而非跳过权限 | ❌ |\n| 5 | security.md | 无硬编码密钥 — 每次提交前 | ❌ |\n| 6 | security.md | 所有用户输入已验证 — 每次提交前 | ❌ |\n| 7 | security.md | SQL 注入防护（参数化查询）— 每次提交前 | ❌ |\n| 8 | security.md | XSS 防护（净化 HTML）— 每次提交前 | ❌ |\n| 9 | security.md | CSRF 保护已启用 — 每次提交前 | ❌ |\n| 10 | security.md | 认证/授权已验证 — 每次提交前 | ❌ |\n| 11 | security.md | 所有端点启用速率限制 — 每次提交前 | ❌ |\n| 12 | security.md | 错误消息不泄露敏感数据 — 每次提交前 | ❌ |\n| 13 | security.md | 永远不用硬编码密钥 | ❌ |\n| 14 | security.md | 始终用环境变量或密钥管理器 | ❌ |\n| 15 | security.md | 启动时验证所需密钥是否存在 | ❌ |\n| 16 | security.md | 安全响应协议：STOP → security-reviewer → 修复 CRITICAL → 轮换密钥 → 审查全代码 | ❌ (Agent) |\n| 17 | testing.md | 最低测试覆盖率：80% | ❌ |\n| 18 | testing.md | 全部三种测试类型：Unit + Integration + E2E | ❌ |\n| 19 | testing.md | TDD 工作流：RED → GREEN → REFACTOR → 验证 80%+ | ❌ |\n| 20 | session-supervisor.md | 检测重复重试（≥2 次连续失败）→ 暂停 | ❌ (LLM 自监控) |\n| 21 | session-supervisor.md | 检测质量回退 → 暂停 | ❌ (LLM 自监控) |\n| 22 | session-supervisor.md | 检测静默换方案 → 暂停 | ❌ (LLM 自监控) |\n| 23 | session-supervisor.md | 检测耗时异常（>3x 预期）→ 暂停 | ⚠️ Hook脚本存在（sentinel-timing.js），2026-07-02 前未注册到Hook引擎 |\n| 24 | session-supervisor.md | 检测隐形循环（≥3 次同类/5min）→ 暂停 | ✅ Hook: ecc-context-monitor.js |\n| 25 | session-supervisor.md | 检测长时间无反馈（≥60s）→ 暂停 | ✅ Hook: ecc-context-monitor.js |\n| 26 | session-supervisor.md | 触发后使用标准询问格式 | ❌ (LLM 自监控) |\n| 27 | command-advisor.md | 启动协议：每次对话开始前必须读 CLAUDE.md → task_plan.md → memory | ❌ |\n| 28 | command-advisor.md | 收尾门禁：5 项全部通过才能 /clear | ❌ |\n| 29 | command-advisor.md | 禁止在门禁通过前推荐 /clear | ❌ |\n| 30 | command-advisor.md | 禁止跳过门禁直接推荐 /clear | ❌ |\n| 31 | command-advisor.md | 禁止把门禁项当\"建议\"而非\"必须\" | ❌ |\n| 32 | karpathy-guidelines.md | 先想再写：陈述假设、呈现全部解释、主动呈现权衡、不清楚就停 | ❌ |\n| 33 | karpathy-guidelines.md | 简单优先：无推测性功能、无单次使用抽象、无未请求灵活性、无不可能场景错误处理 | ❌ |\n| 34 | karpathy-guidelines.md | 精准变更：只碰必须改的、不改相邻代码、不重构没坏的东西、匹配已有风格 | ❌ |\n| 35 | karpathy-guidelines.md | 目标驱动执行：定义成功标准、循环直到验证通过 | ❌ |\n| 36 | coding-style.md | 不可变性：始终创建新对象，永不修改已有对象 | ❌ |\n| 37 | coding-style.md | 错误处理：每层显式处理、提供用户友好消息、记录详细上下文、永不静默吞错 | ❌ |\n| 38 | coding-style.md | 输入验证：系统边界验证、基于模式、快速失败、永不信任外部数据 | ❌ |\n| 39 | coding-style.md | 代码质量检查清单：可读、函数<50行、文件<800行、嵌套<4层、正确处理错误、无硬编码值、无变异 | ❌ |\n| 40 | code-review.md | 审查触发：编写/修改代码后 | ❌ |\n| 41 | code-review.md | 审查触发：提交到共享分支前 | ❌ |\n| 42 | code-review.md | 审查触发：安全敏感代码变更时 | ❌ |\n| 43 | code-review.md | 审查触发：架构变更时 | ❌ |\n| 44 | code-review.md | 审查触发：合并 PR 前 | ❌ |\n| 45 | code-review.md | 审查前要求：CI/CD 通过、合并冲突解决、分支与目标同步 | ❌ |\n| 46 | code-review.md | 审查检查清单：10 项 | ❌ |\n| 47 | code-review.md | 安全审查 STOP 触发：认证、用户输入、数据库、文件系统、外部 API、加密、支付 — 必须用 security-reviewer | ❌ (Agent) |\n| 48 | code-review.md | 严重级别：CRITICAL=阻断、HIGH=警告 | ❌ |\n| 49 | development-workflow.md | /plan 先、确认、再 /tdd。永不跳过确认门槛 | ❌ |\n| 50 | development-workflow.md | 研究优先：GitHub 代码搜索 → 库文档 → Exa → 包注册表 → 适配实现 | ❌ |\n\n### web/ 前端规则\n\n| # | 文件 | 义务 | 有无机械保障 |\n|---|------|------|:---:|\n| 51 | design-quality.md | 不输出通用模板外观 UI | ❌ |\n| 52 | design-quality.md | 禁用 8 种模板模式 | ❌ |\n| 53 | design-quality.md | 每个有意义的界面至少体现 10 项质量中的 4 项 | ❌ |\n| 54 | performance.md | Core Web Vitals：LCP<2.5s、INP<200ms、CLS<0.1 | ❌ |\n| 55 | performance.md | Bundle 预算：Landing<150kb JS、App<300kb JS | ❌ |\n| 56 | security.md | 始终配置生产环境 CSP | ❌ |\n| 57 | security.md | 永不注入未净化 HTML | ❌ |\n| 58 | security.md | 所有状态变更表单 CSRF 保护 | ❌ |\n| 59 | security.md | 提交端点速率限制 | ❌ |\n| 60 | security.md | 客户端和服务端双重验证 | ❌ |\n\n### typescript/ 语言规则\n\n| # | 文件 | 义务 | 有无机械保障 |\n|---|------|------|:---:|\n| 61 | coding-style.md | 导出函数、共享工具、公共类方法加类型标注 | ❌ |\n| 62 | coding-style.md | 避免 `any`（用 `unknown` + 安全收窄） | ❌ |\n| 63 | coding-style.md | 组件 Props 用命名接口/类型；回调显式标注 | ❌ |\n| 64 | coding-style.md | 生产环境禁止 `console.log` | ✅ Hook: post-edit-console-warn + stop:check-console-log |\n| 65 | security.md | 永不硬编码密钥 | ❌ |\n| 66 | security.md | 始终用环境变量 | ❌ |\n| 67 | security.md | 启动时验证 | ❌ |\n| 68 | testing.md | Playwright 作为 E2E 测试框架 | ❌ |\n\n### zh/ 中文翻译（与 common/ 义务一致）\n\n| # | 文件 | 义务 | 有无机械保障 |\n|---|------|------|:---:|\n| 69-94 | 所有 zh/ 文件 | 与 common/ 对应文件相同的 MUST 义务（中文表述） | 同对应文件 |\n\n---\n\n## 现有机械执行机制\n\n### A. 真正的机械执行（Hook，不可被 LLM 跳过）\n\n| # | Hook | 类型 | 执行内容 |\n|---|------|------|---------|\n| 1 | config-protection | PreToolUse | 禁止修改 linter/formatter 配置文件 |\n| 2 | mcp-health-check | PreToolUse | 禁止调用不健康的 MCP 服务器 |\n| 3 | gateguard-fact-force | PreToolUse | 首次编辑文件必须先调查 |\n| 4 | simplify-gate | UserPromptSubmit | 400 LOC 警告、800 LOC 阻断（发运动词） |\n| 5 | privacy-block | PreToolUse | 禁止访问 .env, .pem, .key, id_rsa |\n| 6 | scout-block | PreToolUse | 禁止访问 node_modules/.git 等 |\n| 7 | dangerous-cmd-block | PreToolUse | 禁止 git push --force、git reset --hard、rm -rf |\n| 8 | post-edit-console-warn | PostToolUse | 编辑后警告 console.log |\n| 9 | stop:check-console-log | Stop | 每次响应后检查 console.log |\n| 10 | stop:format-typecheck | Stop | 批量 Biome/Prettier + tsc |\n| 11 | post:quality-gate | PostToolUse | 每次编辑后格式化/检查 |\n| 12 | ecc-context-monitor | PostToolUse | 哨兵异质循环+静默检测+自限 |\n| 13 | sentinel-timing | PostToolUse | 哨兵耗时异常检测 |\n| 14 | design-quality-check | PostToolUse | 前端编辑偏离模板外观时警告 |\n| 15 | doc-file-warning | PreToolUse | 非标准文档文件警告 |\n\n### B. Agent 代理执行（需 LLM 记得调用）\n\n共 65 个 Agent，其中强制执行类：code-reviewer、security-reviewer、tdd-guide、silent-failure-hunter、code-simplifier、performance-optimizer + 20+ 语言专属审查器。\n\n### C. 执行保障覆盖率\n\n| 分类 | MUST 义务数 | 有机械保障 | 覆盖率 |\n|------|:----------:|:--------:|:-----:|\n| 安全（security.md） | 16 | 0 | 0% |\n| 测试（testing.md） | 3 | 0 | 0% |\n| 哨兵（session-supervisor.md） | 8 | 3 | 37.5% |\n| 编码风格/行为 | 17 | 1 (console.log) | 5.9% |\n| 审查/开发流程 | 13 | 0 | 0% |\n| 前端（web/） | 10 | 0 | 0% |\n| 语言（typescript/） | 8 | 1 | 12.5% |\n| **合计** | **~94** | **5** | **5.3%** |\n\n> **2026-07-02 修正**：上表中的 5 条包含了 sentinel-timing.js（审计时误标为 ✅，实际未注册到 Hook 引擎，于同日修复）。审计时的真实有效数为 4（4.3%）。修复后回到 5（5.3%）。\n\n注：5 个有机械保障的义务中，3 个是哨兵 P0 Hook 实现的（其中 sentinel-timing.js 审计后验证发现未注册，已修复），2 个是 console.log Hook。严格来说 console.log 不是\"规则规则\"而是\"代码卫生\"——**真正的业务/安全/流程规则，机械覆盖率为 3.2%（3/94）。**\n\n---\n\n## 与 QSS 观察期对齐\n\n此文件作为 **QSS-ECC 对齐文档参考源**，在 30 天观察期内（2026-07-01 → 2026-07-30）输入决策矩阵。关键指标：\n\n- **参考深度目标**：从 C 级（本文被引用）→ D 级（被 grep 命令引用）\n- **采集周**：每周日与 `qss-ecc-alignment.md` 的 6 个信号一起采集\n- **07-30 决策**：根据哨兵日志中\"本应有机械保障的规则缺位导致实际异常\"的次数，决定 Hook 升级优先级\n\n## 历史版本\n\n- v1.0 (2026-07-01): 初始审计，基线 5.3%，触发事件 = statusline 配置覆盖冲突\n\n## 信号3（静默换方案）LLM 自监控失效实证\n\n### 2026-07-06 事件：LAW-AI 会话中 Write 后输出完全无关内容\n\n**事件描述**：\n\n1. 用户请求\"综合计时工资，加班费计算方法\" → 正常回复\n2. 用户请求\"计算方式和公式和计算方法总结；按照三年超时工时汇总计算\" → 正常回复，代入 492h 数据\n3. 用户请求\"整理为 html 文档\" → Write 工具成功创建文件（文件正确）\n4. **然后**：下一段输出突然开始讨论 Node.js `fs` 模块、Workflow 脚本限制——与对话主题（加班费计算/HTML 文档/LAW-AI 个案管理）**完全无关**\n\n**根因分析**：\n\n- 直接原因：模型在任务完成后未自检回复相关性，脑补了一段不存在的对话主题\n- 深层原因：Karpathy #4（Goal-Driven Execution）的\"验证\"步骤被跳过——成功标准隐含设定为\"文件创建即完成\"，而非\"用户请求被完整连贯地回应\"\n- 系统原因：信号3（静默换方案）在审计表中标注为 `❌ (LLM 自监控)`——本次事件是\"LLM 自监控不可靠\"的直接证据\n\n**处理方式**：\n\n1. CLAUDE.md 追加\"任务完成自检\"规则（依据 Karpathy #4）\n2. 不创建 learned skill——QSS 层次定位为技术科学层，不进工程技术层\n3. 本记录作为 07-30 P1 Hook 化决策的数据点\n\n**07-30 影响**：如果 Claude Code 在 07-30 前支持 PreResponse Hook 或 PostToolUse 的内容相关性检测，信号3 应从 \"LLM 自监控\" 升级为 Hook 层强制执行。本次事件是支持此优先级的实证。", "mtime": "2026-07-06"}, {"file": "unreachable-url-workaround.md", "title": "外部 URL 不可达时的三级降级策略", "desc": "When WebFetch/curl fail on a URL, try proxy first (v2rayN 10808), then fall back to WebSearch from search-engine caches", "body": "**Extracted:** 2026-07-05\n**Context:** 安装 browser-use 时 GitHub / raw.githubusercontent.com 不可达，v2rayN 代理（10808）开着但 curl 和 WebFetch 没走代理。修正了跳过代理检查直接降级的错误。\n\n## Problem\n\n`WebFetch` 和 `curl` 对某些域名返回失败：\n\n```\nWebFetch: \"Unable to verify if domain github.com is safe to fetch\"\ncurl:     直接连接超时或拒绝\n```\n\n**常见原因**：工具默认不走系统代理。v2rayN 开着但 curl/WebFetch 直连，仍然不可达。\n\n## Solution — 三级降级链路\n\n**必须按顺序执行，不要跳级：**\n\n### 第一级：尝试走代理\n\n```bash\n# 已知代理：v2rayN 默认 http://127.0.0.1:10808\n\n# curl 走代理\ncurl -x http://127.0.0.1:10808 -sL \"https://raw.githubusercontent.com/...\" -o output\n\n# 或设环境变量后直连\nexport http_proxy=http://127.0.0.1:10808\nexport https_proxy=http://127.0.0.1:10808\ncurl -sL \"https://raw.githubusercontent.com/...\" -o output\n\n# 诊断：先确认代理是否可达\ncurl -x http://127.0.0.1:10808 -I https://www.google.com\n```\n\n### 第二级：代理可用但目标仍不可达\n\n检查代理本身是否工作，换个端口/协议试试。\n\n### 第三级：代理不可用 → WebSearch 降级\n\n代理没开或代理也访问不了 → 用搜索引擎缓存和摘要获取同样信息。\n\n```bash\n# 对文档类信息构造精确搜索词\nWebSearch \"browser-use MCP_BROWSER_HEADLESS CDP configuration\"\nWebSearch \"browser-use SKILL.md claude code skill file content\"\n```\n\n搜索引擎返回的摘要片段通常包含原文核心信息，足以完成配置。\n\n## 为什么 WebSearch 能通而直连不通\n\n```\nWebFetch/curl 直连 → github.com → ❌ 被阻断\nWebFetch/curl + 代理 → 经 v2rayN → ✅ 代理开着时能通\nWebSearch → 搜索引擎 API → ✅ 不管代理开没开都能通（不同出口）\n```\n\n## When to Use\n\n- `WebFetch` 返回 \"Unable to verify\" 或超时\n- `curl` 到 raw.githubusercontent.com 失败\n- 任何需要从 GitHub/PyPI/外部文档站获取信息但直连失败时\n\n## When NOT to Use\n\n- 代理开着 → 先走代理，不要跳去 WebSearch\n- 需要登录的内容（搜索引擎缓存不到）→ 必须走代理\n- 需要完整页面内容（WebSearch 摘要可能截断复杂表格和代码块）", "mtime": "2026-07-05"}, {"file": "claude-code-mcp-config-location.md", "title": "Claude Code MCP 配置位置：.mcp.json vs settings.json", "desc": "Claude Code MCP servers go in .mcp.json, NOT in settings.json — settings.json schema rejects the mcpServers field", "body": "**Extracted:** 2026-07-05\n**Context:** 配置 browser-use MCP Server 时，试图在 `settings.json` 中加 `mcpServers` 字段，被 JSON Schema 验证拒绝。\n\n## Problem\n\n给 Claude Code 配置 MCP Server 时，直觉上会把配置放在 `settings.json` 中：\n\n```json\n// ❌ settings.json — 这行不通！\n{\n  \"mcpServers\": {\n    \"my-server\": { ... }\n  }\n}\n```\n\n**结果：** Claude Code 报错 `Unrecognized field: mcpServers`。`settings.json` 有严格的 JSON Schema 验证，`mcpServers` 不是合法字段。\n\n## Solution\n\nMCP Server 配置放在**独立文件**中，不在 `settings.json` 里：\n\n| 文件 | 作用域 | 路径 |\n|------|--------|------|\n| `.mcp.json` | 项目级 | `<project-root>/.mcp.json` |\n| `.mcp.json` | 用户级 | `~/.claude/.mcp.json` (global) |\n\n```json\n// ✅ .mcp.json — 这才是正确位置\n{\n  \"mcpServers\": {\n    \"browser-use\": {\n      \"command\": \"uvx\",\n      \"args\": [\"mcp-server-browser-use@latest\"],\n      \"env\": {\n        \"MCP_LLM_PROVIDER\": \"deepseek\",\n        \"MCP_LLM_MODEL_NAME\": \"deepseek-v4-flash\",\n        \"MCP_LLM_DEEPSEEK_API_KEY\": \"sk-...\",\n        \"MCP_BROWSER_HEADLESS\": \"false\"\n      }\n    }\n  }\n}\n```\n\n## 两文件的职责分界\n\n| | `settings.json` | `.mcp.json` |\n|---|---|---|\n| **放什么** | env, permissions, hooks, model, theme, sandbox, plugins... | mcpServers |\n| **不放什么** | ❌ mcpServers | ❌ 其他 settings |\n| **Schema 验证** | ✅ 严格 | ✅ 严格 |\n| **优先级** | user < project < local < flag < policy | 同左 |\n\n## When to Use\n\n- 任何需要给 Claude Code 添加 MCP Server 的时候\n- 看到 `Unrecognized field: mcpServers` 错误时\n- 第一次在项目中配置 MCP 时", "mtime": "2026-07-05"}, {"file": "methodology-output-sanitization.md", "title": "方法论输出净化——别让读者看到你的手法", "desc": "使用说服框架改写文档时，禁止在输出中暴露方法论术语和操纵痕迹", "body": "**Extracted:** 2026-07-04\n**Context:** 用 chonggou-xianshi + content-jiagoushi 改写正式公文（劳动争议反映材料），初版暴露了方法论框架用语，用户指出\"外在形式就是正常的文章，调用的方法技能不要给别人看\"。\n\n## Problem\n\n当用说服/改写框架（chonggou-xianshi、content-jiagoushi、bianxian 等）处理输出文本时，容易直接把框架的内部术语写入输出。读者看到这些术语会意识到\"有人在对我说服\"，触发防御心理——这与框架的目的恰恰相反。\n\n典型的暴露痕迹：\n- \"接受这三个认知后，结论会自己浮现\"（告诉读者你在植入认知）\n- \"三个无法反驳的事实\"（告诉读者你设计了不可反驳的前提）\n- \"逻辑滑梯\"\"认知植入\"等框架概念出现在正文中\n- 任何元叙述：告诉读者\"你应该怎么读这篇东西\"\n\n## Solution\n\n**写完后做一次专门的\"去痕检查\"**，扫描并替换以下暴露模式：\n\n### 暴露 → 净化对照表\n\n| 暴露写法（删除） | 净化写法（替换） |\n|----------------|-----------------|\n| \"读完这三个认知……结论会自己浮现\" | \"有必要先厘清三个基本事实\" |\n| \"无法反驳的事实/认知\" | \"基本事实\" |\n| \"逻辑滑梯\"\"认知植入\"\"钩子\"等框架术语 | 永远不出现，用普通中文表达 |\n| \"接受了X之后，你自然会得出Y\" | \"基于X，Y是必然的\"（直接陈述，不预告） |\n| \"我希望你先读完这三条\"（指导读者阅读顺序） | 直接列出三条，让结构本身引导阅读 |\n| 标题里写\"核心认知\" | 写\"基本事实\"\"核心问题\"\"报告事项\" |\n| 任何暗示\"我正在对你使用某个框架/方法\"的语句 | 删除，让内容自己说话 |\n\n### 核心原则\n\n> **框架是你的内部工具，不是读者该看到的东西。**\n> 读者看到的应该是一篇\"本来就该这么写\"的正常文章，不是一篇\"被某个方法论处理过\"的文章。\n\n### 去痕检查清单\n\n在输出最终版本前，逐条检查：\n\n- [ ] 有没有出现\"认知植入\"\"逻辑滑梯\"\"钩子\"\"框架\"等词？\n- [ ] 有没有告诉读者\"你应该怎么读\"？（如\"先读完这三条\"\"结论会自己浮现\"）\n- [ ] 有没有在标题/引言中暴露文章的组织逻辑？（如\"三个无法反驳的事实\"）\n- [ ] 读起来像不像一篇正常的、未经\"处理\"的正式文档？\n\n**金标准**：让一个不知情的第三方读者读一遍，他会不会觉得\"这人写得很自然\"，而不是\"这人在对我用什么心理技巧\"。\n\n## When to Use\n\n- 每次用 chonggou-xianshi / content-jiagoushi / bianxian 等说服框架改写输出文本时\n- 任何涉及\"把方法论应用于最终输出\"的场景\n- 特别是正式公文、邮件、报告等读者预期看到自然文本的场景\n- 简单说：写完任何面向第三方的文本后，跑一遍去痕检查", "mtime": "2026-07-04"}, {"file": "agnes-video-pipeline-constraints.md", "title": "Agnes Video v2.0 Pipeline Constraints", "desc": "Agnes Video v2.0 pipeline constraints — API limits (5min/seg, 429 serial-only, 503), FFmpeg extension options (Bookend/Palindrome/Loop), and time-budget rules. Extension method is per-segment creative decision, not default.", "body": "**Extracted:** 2026-07-03\n**Context:** AI Video Factory 混合管线实测 — prompt-optimizer + Agnes Image/Video + MOSS-TTS + FFmpeg 全链路跑通，产出 111.9s 成品 (60分基准)\n\n## Problem: Agnes Video API 的限制\n\n2026-07-03 实测数据 (3 段 Video 并行提交):\n\n| 指标 | 实测值 |\n|------|--------|\n| 排队 + 生成 | **~5 分钟/段** (V1=199s/32polls, V2=260s/42polls) |\n| 并发限制 | **串行 — 并行提交 = HTTP 429** |\n| 上游稳定性 | 偶尔 503 (`ServiceUnavailableError: no available server`) |\n| 单段产出 | 2.04s, 49 frames @24fps, 1088×832 H.264+AAC |\n| 原生音频 | 有 (AAC stereo 48kHz)，但视频配音应用独立 TTS 替换 |\n\n**结论**: 一段 Video = 5 分钟等待。1 分钟视频最多 3 段 Video (15min 总等待)。\n\n## 2s → 更长: FFmpeg 延长方案（测试结论，非默认）\n\n2026-07-03 实测了 4 种方案，**效果取决于具体视频内容 — 无统一\"推荐方案\"**:\n\n| 方案 | 命令 | 成品 | 接缝 | 适用范围 |\n|------|------|:---:|:---:|------|\n| Stream Loop 三段 | `-stream_loop 2` | 6s | 可见(硬切) | 仅抽象运动(粒子/星云/雾) |\n| Palindrome 来回 | `split→reverse→concat` | 6s | 自然 | 匀速运镜(camera push/pull) |\n| Bookend Freeze 定格 | `trim+loop+concat` | 5s | 无缝 | 标题留白，静止→运动→静止 |\n| Xfade 慢速叠化 | `xfade=fade` | 4.2s | 完美 | 抽象场景，接缝完全不可见 |\n\n**是否延长、用哪个方案、延长到几秒，是每段 Video 独立的创意决策，不是流水线默认行为。**\n\n## 时间预算公式（1 分钟视频）\n\n```\nmax_video_segments = 3  (串行: 3 × 5min = 15min)\nsegment_raw         = 2s (49f/24fps)\nextension_method    = 创意决策 (不延长 / Loop×3 / Palindrome / Bookend)\nvideo_coverage      = 取决于决策 (最大 3×6s=18s, 最小 3×2s=6s)\nimage_coverage      = 60s - video_coverage → Image × N 段\n```\n\n如果 Video 选了 2 段且都延长到 6s: Video=12s, Image=48s (6 段 × 8s)\n如果 Video 选了 3 段且都不延长: Video=6s, Image=54s (7 段 × 8s)\n\n## Style Anchor 规则（风格统一保证）\n\n实测验证: 将 `visual_style` + `color_palette` **逐字复制**到每个 Image prompt 和 Video prompt 的头部，2 个不同模型 (Agnes Image/Video) 的输出色调一致。\n\n```\n# 在每个 prompt 开头重复:\n\"deep space cyber-minimal — dark backgrounds,\n neon accent lines (#00E5FF cyan, #7C3AED violet),\n subtle particle drift, clean geometric overlays\"\n```\n\n## MOSS-TTS 性能数据\n\n| 指标 | 实测值 |\n|------|--------|\n| 文案长度 | 309 chars (中文, 含标点) |\n| API 耗时 | 44.6s |\n| 产出音频 | 109.2s, 24kHz mono, 5.2MB |\n| 倍速 | ~2.4x realtime (44.6s → 109.2s audio) |\n\n**音频/视频时长匹配**: 配音时长 (109s) 远超 60s 视频目标。需要裁剪文案或将视频延长到 ~110s。这是本次测试的已知问题 — 未经校验直接合成。\n\n## 管线评分: 60/100 — 不足项\n\n| # | 问题 | 状态 |\n|---|------|:---:|\n| 1 | V3 Video 503 失败 | API 波动，非可控 |\n| 2 | 音频 109s / 视频 60s 不匹配 | 文案未按目标时长裁剪 |\n| 3 | HyperFrames HTML 动效层未跑 | 文字层只用了 FFmpeg drawtext |\n| 4 | 字幕按段对齐，非按词时间戳 | TTS 未生成 word-level timestamps |\n| 5 | Video↔Image 过渡无 xfade | FFmpeg concat 用了硬切 |\n| 6 | 品质轨 HyperFrames 编排未自动化 | 手工写了 FFmpeg filter_complex |\n| 7 | 未用 HyperFrames registry block/component | 缺失 registry 集成 |\n\n## When to Use\n\n- 规划 Agnes Video API 调用次数和时间预算\n- 决定 Video 段的延长策略时 (参考 4 种方案的表)\n- 写 Image/Video prompt 时 (Style Anchor 规则)\n- 预算 1 分钟视频的 Video/Image 比例\n- MOSS-TTS 性能预估 (2.4x realtime)", "mtime": "2026-07-03"}, {"file": "ecc-os-compliance.md", "title": "ECC 操作系统合规 —— 从参考书到铁律", "desc": "ECC是操作系统不是参考书——每一次绕过ECC门禁都产生同质失败链。触发：改文件/加新东西/审计之前必须查询已运行的ECC约束", "body": "**Extracted:** 2026-07-01\n**Context:** statusline 配置覆盖冲突事件 + QSS 审计重复造轮子——同一会话中连续 6 次绕过 ECC 门禁\n\n## 问题\n\nECC 是 CLAW 项目的运行系统（Hooks/Agents/Rules/Gates），但我把它当参考书读而不是操作系统执行。\n\n2026-07-01 会话中连续 6 次违规的证据链：\n\n| # | 做了什么 | 绕过了什么 | 为什么是系统性故障 |\n|---|---------|-----------|-----------------|\n| 1 | 改 statusline.js，没先 grep 覆盖 | karpathy-guidelines #1 — Think Before Coding | 被动规则 = 不执行 |\n| 2 | 启动 QSS 审计，不知三轨观察期已运行 | QSS 30 天采集日历 | 没先查已有计划 |\n| 3 | 审计后立即提加 Hook 方案 | gate-deferral-observation-period（30天不新增）+ 决策树 2（新机制需反馈回路） | 没读门禁就施工 |\n| 4 | 没查 learned skill 是否有同类教训 | learned SKILL.md（21 条已有） | 没利用知识库 |\n| 5 | 写入审计数据，没经过 QSS 决策树验证 | qss-ecc-alignment 决策树 2 | 审计结果本身也需要审计 |\n| 6 | 改 statusline.js 后没调 code-reviewer | code-review.md（MUST 触发：代码修改后） | 审查门禁被跳过 |\n\n**根本原因：**\n\nECC 在 system prompt 里被加载为一个巨大的规则目录。面对任务请求（\"反追踪\"、\"做个审计\"），我进入任务模式，自然的执行路径是\"做完任务\"而不是\"先过 ECC 门禁\"。\n\n这是 [[rules-passive-loading-trap]] 的**执行端对应物**：不只是规则没触发，而是整个操作系统被当作参考书，想读才读。\n\n## 解决方案\n\n### 行为约束（对我自己）\n\n在做以下动作**之前**，必须依次完成三个查询：\n\n| 动作类别 | 必须查什么 | 具体命令 |\n|---------|-----------|---------|\n| 修改任何有覆盖层级的配置文件 | 查该 key 的全部定义点 | `grep -rn \"keyName\" .claude/settings*.json ~/.claude/settings*.json` |\n| 新增任何东西（Hook/规则/计划/skill） | 查 QSS 三轨观察期状态 | 读 `learned: qss-ecc-alignment` + `learned: gate-deferral-observation-period` |\n| 审计/诊断/改进建议 | 查 learned skill 是否有同类教训 | `grep -i \"keyword\" .claude/skills/learned/*.md` |\n| 改完代码（任意 Write/Edit） | 调 code-reviewer | 每次 Write/Edit 后自动触发 |\n\n### ECC 作为操作系统的核心含义\n\n不是所有 ECC 规则都需要被执行——**但门禁和审查规则是唯一的例外：它们本身就是\"无执行保障时唯一剩下的防线\"**。\n\n当这最后的防线被绕过时，系统从\"人不完全可靠但有安全网\"退化为\"人全靠自觉\"。\n\n## 何时使用\n\n触发条件（任一满足）：\n1. 用户在执行的任何任务出现**重复性失败**（同一类问题被指出 ≥2 次）\n2. 发现自己的行为越过了已有门禁/审查机制\n3. 新会话开始时（初始化检查点：当前 ECC 观察期状态是什么？）\n\n## Related\n\n- [[rules-passive-loading-trap]] — ECC 规则为什么不执行的根因\n- [[ecc-rules-enforcement-audit]] — 94 条 MUST 义务仅 5 条机械保障\n- learned: qss-ecc-alignment — 双向映射 + 决策树\n- learned: gate-deferral-observation-period — 30 天观察期\n- learned: engine-first-data-defers-model — Hook 先跑、数据驱动 Agent\n- [[settings-override-hierarchy-trap]] — 配置覆盖层级的具体记录", "mtime": "2026-07-01"}, {"file": "guideline-to-hook-pipeline.md", "title": "行为准则 → Hook 自动化管线", "desc": "三层落地管线：行为准则(基础科学)→检测信号(技术科学)→Hookify+测试(工程技术)，把纸面规则升级为机械执行", "body": "**Extracted:** 2026-07-01\n**Context:** 将 karpathy-guidelines 的 EXAMPLES.md 从纸面反面案例转化为 4 条 Hookify 规则 + 33 个测试用例。管线本身可复用于任何行为准则文档。\n\n## Problem\n\n行为准则文档（如 karpathy-guidelines、coding-style、security rules）定义了什么该做、什么不该做，但执行完全依赖 LLM 自觉。规则在 system prompt 里 ≠ 规则被执行（[[rules-passive-loading-trap]]）。\n\n直接跳到\"写个 Hook\"也有问题——不知道检测什么信号、不知道误报率多高、不知道 regex 是否覆盖了边界情况。\n\n## Solution\n\n**三层落地管线**：每一层有不同的产出物和验收标准。\n\n```\n基础科学层                      技术科学层                    工程技术层\n(违规分类学)                    (检测算法)                    (Hook+测试)\n─────────────────────────────────────────────────────────────────────\nEXAMPLES.md           →       detection-patterns.md    →     4 条 hookify 规则\n定性描述                       定量检测信号                    机械执行\n\"什么是违规\"                   \"怎么检测违规\"                  \"违规时做什么\"\n                              + 误报率估计                    + 33 个测试用例\n                              + 决策树                        + regex 验证脚本\n```\n\n## When to Use\n\n触发条件：\n- 你有一个行为准则文档，想把它从\"被动文本\"升级为\"主动检查\"\n- 你发现某条规则反复被违反，想加自动化拦截\n- 你要判断某个检测信号应该放 Hookify 还是 JS Hook 还是 System Prompt\n\n## 管线步骤\n\n### Step 1: 基础科学层 — 违规分类\n\n输入：行为准则文档（如 EXAMPLES.md）\n输出：每条规则的违规信号清单，标注\"可检/不可检\"\n\n关键问题：\n- 这个违规是什么样的？（从反面案例中提炼信号）\n- 它在真实 LLM 行为中频率多高？（决定优先级）\n- 它能不能被机械检测？（决定放哪一层）\n\n### Step 2: 技术科学层 — 检测算法\n\n输入：违规信号清单\n输出：detection-patterns.md，包含：\n- 每个信号的 regex pattern / JS 伪代码\n- 误报率估计（TP / TN / EC 分析）\n- 综合决策树（哪个信号放 Hookify、哪个放 JS Hook、哪个只能放 System Prompt）\n- 信号优先级（P0 block / P1 warn / P2 info）\n\n### Step 3: 工程技术层 — Hook + 测试\n\n输入：detection-patterns.md 中的高可行性信号\n输出：\n- Hookify `.local.md` 规则（轻量、regex、即时反馈）\n- 测试用例（每个信号至少 2 TP + 2 TN + 2 EC）\n- Regex 验证脚本（确保 pattern 正确匹配目标信号）\n\n## 关键技术决策\n\n### Hookify vs JS Hook vs System Prompt 的分界线\n\n| 检测能力 | 放哪里 | 理由 |\n|---------|--------|------|\n| 单字段 regex 匹配 | Hookify | 零成本，即时生效 |\n| 多字段逻辑组合 | Hookify conditions | 如 old_text 无 X 且 new_text 有 X |\n| 需要 diff 算法 | JS Hook | Hookify 只能对 old/new 分别做 regex |\n| 需要跨调用状态追踪 | JS Hook | 如\"本轮改过实现但没改测试\" |\n| 需要理解用户意图 | System Prompt | 如\"模糊需求不追问\"——AI-hard 问题 |\n\n### 误报率驱动的动作选择\n\n| 误报率 | 动作 | 理由 |\n|:---:|------|------|\n| < 5% | block | 几乎不会误拦，可以硬拦截 |\n| 5-15% | warn | 有噪音但可接受 |\n| 15-40% | warn + 预期用户经常跳过 | 告诉用户为什么可能误报 |\n| > 40% | 考虑不放 Hook，或接受纯提醒角色 | Docstring creep 就属于这一类 |\n\n## 完整案例：karpathy-guidelines 管线\n\n| 原则 | 违规信号 | 检测方式 | 误报率 | 动作 |\n|------|---------|---------|:---:|------|\n| Simplicity First | 策略模式/ABC/Protocol 滥用 | Hookify regex | 20-30% | warn |\n| Surgical Changes | 顺路加返回类型标注 | Hookify regex (old vs new) | 15-25% | warn |\n| Surgical Changes | 顺路加 docstring | Hookify regex (old vs new) | 40-60% | warn |\n| Goal-Driven | 修改实现但没改测试 | Stop hook (全量提醒) | 30-50% | warn |\n| Think Before Coding | 未读文件即写 | 已有 gateguard-fact-force | — | block |\n| Surgical Changes | 引号风格漂移 | 需要 JS diff 分析 | — | Phase 2 |\n\n## 与 QSS 五层大厦的对应\n\n此管线本身就是钱学森\"从定性到定量综合集成法\"在代码质量自动化中的具体应用：\n- 基础科学层 = \"定性\"（违规分类学）\n- 技术科学层 = \"定性定量相结合\"（检测算法设计）\n- 工程技术层 = \"定量\"（Hook 机械化执行 + 测试验证）", "mtime": "2026-07-01"}, {"file": "gate-deferral-observation-period.md", "title": "门禁延期决策 + 观察期数据采集", "desc": "门禁拆分延期决策模式——对抗验证发现门禁需拆分但缺少使用数据时，设固定观察期+最小数据采集+决策矩阵，不提前拆分", "body": "**Extracted:** 2026-07-01\n**Context:** qss-ecc-alignment 门禁的对抗验证发现 4 个缺陷（已修复），同时发现触发条件不够机械可检测，建议拆分为 2 个独立门禁。但拆分需要实际使用数据支撑，不应在零数据情况下提前拆分。\n\n## Problem\n\n设计一个门禁/规则/检查 → 对抗验证发现它需要被拆分/升级 → 但没有实际使用数据来支撑拆分决策。常见陷阱：\n- **提前拆分**：在没有数据的情况下设计更细的门禁 = 纸面上猜测，可能拆错方向\n- **无限期拖延**：发现缺陷但不设观察期 = 缺陷永远不会被修复\n- **过度采集**：为\"收集数据\"建一个需要管理的大项目 = 数据采集本身变成负担\n\n## Solution: 三阶段模式\n\n### 阶段 1：对抗验证 + 即时修复（立即可做）\n- 对抗验证找出所有缺陷\n- 能在当前结构内修复的 → 立即修复\n- 需要结构变更才能修复的 → 记录到\"待改进清单\"，不立即执行\n- 每项待改进必须附带：建议方案、固定回顾日期、判断标准\n\n### 阶段 2：观察期数据采集（固定周期，如 30 天）\n\n**4 项最小指标**（不求全，求能持续）：\n\n| # | 指标 | 采集方法 | 频率 |\n|---|------|---------|------|\n| 1 | **引用深度** | grep 目标文档名 → 按 A/B/C/D 分级统计引用文件 | 每周 |\n| 2 | **触发频率** | 搜索系统日志/状态文件中是否出现目标机制的关键词 | 每周 |\n| 3 | **信号有效性** | 逐条运行文档中定义的检查命令，对比\"健康信号\"列 | 每周 |\n| 4 | **事实准确性** | 如果目标文档引用了外部系统，检查外部系统是否发生变更 | 变更发生时 |\n\n**采集原则**：\n- 每次采集 ≤ 5 分钟。超过说明采集范围太大，需要缩减\n- 结果追加到目标文档末尾（或一个简单日志文件），不需要独立报告系统\n- 如果第一周就发现\"从未被触发\"，这本身就是最重要的数据——不必等 30 天\n\n### 阶段 3：数据驱动决策（观察期结束时）\n\n| 数据状态 | 决策 |\n|---------|------|\n| 引用深度 ≥2 个 D 级 + 触发频率 >0 | **执行拆分**——数据支持拆分有价值 |\n| 引用深度停留在 C 级 + 从未被触发 | **不拆**——问题不在粒度，在\"为什么没人看这个文档\"。先解决可见性问题 |\n| 事实准确性下降（≥2 项失真） | **先修正再决定**——不准的情况下拆分会复制错误 |\n| 触发频率 >0 且出现异常告警 | **最高优先级**——机制确实在运行且已产生实际影响，值得升级为 Hook 强制执行 |\n| 4 项指标全部健康但引用深度为 0 | **降低优先级**——文档自身质量好但没有被引用。考虑是否需要增加交叉引用入口 |\n\n**关键约束**：决策矩阵必须在观察期开始前定义好。不允许在观察期结束时根据同样的数据临时想一个决策理由——这会破坏\"数据驱动\"的客观性。\n\n## When to Use\n\n- 新建的门禁/规则/检查从\"设计完成\"到\"确认是否需要进一步结构化\"之间的过渡期\n- 对抗验证发现\"应该拆分为更机械的触发\"但缺少使用数据时\n- 框架/方法论的\"从定性到定量\"过渡——已经从纸面设计进入工程实现，但还不知道实际表现\n- 任何\"我们觉得应该改，但不确定改的方向对不对\"的结构性变更\n\n## 关键教训\n\n> **从定性到定量的螺旋不能跳步。** 对抗验证 = 定性综合集成。数据采集 = 定量阶段。拆分决策 = 更高层次定性。跳过数据采集直接拆分 = 在纸面上做两轮定性，没有真正的螺旋上升。\n\n> **待改进清单不是拖延清单，但需要\"定时器\"。** 每条待改进项必须有：固定回顾日期、判断标准、决策矩阵。没有这三样 = 永远不会被处理。\n\n> **最小数据采集 > 完整数据系统。** 每周 5 分钟的 grep 持续 4 周，比一个花 3 天搭建但只用一次的\"完美监控面板\"有价值 100 倍。", "mtime": "2026-07-01"}, {"file": "engine-first-data-defers-model.md", "title": "引擎先落地，数据驱动模型层设计", "desc": "双层系统组件（Hook+Agent）的设计顺序——先引擎层(P0)收集真实运行数据，用数据指导模型层(P1)设计，而非凭空写Agent prompt", "body": "**Extracted:** 2026-06-30\n**Context:** 哨兵系统 P0→P1 的决策——P0 先实现 Hook 层（引擎强制执行），运行观察积累真实异常数据，P1 的 Agent design 等 07/30 回顾时基于数据决定。避免闭门造车的 Agent prompt。\n\n## Problem\n\n当一个系统组件同时有引擎层（Hook脚本，PostToolUse 强制执行）和模型层（Agent/LLM，需显式调用）两个实现路径时，常见做法是**同时设计两层**——Hook 做机械检测，Agent 做语义分析。但模型层的设计（Agent system prompt、判定阈值、调用时机）如果没有真实运行数据支撑，很容易变成：\n- 阈值全靠猜（\"3次重试算异常？5次？\"）\n- Agent prompt 是凭空写的（不知道真实异常长什么样）\n- 调用时机过于频繁或过疏（没有实际触发频率数据）\n\n## Solution\n\n**分层实施，引擎先行：**\n\n```\nP0: 引擎层（Hook）先落地\n  ├── 机械可检测的信号 → Hook 实现\n  ├── 收集真实运行数据 → sentinel-state.json + sentinel-log.jsonl\n  ├── 阈值用保守值（宁可漏报，勿误报）\n  └── 运行观察 N 天\n         ↓\n     基于真实数据回答：\n     - 每种异常的实际触发频率？\n     - 误报率？用户在哪些情况下说了\"这次不用问\"？\n     - 哪些阈值需要调整？\n         ↓\nP1: 模型层（Agent）基于数据设计\n  ├── Agent prompt 加入真实异常案例\n  ├── 阈值用统计中位数而非猜测值\n  └── 调用时机基于实际触发频率\n```\n\n## When to Use\n\n- 任何需要同时有 Hook + Agent 的 Claude Code 系统组件\n- 不确定\"Agent 应该什么时候被调用\"时\n- 不确定\"怎么判断 X 算异常\"时（先用 Hook 收集数据，再用中位数/分位数定义阈值）\n- 修 rules-passive-loading-trap 的新组件——先确保引擎层能强制运行，再考虑 LLM 辅助\n\n## 反例：不应该分层实施的场景\n\n- 纯语义任务（没有机械可检测的信号）→ 只能 Agent\n- 纯机械任务（不需要语义理解）→ 只需 Hook\n- 一次性脚本 → 不需要收集数据\n\n## Related\n\n- [[rules-passive-loading-trap]] — 被动规则失效的根因，本模式的动机\n- `sentinel-p0-hooks.md` (project learned) — 哨兵 P0 的具体实现\n- [[session-supervisor]] — 哨兵规则定义", "mtime": "2026-06-30"}, {"file": "sentinel-p0-hooks.md", "title": "哨兵 P0 落地 — Hook 实现", "desc": "哨兵 P0 落地——ecc-context-monitor 集成异质循环检测+静默检测，desktop-notify 集成哨兵徽章，sentinel-state.json 作为 Hook↔Agent 数据总线", "body": "**Extracted:** 2026-06-30\n**Context:** P0 是哨兵从\"纸面存在\"到\"运行时检测\"的关键一步。不同于命令顾问/学习闭环的纯被动规则——P0 通过 Hook 实现了引擎层强制执行，不依赖 LLM 自觉。\n\n## 实现概览\n\n| 文件 | 动作 | 覆盖信号 |\n|------|------|---------|\n| `scripts/lib/sentinel-state.js` | 新建 — 共享状态库 | 所有信号 |\n| `scripts/hooks/ecc-context-monitor.js` | 增强 — +异质循环+静默检测+自限 | Type 5 (同质+异质), Type 6 |\n| `scripts/hooks/sentinel-timing.js` | 新建 — 耗时异常检测 | Type 4 |\n| `scripts/hooks/desktop-notify.js` | 增强 — +哨兵徽章 | 所有信号 |\n\n## 为什么 P0 不同于顾问/学习闭环\n\n- 顾问/学习闭环 = 纯规则文本 → 依赖 LLM 自觉 → 必然被动失效\n- 哨兵 P0 = **Hook 脚本** → Claude Code 引擎在每次 PostToolUse 强制执行 → 不依赖 LLM 自觉\n- ecc-context-monitor 的 PostToolUse Hook 已经注册在 hooks.json（matcher: `*`），哨兵逻辑内嵌其中——**零配置激活**\n\n## 自限机制\n\n每种信号每会话最多 3 次 ADVISORY/ALERT。超过后降级为 SILENT（仅写日志，不注入上下文）。防止哨兵自身变成噪音源。\n\n## 三级运行\n\n| 级别 | 行为 | 触发条件 |\n|------|------|---------|\n| SILENT | 仅写入 sentinel-log.jsonl | 耗时比 < 5×, 偶发低严重度 |\n| ADVISORY | 注入 agent 上下文提醒 | 异质循环 ≥5次/5min, 耗时比 ≥5× |\n| ALERT | 注入提醒 + desktop-notify 标题变 🛡️ | 耗时比 ≥10×, 极高严重度 |\n\n## 验证方式\n\nP0 无独立 hooks.json 注册 —— ecc-context-monitor 已有 PostToolUse matcher: `*`。\nsentinel-timing.js 依赖 hooks.json 注册（matcher: Bash|Agent|Task），或作为独立脚本在后续注册。\n\n验证步骤：\n1. 检查 `~/.claude/sentinel-state.json` 是否存在，会话数据是否被持续更新\n2. 检查 `~/.claude/sentinel-log.jsonl` 是否在检测到异常时追加记录\n3. desktop-notify 弹窗标题是否在哨兵触发时显示 🛡️\n\n## 关键教训\n\n> **Hook 是规则被动加载陷阱的结构性解药。**\n> 规则在 system prompt 里 ≠ 会执行。但 Hook 由引擎在每次工具调用后强制执行。\n> 哨兵 P0 之所以能破局，不是因为规则写得更好了，而是因为从\"被动文本\"升级为\"引擎层强制执行\"。\n\n## Related\n\n- [[session-supervisor]] — 哨兵规则定义\n- [[rules-passive-loading-trap]] — 被动加载陷阱根因\n- [[qss-gate-feedback-loop]] — QSS 门禁反馈回路（哨兵联动的参考模板）\n- [[agent-self-repair-deletion-loop]] — 哨兵应该阻止的故障案例", "mtime": "2026-06-30"}, {"file": "framework-adoption-audit-method.md", "title": "框架采用率审计方法", "desc": "评估框架/方法论在项目中真实落地程度的审计方法——grep引用→深度分级→差距分析→改进建议→HTML报告", "body": "**Extracted:** 2026-06-30\n**Context:** 对 qian-system-science 在 CLAW 中的实际落地情况进行审计时形成的方法。核心发现：QSS 142 次引用中 ~110 次是自引用，仅 1 处真正落地为门禁。该方法可复用于任何\"宣称遵循 X 框架\"的项目。\n\n## Problem\n\n项目宣称\"遵循某某框架/方法论\"，但实际落地程度未知。常见的错觉：\n- 框架文档写了 10 万字 → 以为已经落地了\n- 顶层 CLAUDE.md 写了一句话 → 以为每次会话都在用\n- 引用次数看起来很多 → 但大量是框架引用自己\n\n在没有审计方法之前，框架的落地状态是一个\"薛定谔的盒子\"——既可能已经发挥作用，也可能完全是纸上谈兵。\n\n## Solution\n\n### 四步审计法\n\n#### Step 1: grep 全量引用扫描\n\n```bash\ngrep -rn \"框架关键词1\\|框架关键词2\\|核心概念3\" \\\n  --include=\"*.md\" \\\n  --include=\"*.ts\" \\\n  --include=\"*.py\" \\\n  项目目录/ \\\n  用户配置目录/\n```\n\n目的：找到所有提及框架的文件，统计引用次数。\n\n#### Step 2: 引用深度分级\n\n将每个引用文件按深度分为 4 级：\n\n| 等级 | 标记 | 含义 | 示例 |\n|------|------|------|------|\n| **A — 自引用** | 🔵 | 框架自身的文档引用自己 | `qian-system-science/SKILL.md` 引用 `synthesis-framework.md` |\n| **B — 被动上下文** | 🟡 | 在全局配置中作为\"背景知识\"出现，但无执行机制 | `AGENTS.md` 中的 QSS 决策检查清单 |\n| **C — 浅层引用** | 🟠 | 偶发性提及，仅一句话带过，无系统性映射 | `ai-video-factory/SKILL.md` 中的\"以人为主\" |\n| **D — 深度落地** | 🟢 | 作为可触发、可执行的门禁或检查点 | `claude-md-layer-gate.md` |\n\n> ⚠️ **观察者效应**：审计结果公布后，被审计的框架通常会被改进——新门禁被创建、引用文件数增长。下一次审计的基线就变了，这是正常的，不是审计方法失效。审计的价值恰恰在于触发了这种改进。建议在审计报告的末尾注明\"本审计报告发布于 YYYY-MM-DD，下次审计时以此为基线对比\"。\n\n#### Step 3: 计算真实采用率\n\n```\n真实采用率 = D 级文件数 / 项目总组件数\n```\n\n- 如果采用率 < 5%：框架处于\"纸面存在\"阶段\n- 如果采用率 5-20%：框架有少数落地，但远未普及\n- 如果采用率 > 20%：框架已经实质性地影响项目运作\n\n#### Step 4: 差距分析 + 改进建议\n\n对照框架自身的核心原则，逐项检查：\n1. 每个核心原则是否有对应的可执行机制？\n2. 原则中哪些已落地？哪些仅存在于文档？\n3. 已落地的案例中，成功模式能否复制到未落地的原则？\n\n输出格式：\n- 🚨 差距清单（按严重程度排列）\n- 💡 改进建议（按优先级排列）\n- 📊 一份可供人工查阅的 HTML 审计报告\n\n> ⚠️ **如果是重复审计（非首次）**：必须附上一张对比表——上次审计的 D 级文件数、采用率、差距清单闭合率——以追踪趋势而非单点快照。两次审计之间的变化方向（改善/恶化/持平）比单次数字更有意义。\n\n### 审计报告模板\n\n审计报告 HTML 应包含 7 个板块：\n1. 核心数据看板（关键数字一目了然）\n2. 框架资产自身质量评估\n3. 逐文件引用分布统计表\n4. 逐项落地深度评估\n5. 差距清单（Gap List）\n6. 根因分析\n7. 改进建议（按 P0/P1/P2 排列）\n\n## When to Use\n\n- 怀疑某个\"宣称遵守的框架\"实际上没有落地时\n- 新接手一个项目，需要快速评估其方法论的执行状态\n- 框架引入 N 个月后，做效果回顾\n- 任何需要在\"我们认为的\"和\"实际发生的\"之间做事实核查的场景\n\n## 适用范围与局限\n\n本方法适用于以 `.md` 文件为主的文本知识体系（skills、rules、memory、AGENTS.md 等）。如项目引入新的知识存储形式（向量数据库、外部 wiki、非文本配置等），需先确认是否可 grep 扫描——如不可，需要扩展方法或使用专用检索工具。\n\n本方法测量的是\"引用 + 落地\"，不测量\"行为是否真的改变了\"。一个门禁存在于文件中 ≠ 它每次都被触发执行。如需验证真实行为改变，需配合会话日志分析或哨兵异常检测。\n\n## 关键教训\n\n> **引用次数 ≠ 采用程度。**\n> 一个框架被提到了 100 次，不代表它被用了 100 次——可能 80 次是框架自己引用自己。\n\n> **背景知识 ≠ 执行机制。**\n> 规则被加载到 system prompt 里，不等于 LLM 会执行它。规则被动加载陷阱（[[rules-passive-loading-trap]]）会导致框架原则在任务模式下被跳过。\n\n> **框架的真正落地需要\"门禁\"而非\"文档\"。**\n> 框架原则要从\"建议你去读\"变成\"必须通过\"，需要：触发条件 + 二元判断 + 可操作输出。", "mtime": "2026-06-30"}, {"file": "qss-gate-feedback-loop.md", "title": "QSS 门禁反馈回路", "desc": "QSS 门禁系统的反馈回路——30天回顾触发器、成功指标、从门禁结果自动生成 learned rule 的规则", "body": "**Extracted:** 2026-06-30\n**Context:** 门禁本身也是系统组件——如果没有从产出回到输入的反馈，门禁会僵化、被绕过、或产生错误拒绝。钱学森综合集成方法的核心是\"螺旋上升\"：每一轮迭代在上一轮基础上有认识提升。本文件建立门禁自身的反馈机制。\n\n## 三层反馈机制\n\n### 第一层：门禁结果记录\n\n每次门禁被触发时，应在回答中生成一条结构化记录。格式：\n\n```yaml\ngate_result:\n  gate: <门禁名称>\n  date: YYYY-MM-DD\n  target: <被审核的对象（skill名/文件名）>\n  action: <create | modify | delete>\n  q1_layer: <层次判定>\n  q1_pass: true|false\n  q2_overlap_check: <grep 结果简述>\n  q2_pass: true|false\n  q3_feedback_mechanism: <反馈机制简述>\n  q3_pass: true|false\n  verdict: PASS|FAIL\n  notes: <额外备注（可选）>\n```\n\n**存储位置**：`.claude/skills/qian-system-science/feedback/gate-results/` 目录下。\n\n**命名规则**：`YYYY-MM-DD-<target-name>-gate-result.md`\n\n### 第二层：30 天回顾触发器\n\n每个通过门禁创建的 skill，其 SKILL.md frontmatter 中应包含：\n\n```yaml\nreview_date: YYYY-MM-DD     # 创建日期 + 30 天\nqss_layer: <层次>            # 门禁 Q1 判定\nqss_overlap_group: <分组>    # 门禁 Q2 判定的功能分组\n```\n\n当 LLM 在任何对话中检测到 `review_date` 已过期（当前日期 > review_date），应触发回顾流程：\n\n1. 加载该 skill 的 SKILL.md\n2. 检查：skill 在过去 30 天是否被触发/引用过？\n3. 检查：skill 的层次定位是否仍然准确？\n4. 检查：有没有新 skill 替代了它的功能？\n5. 输出评估结果：✅ 保持 / ⚠️ 改进 / ❌ 退役\n\n### 第三层：从门禁结果生成 learned rule\n\n**触发条件**：\n- 门禁 PASS → 提取\"这个 skill 为什么通过\"的关键决策理由\n- 门禁 FAIL → 提取\"为什么被拒绝\"的具体原因\n\n**生成规则**：\n\n```\n门禁 PASS + 决策依据明确\n  →\n生成 learned rule，格式：\n  - 文件名：qss-gate-<target-name>-passed.md\n  - 内容：记录通过理由、层次定位分析、边界判断依据\n  - 目的：形成\"通过模式库\"，未来类似 skill 可快速参考\n\n门禁 FAIL + 拒绝原因具体\n  →\n生成 learned rule，格式：\n  - 文件名：qss-gate-<pattern>-rejected.md\n  - 内容：记录拒绝原因、缺失的元素、如何修复\n  - 目的：形成\"常见拒绝模式库\"，加速未来判断\n```\n\n生成的 learned rule 应追加到 `learned/SKILL.md` 索引中。\n\n---\n\n## 成功指标（30 天后评估，2026-07-30）\n\n| # | 指标 | 目标 | 测量方式 |\n|---|------|------|---------|\n| 1 | **门禁触发率** | skill 创建时 100% 触发 | 检查 writing-skills 流程是否每次都经过 QSS 检查 |\n| 2 | **门禁拒绝率** | 10-30% | 统计 gate-results/ 下 PASS vs FAIL 比例。太低→门禁太松；太高→门禁太严 |\n| 3 | **创建后重构率** | 创建 30 天内不需要大幅重写 | 检查新 skill 的 commit 历史中是否有\"重写/重构\"类提交 |\n| 4 | **skill 活跃度** | 80%+ 的 skill 在 30 天内至少被触发一次 | 检查 skill 被加载/引用的日志 |\n| 5 | **层次准确性** | 门禁分配的 layer 在 30 天后被证实正确 | 回顾审查时逐项确认 |\n| 6 | **外部引用增长** | QSS 外部引用文件数从 3 增长到 ≥ 10 | 执行 `grep -rl \"qian-system-science\\|钱学森\\|系统科学\" .claude/skills/ --include=\"*.md\" \\| grep -v qian-system-science \\| wc -l` |\n\n---\n\n## 30 天回顾触发方式\n\n### 方式 1：人工触发（主要）\n\n在 2026-07-30 前后，用户或 LLM 主动执行：\n1. 检查 `gate-results/` 目录下的所有门禁记录\n2. 统计 6 个成功指标\n3. 逐项评估门禁逻辑是否需要调整\n4. 输出评估报告\n\n### 方式 2：自动触发（辅助）\n\n当 LLM 在任何对话中看到 skill 的 `review_date` 已过期时，主动提醒：\n> \"这个 skill 的 30 天回顾期已到。是否需要运行回顾检查？\"\n\n### 方式 3：门禁异常触发\n\n当门禁连续出现以下模式时，自动标记为需要审查：\n- 连续 5 次 PASS 无 FAIL → 门禁可能太松\n- 连续 3 次 FAIL 同类原因 → 门禁逻辑可能有缺陷\n- 30 天内有 skill 绕过门禁直接创建 → 门禁触发机制有漏洞\n\n---\n\n## 与三大系统的联动\n\n| 系统 | 联动方式 |\n|------|---------|\n| 🧠 QSS | 门禁结果反馈到 synthesis-framework.md 的检查清单（是否需要调整原则） |\n| 🛡️ 哨兵 | 检测到\"门禁被频繁绕过\"时发出异常信号 |\n| 🧭 顾问 | 在 /clear 前检查\"是否有未完成的 30 天回顾\" |\n\n---\n\n## 反馈日志\n\n| 日期 | 事件 | 结果 |\n|------|------|------|\n| 2026-06-30 | 反馈回路建立 | — |\n| *待定* | 首次 30 天回顾 | *待执行* |", "mtime": "2026-06-30"}, {"file": "qss-skill-creation-gate.md", "title": "QSS 技能创建门禁", "desc": "创建或大幅修改 skill 前强制回答钱学森系统科学'最少三个问题'——定位、边界、反馈，全部通过才能开工", "body": "**Extracted:** 2026-06-30\n**Context:** 当前技能创建流程（writing-skills）缺少系统论审核步骤——用户说\"建个 skill\"→LLM 直接写 SKILL.md→完成。没有层次定位检查，导致技能可能放错层、边界模糊、没有反馈机制。本门禁将 synthesis-framework.md 的\"最低三问\"转化为三个二元分支判断。\n\n## Problem\n\n每次创建新 skill 的默认路径是直接动手写。但 skill 创建是一个**系统组件添加**——它在钱学森五层大厦中应该有一个明确的层位、与已有组件的清晰边界、以及从产出回到输入的反馈回路。\n\n跳过系统论审核会导致：\n1. **层次污染**：工程技术层的\"怎么做\"被放入基础科学层的 skill\n2. **边界模糊**：两个 skill 做重叠的事情，Agent 路由时不知道该选哪个\n3. **无反馈回路**：skill 被写入后从未被评估，纸面存在但实际无用\n\n## Solution\n\n**每次要创建或大幅修改 skill 时，必须先通过以下门禁：**\n\n### 门禁流程图\n\n```\n创建/修改 skill 的意图\n  ↓\nQ1：这个 skill 在五层大厦的哪一层？\n  ├── 回答模糊/说不清 → ❌ STOP：先把定位想清楚\n  └── 回答明确 → 继续\n                    ↓\nQ2：和已有组件的关键区别是什么？\n  ├── 与已有 skill 功能重叠 → ❌ STOP：先明确分界或考虑合并/退役\n  └── 边界清晰 / 明确互补 → 继续\n                              ↓\nQ3：反馈回路是什么？\n  ├── 没有反馈机制 → ❌ STOP：先设计反馈回路\n  └── 有明确的评估/改进机制 → ✅ PASS：可以开工\n```\n\n---\n\n## Q1：我在五层大厦的哪一层？\n\n### 层次定位表\n\n| 层级 | 在 CLAW 中的对应 | 典型 skill 示例 | 核心特征 |\n|------|-----------------|---------------|---------|\n| **哲学+桥梁** | 指导思想、设计原则 | `qian-system-science` | 关于\"如何组织系统\"的元方法 |\n| **基础科学：系统学** | 核心方法论、编排方法 | `planning-with-files`, `autoresearch`, `brainstorming` | 以方法论/流程/判断原则为主 |\n| **技术科学** | 技术类规范、审查方法 | `code-review`, `security-review`, `systematic-debugging` | 以规范/标准/检查清单为主 |\n| **工程技术** | 具体执行、工具使用 | `ai-video-factory`, `hyperframes`, `slideshow` | 以具体工具名/CLI命令/文件路径为主 |\n\n### 决策信号（grep-able）\n\n| 信号 | 指向层次 |\n|------|---------|\n| 内容大量出现具体工具名/CLI命令/文件路径/API 参数 | **工程技术层** |\n| 内容以方法论/流程/判断原则为主线 | **技术科学或基础科学层** |\n| 内容是关于\"如何组织系统/编排组件/设计架构\"的元方法 | **基础科学层** |\n| 内容是关于\"系统的根本目的/哲学原则/世界观\" | **桥梁层** |\n\n### 自检语句模板\n\n> \"我这个 skill 属于 **[层名]**，因为它的核心职责是 **[一句话]**，典型内容包含 **[特征]**\"\n\n### ❌ 常见错误\n\n| 错误 | 示例 | 为什么错 |\n|------|------|---------|\n| 工程技术伪装成基础科学 | 把\"ffmpeg 常用命令合集\"放入基础科学层 | 具体工具命令属于工程技术层 |\n| 技术科学伪装成桥梁 | 把\"React 状态管理最佳实践\"放入桥梁层 | 特定框架模式属于技术科学层 |\n| 绕过整个分层 | 说\"我这个 skill 横跨多层\"作为不分层的借口 | 每个 skill 有主导层次；如有真正跨层需求应显式标注原因 |\n\n---\n\n## Q2：我和其他组件的关系是什么？\n\n### 必须执行的操作\n\n1. 用 `grep` 搜索已有 skills 中是否有类似功能的关键词\n2. 确认新 skill 与最近的同类 skill 至少在一个维度上有明显区别：输入类型 / 输出类型 / 使用场景 / 质量等级 / 抽象层次\n3. 如果完全替代已有 skill，必须同时规划旧 skill 的退役或合并\n\n### 关系决策矩阵\n\n| 与已有 skill 的关系 | 行动 |\n|-------------------|------|\n| 完全覆盖已有 skill | 先退役旧的，再建新的（或直接合并到旧的） |\n| 部分重叠但关键维度不同 | 在 description 中明确区分关键词 |\n| 与已有 skill 互补 | 在 description 中写明\"与 X 互补，用于 Y 场景\" |\n| 无可替代 | 标注为领域内唯一 skill |\n\n### ❌/✅ 对比\n\n**❌ 错误**：\n> \"我新建一个 `video-maker` skill。和已有的 `ai-video-factory` 差不多，但我的更简单。\"\n→ 问题：没说清楚关键区别是什么维度不同。如果只是\"更简单\"，应该在 ai-video-factory 内部提供简化模式。\n\n**✅ 正确**：\n> \"我新建一个 `video-batch-processor` skill。它和 `ai-video-factory` 的关键区别是：输入是 CSV 批处理清单（而非单个脚本），输出是 N 个并行视频（而非 1 个），使用场景是批量生产而非创意制作。`ai-video-factory` 覆盖单个视频的精细制作，`video-batch-processor` 覆盖批量的自动化生产。两者互补。\"\n\n---\n\n## Q3：我参与了哪个螺旋上升的过程？\n\n### 反馈回路检查\n\n| 检查项 | 要求 |\n|--------|------|\n| 谁来评估效果？ | 用户反馈？自动指标？定期审计？——必须有明确答案 |\n| 评估结果如何驱动改进？ | 更新 SKILL.md？触发退役评估？追加 learned rule？ |\n| 是否设置了回顾日期？ | `review_date: YYYY-MM-DD`（建议 30 天后）写入 SKILL.md frontmatter |\n\n### ❌ 反例（直接拒绝）\n\n- \"用户会告诉我好不好用\" → **太被动**\n- \"有问题时会修复\" → **没有定期检查机制**\n- \"这是个一次性的工具\" → **所有 skill 都会面对环境变化**\n\n### ✅ 正例（可以接受）\n\n- \"每 30 天检查一次触发频率，连续 30 天零触发触发退役评估\"\n- \"SKILL.md 中记录每次重大修改的原因和日期\"\n- \"产出后 7 天内由用户验收，验收结果写入 learned\"\n\n---\n\n## 门禁判定\n\n```\n三个问题全部通过 → ✅ PASS：可以进入 writing-skills 的 RED Phase\n任一问题不通过 → ❌ STOP：必须先解决该问题\n```\n\n## 与 writing-skills 的集成\n\n在 writing-skills 的 Skill Creation Checklist 中，**RED Phase 之前**插入：\n```\n- [ ] QSS 门禁通过？三个问题全部 PASS 才能进入 RED Phase\n```\n\n## 与 AGENTS.md 的关系\n\nAGENTS.md 的 QSS 决策检查清单已包含\"边界清晰吗？\"\"层次对吗？\"\"反馈闭合了吗？\"三条。本门禁将这三条从**被动上下文**转化为**针对\"创建 skill\"这一特定动作的主动检查点**。\n\n## 决策信号汇总\n\n| 门禁输出 | grep-able 信号 |\n|---------|---------------|\n| ❌ Q1 失败 | \"不太确定\"、\"可能是\"、\"横跨多层\"（无具体理由） |\n| ❌ Q2 失败 | 已有 2+ 个 skill description 含相同核心功能词 |\n| ❌ Q3 失败 | 无 `review_date`、无反馈描述、\"用户会告诉我的\" |\n| ✅ 全部通过 | 三个问题各有明确的一句话回答 |", "mtime": "2026-06-30"}, {"file": "gate-template.md", "title": "QSS 门禁模板", "desc": "QSS 门禁设计模板——从 claude-md-layer-gate 成功模式提取的 7 元素复用框架。用于设计新的系统论门禁", "body": "**Extracted:** 2026-06-30\n**Context:** claude-md-layer-gate 是目前唯一成功落地的 QSS 门禁。分析其结构后发现它遵循一个可复用的 7 元素模式。本模板将这个模式抽象出来，用于未来创建新门禁时直接套用。\n\n## 门禁的 7 个必备元素\n\n| # | 元素 | 说明 | claude-md-layer-gate 中的对应 |\n|---|------|------|---------------------------|\n| 1 | **触发条件** | 机械可检测的、高频的、无歧义的动作 | \"修改 CLAUDE.md 添加规则\" |\n| 2 | **二元分支流程图** | 每个判断点只有是/否两个出口，不允许\"看情况\" | 层次审核流程图（含工具名？是→阻止 / 否→继续） |\n| 3 | **层次映射表** | 显式的\"允许/禁止\"列，把抽象原则翻译为具体信号 | 五层→文件+允许内容+不允许内容 |\n| 4 | **负面示例** | 具体文本模式 + 为什么错 + 正确写法，至少 1 组对比 | ❌ CLAUDE.md 塞命令 vs ✅ CLAUDE.md 只指路 |\n| 5 | **grep-able 决策信号** | 具体的工具名、CLI 命令、禁用词——可被机械匹配 | \"WeasyPrint\"、\"禁止\"、\"永远不要\" |\n| 6 | **自包含** | 不要求阅读 QSS 参考文献就能执行门禁，所有判断逻辑内嵌 | 整个门禁在一个文件内自解释 |\n| 7 | **存储为 learned rule** | `user-invocable: false`, `origin: auto-extracted`，索引在 learned/SKILL.md | 头部 YAML + learned 索引行 |\n\n## 为什么 claude-md-layer-gate 成功了\n\n它没有说\"先读 QSS 参考文献，理解五层大厦\"，然后让你自己做判断。它直接给了你一个**可操作的流程图**和**机械化的决策信号**：\n\n```\n要写入 CLAUDE.md 的规则\n  ↓\n问：这条规则包含具体工具名/CLI 命令/错误消息吗？\n  ├── 是 → 不应该放 CLAUDE.md → 放入 learned skill，CLAUDE.md 只写一句指路\n  └── 否 → 问：这是\"项目是什么/去哪找\"还是\"怎么做\"？\n           ├── 是什么/去哪找 → ✅ 可以放 CLAUDE.md\n           └── 怎么做 → ❌ 应该放 learned skill 或 SKILL.md\n```\n\n**关键洞察**：门禁的成功不取决于哲学深度，而取决于**操作确定性**。回答\"这条规则包含 `python -m` 吗？\"比回答\"这条规则在五层大厦的哪一层？\"容易 100 倍。\n\n## 门禁设计流程（填空式）\n\n### Step 1：选择触发动作\n此门禁绑定到哪个具体的、机械可检测的动作？\n\n- [ ] 动作名称：__________________\n- [ ] 触发频率：每次 / 每天 / 每周\n- [ ] 机械检测方式：__________________\n- [ ] 例外情况（什么情况下不触发）：__________________\n\n**设计要求**：动作必须足够具体。❌ \"做重大决策时\" — 太模糊。✅ \"往 CLAUDE.md 写新规则时\" — 机械可检测。\n\n### Step 2：设计二元分支\n每个判断点的答案只能是\"是\"或\"否\"。不允许\"看情况\"或\"部分符合\"。\n\n```\n触发动作发生\n  ↓\n问：__________________？\n  ├── 是 → __________________\n  └── 否 → 问：__________________？\n                ├── 是 → ✅ __________________\n                └── 否 → ❌ __________________\n```\n\n**设计要求**：\n- 最多 2-3 层分支。超过 3 层说明门禁太复杂，需要拆分。\n- 每个问题必须是**事实判断**（\"是否包含 X\"），不是**价值判断**（\"是否足够好\"）。\n- 终止节点必须是 ✅ PASS 或 ❌ STOP + 具体行动。\n\n### Step 3：构建映射表\n\n| 层级/类别 | 允许的内容 | 不允许的内容 |\n|----------|-----------|------------|\n|          |           |            |\n\n**设计要求**：\n- \"允许\"和\"不允许\"列中的内容必须是**具体示例**，不是抽象原则。\n- 每行对应一个明确的决策路由。\n\n### Step 4：编写负面示例\n至少两组 ❌/✅ 对比，每组包含：\n1. 具体的错误文本\n2. 为什么错（违反了哪个原则）\n3. 正确的写法是什么\n4. 标注 grep-able 决策信号\n\n### Step 5：列出 grep-able 信号\n\n```\n| 门禁输出 | grep-able 信号 |\n|---------|---------------|\n| ❌ 某类失败 | 具体的关键词/命令/模式 |\n| ✅ 通过 | 具体的关键词/命令/模式 |\n```\n\n### Step 6：写入 learned index\n\n在 `learned/SKILL.md` 中增加一条记录：\n```\n| N | YYYY-MM-DD | <一句话描述> | [<文件名>.md](<文件名>.md) |\n```\n\n## 已有门禁清单（按创建时间）\n\n| # | 门禁 | 绑定动作 | 文件 |\n|---|------|---------|------|\n| 1 | CLAUDE.md 修改层次审核 | 修改 CLAUDE.md 添加规则 | claude-md-layer-gate.md |\n| 2 | 技能创建门禁 | 创建/大幅修改 skill | qss-skill-creation-gate.md |\n\n## 设计原则总结\n\n> **门禁不是哲学考试——它是路标。**\n> 好的门禁让 LLM 在 30 秒内做出正确路由决策。\n> 坏的门禁要求 LLM 先理解一个哲学体系再做决策——等于没有门禁。", "mtime": "2026-06-30"}, {"file": "claude-md-layer-gate.md", "title": "CLAUDE.md 修改层次门禁", "desc": "修改 CLAUDE.md 前须通过钱学森五层大厦层次审核——总体设计部只指路不执行", "body": "**Extracted:** 2026-06-30\n**Context:** 将 HTML→PDF 经验写入 CLAUDE.md 时，未经系统论审核直接加入具体工具禁令，导致工程技术层规则污染了总体设计部层，被系统论框架打回修正。\n\n## Problem\n\n每次 learned 踩坑后，自然的冲动是把规则写入 CLAUDE.md——因为它是每次会话自动加载的最显眼位置。但 CLAUDE.md 在钱学森五层大厦中处于 **总体设计部层**，它的职责是\"项目是什么、去哪找答案\"，不是\"用什么工具、避开什么坑\"。\n\n把工程技术层的具体工具选择规则直接写入 CLAUDE.md，造成：\n1. **层次污染**：总体设计部层塞满了具体 CLI 命令、工具名、错误消息\n2. **封闭系统**：写死禁令（\"永远不要用X\"）堵死了降级路径\n3. **维护膨胀**：每个 learned 经验都往 CLAUDE.md 塞，几个月后 CLAUDE.md 变成垃圾桶\n\n## Solution\n\n**每次要修改 CLAUDE.md 时，先用钱学森五层大厦做层次审核：**\n\n| 层级 | 对应文件 | 允许的内容 | 不允许的内容 |\n|------|---------|-----------|------------|\n| **总体设计部** | CLAUDE.md | 指路：指向哪个 skill/wiki/文件 | 具体工具名、CLI 命令、错误消息、禁令列表 |\n| **基础科学** | rules/ 目录 | 通用原则和标准 | 特定语言/工具的实现细节 |\n| **技术科学** | language-specific rules | 框架模式、惯用法 | 一次性的 bug workaround |\n| **工程技术** | learned skills、项目 SKILL.md | 具体工具选择、命令、错误修复 | — |\n\n**门禁流程：**\n\n```\n要写入 CLAUDE.md 的规则\n  ↓\n问：这条规则包含具体工具名/CLI 命令/错误消息吗？\n  ├── 是 → 不应该放 CLAUDE.md → 放入 learned skill，CLAUDE.md 只写一句指路\n  └── 否 → 问：这是\"项目是什么/去哪找\"还是\"怎么做\"？\n           ├── 是什么/去哪找 → ✅ 可以放 CLAUDE.md\n           └── 怎么做 → ❌ 应该放 learned skill 或 SKILL.md\n```\n\n**正确格式对比：**\n\n```markdown\n# ❌ 错误：CLAUDE.md 塞了工程技术层规则\n## HTML → PDF 转换（铁律）\n在 Windows 上将 HTML 转为 PDF 时，禁止依次试探 WeasyPrint / wkhtmltopdf。\n直接使用 Playwright：python -m law_ai.pdf input.html\n\n# ✅ 正确：CLAUDE.md 只指路\n## HTML → PDF 转换\n在 Windows 上将 HTML 转为 PDF 时，不要逐一试探不同工具。直接查 learned skill：\n[windows-html-to-pdf-playwright](路径)\n（已覆盖 WeasyPrint/wkhtmltopdf/Edge CLI 在 Windows 上的全部已知坑）\n```\n\n**决策信号：CLAUDE.md 里出现具体工具名（WeasyPrint/Playwright/Edge）、具体命令（`python -m law_ai.pdf`）、或\"禁止/永远不要\"等禁令 → 层次污染。**\n\n## When to Use\n\n- 任何往 CLAUDE.md 添加规则/铁律/约束时\n- 任何往 CLAUDE.md 添加来自 learned 经验的\"教训\"时\n- 怀疑某个 CLAUDE.md 已有规则是否层次错乱时（回查诊断）\n- 跨项目通用——不限于 LAW-AI", "mtime": "2026-06-30"}, {"file": "tool-integration-tier-taxonomy.md", "title": "工具集成定位分类框架", "desc": "往已有管线加新工具时，先分 Tier 再定交互——不是所有新工具都是旧工具的降级品", "body": "**提取自:** 2026-06-29 — Piper TTS + 开放档案素材接入 ai-video-factory\n**上下文:** 评估将免费工具加入已有付费/云管线时使用\n\n## 问题\n\n看到一个免费工具（Piper TTS、Archive.org 素材），直觉反应是\"把它当成付费工具的降级方案\"——当云端挂了就用本地顶上。\n\n但这个默认假设经常是错的。不加思考地套\"降级\"模式会导致两个问题：\n\n1. 用户体验变差（配音质量突然从自然掉到合成感）\n2. 忽略了工具真正的价值点（Piper 的价值不是\"免费\"，是\"零延迟迭代\"）\n\n## 三步分类法\n\n在决定一个新工具如何接入已有管线之前，先回答三个问题：\n\n### Q1：新工具和老工具做的是同一件事吗？\n\n- **同一件事** → 考虑\"标准/降级\"关系（如百炼 TTS vs Piper TTS：都是配音）\n- **不同的事** → 大概率是\"互补\"，继续问 Q2\n\n### Q2：如果不是同一件事，新工具解锁了什么？\n\n- **新内容类型** → \"互补\"——新工具让管线能做以前做不了的东西\n  - 例：AI 底图（抽象概念）vs 档案素材（历史真实画面）\n  - 方案：在路由表里加一条风格/类型分支\n  \n- **新使用场景** → \"分层\"——同一个输出品类，但适配不同阶段\n  - 例：百炼（成品配音，质量高但付费+有延迟）vs Piper（草稿配音，质量一般但免费+秒出）\n  - 方案：加 `--draft` 模式，不是加降级规则\n\n### Q3：如果确实是同一件事，质量差多少？\n\n- **差一档以内** → 可以考虑降级\n- **差两档以上** → 不要降级，用户会感觉\"突然变差了\"；改做分层（草案/成品）\n\n## 决策矩阵\n\n| 新工具 vs 旧工具 | 质量差 | 关系 | 接入方式 | 例子 |\n|----------------|:---:|------|---------|------|\n| 同一功能 | ≤1档 | 标准/降级 | 加降级规则，告知用户 | EdgeTTS→百炼 |\n| 同一功能 | ≥2档 | 分层（草案/成品） | 加 `--draft` 模式 | Piper→百炼 |\n| 不同功能 | — | 互补（内容类型） | 加风格/路由分支 | AI底图+档案素材 |\n| 不同功能 | — | 互补（使用场景） | 加独立功能入口 | 品质轨+解说轨 |\n\n## 铁律\n\n```\n❌ 看到免费工具 → 直接当降级方案\n✅ 先分 Tier（同一件事? 差几档?） → 再定关系 → 最后写代码\n```\n\n## 关联\n\n- [[skill-retirement-evaluation]] — 给管线减工具的框架，这个是加工具的框架。互补。\n- [[video-three-track-routing]] — 三轨路由本身就是这个分类思维的应用（极速/品质/解说是三种使用场景的平行轨）", "mtime": "2026-06-29"}, {"file": "skill-retirement-evaluation.md", "title": "Skill 退役评估框架", "desc": "评估一个 skill 是否应该删除/合并/保留的 6 步判断框架", "body": "**提取自:** 2026-06-29 — storyboard-prompter + tts-video 删除过程\n**上下文:** 当怀疑一个 skill 可能已经过时、被替代、或不再需要时使用\n\n## 问题\n\nSkill 文件在 `.claude/skills/` 中积累后，部分 skill 可能：\n- SKILL.md 描述的功能已被其他 skill 吸收\n- 声称的功能完成度低（如 4/11 数据缺失）\n- 从未被实际调用，只是\"纸面上的存在\"\n- 文档与实际行为脱节\n\n不做清理的后果：路由混乱、维护负担、新成员不知道该用哪个。\n\n## 6 步评估框架\n\n### Step 1: 读 SKILL.md — 它声称做什么\n\n```\n读 .claude/skills/<name>/SKILL.md → 提取核心声明\n问题：它声称的能力边界是什么？依赖哪些外部工具？\n```\n\n### Step 2: 查调用方 — 谁在用\n\n```\ngrep -r '<skill-name>' .claude/skills/ .claude/commands/ --include=\"*.md\"\n问题：ai-video-factory（或其他入口 skill）实际调用了它吗？\n      还是 SKILL.md 描述了一条从未被触发的路径？\n```\n\n### Step 3: 找替代者 — 谁能做同样的事\n\n```\n列出该 skill 的每个核心功能 → 逐一检查是否有其他 skill 已覆盖\n问题：是完全覆盖、部分覆盖、还是无可替代？\n```\n\n### Step 4: 识别不可替代数据\n\n```\n如果替代者覆盖了功能但不包含数据（如色彩盘、映射表、锚定词）：\n  - 这些数据有价值吗？（实际用过吗？）\n  - 如果有 → 迁移到替代者的 references/ 目录\n  - 如果无 → 一并删除\n```\n\n### Step 5: 检查完成度 + Git 状态\n\n```\n完成度 = 已完成功能数 / 声称功能数\nGit 状态：committed（已交付） vs untracked（会话草稿）\n\n决策矩阵：\n  完成度 < 50% + untracked + 有替代者 → 删除\n  完成度 < 50% + committed + 有替代者 → 删除 + commit\n  完成度 ≥ 80% + 有替代者 → 合并数据后删除\n  完成度 ≥ 80% + 无替代者 → 保留，补全缺失部分\n```\n\n### Step 6: 执行 + 留痕\n\n```\n删除/合并后必须：\n  1. 更新 SKILL_INVENTORY.md（移除条目或更新状态）\n  2. 更新入口 skill 的关联图（移除节点引用）\n  3. 追加 memory 记录（标注迁移目标，供未来查证）\n```\n\n## 使用时机\n\n- 发现 SKILL_INVENTORY.md 中有 🟡 状态的 skill 超过 2 周未改进\n- 新 skill 上线后，旧 skill 的职责可能已被覆盖\n- 做技能审计时（建议每 2-3 周一次）\n- 发现 SKILL.md 描述与实际代码行为不一致时\n\n## 反例：不应删除的情况\n\n- SKILL.md 描述准确、功能完整、只是当前项目没用到（可能其他项目用）\n- 完成度低但有明确的补全计划和时间表\n- 是唯一实现某功能的 skill，即使完成度低", "mtime": "2026-06-29"}, {"file": "write-tool-chinese-encoding-windows.md", "title": "Write Tool Windows Chinese Encoding", "desc": "Write tool on Windows corrupts Chinese chars in .py files — root cause + 4 workarounds", "body": "**Extracted:** 2026-06-29\n**Context:** Writing `.py` files containing Chinese characters via Write tool on Windows\n\n## Problem\n\nWrite tool on Windows silently corrupts Chinese characters (especially punctuation like `\"\"\"\"`, `\"\"`) into mojibake `\"\"` when writing `.py` files. This causes `SyntaxError: invalid character` at import/run time.\n\n**Pattern per file type:**\n- `.py` files: Chinese strings and punctuation -> garbled, Python raises SyntaxError\n- `.html` files: OK (browser respects `<meta charset=\"UTF-8\">`)\n- `.md` files: hit or miss, partial corruption\n\n**Root cause:** Windows default code page is GBK (cp936). A conversion mismatch occurs between UTF-8 multi-byte Chinese characters and the filesystem encoding layer during Write.\n\n## Solutions (priority order)\n\n### 1. Python writes Python (most reliable)\n\nUse Bash to run Python that writes the `.py` file itself. No escaping issues on the call path.\n\n```bash\npython -c \"\ncontent = '''... Python code with Chinese ...'''\nwith open('target.py', 'w', encoding='utf-8') as f:\n    f.write(content)\n\"\n```\n\nTrade-off: must escape internal quotes; tedious for large files.\n\n### 2. English identifiers only (least friction)\n\nWhen writing `.py` via Write tool, use English for all string literals, regex patterns, and print output. Chinese only in comments (comment corruption is harmless at runtime).\n\n```python\n# BAD: Chinese in strings -> crash on corruption\nLAW_NAMES = {\"Laodong Fa\": \"Laodong Fa\"}\nPATTERN = re.compile(r'\"(.+?)\"Di(\\d+)Tiao')  # guillemets -> SyntaxError\n\n# GOOD: English identifiers\nLAW_NAMES = {\"Labor Law\": \"labor_law\"}\nPATTERN = re.compile(r\"Art\\.\\s*(\\d+)\")\n```\n\n### 3. Unicode escape sequences (preserves Chinese semantics)\n\nWhen Chinese must stay in string literals:\n\n```python\n# Left/right guillemets: 《 》\n# Curly double quotes: “ ”\n# Di (prefix for article): 第\n# Tiao (article suffix): 条\n# Example: matches \"XX Fa\" Di X Tiao\nARTICLE_PATTERN = re.compile(\n    r'(?:《|“)(.+?)(?:》|”)第(\\d+)条'\n)\n# Comment for humans: matches \"\"XX Fa\"\" Di X Tiao\n```\n\n### 4. HTML/Markdown files are exempt\n\n`.html` files with `<meta charset=\"UTF-8\">` render correctly. Use HTML for user-facing docs (manuals, graphs). `.md` files are partially safe but not guaranteed.\n\n## When to use which\n\n| Signal | Solution |\n|--------|----------|\n| Writing `.py`, minimal Chinese | #2: switch to English |\n| Writing `.py`, Chinese required | #1: Python writes Python |\n| Writing `.py`, Chinese required, no extra script execution | #3: Unicode escapes |\n| User-facing documentation | #4: write HTML directly |\n| Write followed by ImportError/SyntaxError with `\"\"` in file | Retry with #1 immediately |\n\n## Related\n\n- [[bash-cmd-mklink-silent-failure]] — same encoding issue in Bash/mklink context", "mtime": "2026-06-29"}, {"file": "adversarial-doc-settlement-rewrite.md", "title": "对抗性文书 → 和解导向文书改写模式", "desc": "用逻辑滑梯框架将对抗性文书（劳动仲裁/投诉/律师函）改写为和解导向的合作文书", "body": "**Extracted:** 2026-06-28\n**Context:** 将劳动争议反映材料（HTML，约420行）用 chonggou-xianshi 逻辑滑梯框架改写为以促成和解为目标的协商材料，同时生成 PDF 版本供递交。\n\n## Problem\n\n在劳动争议、投诉、律师函等对抗性场景中，写作者的天然倾向是\"以法律和证据武装自己\"——罗列法条、附上纪律处分案例、详列升级路径。但这种写法在读者（对方党委/工会/公司管理层）心理上触发的是**防御反应**，而非合作意愿。被威胁的人不会选择和解——他们会选择反击。\n\n具体症状：\n- 读者读完感觉\"被施压\"而非\"被邀请合作\"\n- 法条和案例以武器姿态出现，关闭了协商空间\n- 精确到元的诉求没有谈判余地\n- 详列的升级路径（纪委/仲裁/诉讼）读起来像\"战斗计划\"，强化了对方的对抗态度\n- 受众角色错位：把调解方（党委/工会）当成了需要被纪律条款施压才会行动的对象\n\n## Solution\n\n用 chonggou-xianshi 的**逻辑滑梯**框架重建文书的论证结构，将\"对抗框架\"替换为\"合作框架\"。\n\n### 核心转换对照表\n\n| # | 原则 | 对抗框架（原文） | 合作框架（改写） |\n|---|------|----------------|-----------------|\n| 1 | **共情钩子替换法律声明** | \"反映人就XX争议恳请协调\" | \"我在这工作了三年，想体面离开，给双方一个好的交代\" |\n| 2 | **\"违规\"替换为\"理解差异\"** | \"公司违反了法律规定\" | \"这是对法律理解的不同，不是任何一方的恶意——澄清了就解决了\" |\n| 3 | **\"威胁\"替换为\"成本对比\"** | \"不解决将被纪委处分\" | \"和解 vs 仲裁的成本对比——和解是双方都更聪明的选择\" |\n| 4 | **\"证据武器\"替换为\"共同核实基础\"** | \"我有4637条微信记录\" | \"我愿意把我的记录拿出来，和考勤数据交叉核对——我们一起以数据说话\" |\n| 5 | **\"刚性诉求\"替换为\"灵活信号\"** | \"加班费约15,904元\" | \"我愿意在金额和
