支付方式上展现灵活性，原则澄清了数字可以商量\" |\n| 6 | **删除负面案例** | 引用纪委通报/处分案例作为威慑 | 只保留正面的调解成功案例——\"他们能谈成，我们也能\" |\n| 7 | **\"战斗路线图\"替换为\"我不希望走的路\"** | 详列工会→党委→纪委→仲裁四条升级路径 | 在末尾用两句话一带而过，语气是\"我相信不需要走到那一步\" |\n| 8 | **给调解方恢复角色** | 用纪律条款把党委/工会变成被施压方 | 删掉纪律处分引用，让党委/工会恢复为调解人角色——给他们台阶和理由 |\n\n### 改写后的逻辑滑梯结构\n\n```\n① 钩子：我是你的员工，三年感情，想的是\"体面离开\"不是\"对簿公堂\"\n② 诊断：分歧是对法律理解不同，不是恶意，澄清了就好\n③ 揭示：和解 vs 对抗的成本对比（表格直观呈现）——读者自己得出\"和解更聪明\"\n④ 认知植入1（客观事实）：综合计算工时制 ≠ 免付加班费——法律明文，不是我个人见解\n⑤ 认知植入2（客观事实）：考勤数据是客观依据——我愿意配合核对\n⑥ 认知植入3（客观事实）：这不仅是我的问题，也是制度完善的机会——对公司有好处\n⑦ 自我推导：读者自己滑向\"应该组织协调会议，推动和解\"\n⑧ 证据匹配：已有共识证明协商有效 + 成功调解先例\n⑨ 行动召唤：合同到期日已近，恳请尽快启动协调\n```\n\n### 关键心理学原理\n\n**为什么对抗框架失效：**\n- 人在被威胁时的本能反应是防御/反击（fight-or-flight），不是合作\n- 法条和纪律案例以\"武器\"姿态出现→对方筑墙\n- \"我有全部证据+你有违纪风险\"的潜台词关闭了协商空间\n\n**为什么合作框架有效：**\n- 给对方面子（\"不是违规，是理解差异\"）→ 降低防御心\n- 让读者自己推导出结论（\"和解更划算\"）而非被告知结论\n- 释放灵活性信号 → 制造谈判空间\n- 用已有共识证明\"能谈成\" → 建立正向预期\n\n### 关键删除项（对抗性文书标配，必须清）\n\n这些元素必须从任何和解导向的改写版中删除：\n- ❌ 纪律处分条款引用（如《纪律处分条例》第122/126条）\n- ❌ 纪委通报案例（如\"9,500起、7,516人处分\"）\n- ❌ 精确到元的刚性诉求金额（不给谈判留空间）\n- ❌ 详列的多条升级路径（读起来像战斗计划）\n- ❌ 任何\"如果不……就……\"的可制裁性语言\n\n### 关键保留/增强项\n\n这些元素应该保留并强化：\n- ✅ 情感叙事（工作年限、对公司的感情、体面离开的愿望）\n- ✅ 已有共识的强调（感谢公司已在某些项上配合）\n- ✅ 成本对比表（和解路径 vs 对抗路径，让读者自己判断）\n- ✅ 灵活性信号（\"愿意在金额上让步\"、\"愿意配合公司的时间和流程\"）\n- ✅ 正面先例（只保留成功调解案例，不引用处罚案例）\n\n## When to Use\n\n- 劳动争议协商材料改写\n- 投诉信/反映材料改写\n- 律师函/法律通知的软化版本\n- 任何需要将对抗性文书改写为和解导向文书的场景\n- 特别是读者并非最终决策者，而是调解人（工会、党委、HR、调解委员会）的场景", "mtime": "2026-06-28"}, {"file": "agent-self-repair-deletion-loop.md", "title": "Agent 自我修复→误删除→再修复的死循环", "desc": "Agent 自我修复循环导致误删除——VS Code 终端中 agent 反复删除/重建文件，关闭终端即终止", "body": "## 事件\n\n2026-06-27，VS Code 终端中运行的 agent 出现异常行为：\n\n1. 用户让它保存会话和更新记忆文件\n2. Agent **自己删除了**它刚保存的内容\n3. 用户让它停止\n4. Agent **反而开始\"自我修复\"**——把它自己删除的内容当作\"错误\"来修复\n5. 用户关闭 VS Code 终端，进程终止，循环结束\n\n## 根因\n\n- Agent 进入了 **\"检测问题→自动修复→修复造成新问题→再修复\"** 的无限循环\n- 可能触发了 `autoresearch`/`loop`/自我修复类 skill 的自动迭代机制\n- 用户在 VS Code 中看不到 agent 在\"想什么\"，只能看到文件被反复修改\n\n## 教训\n\n1. **VS Code 终端中的 agent 和当前会话是独立的**——关闭终端 = 杀掉进程 = 立即终止\n2. **\"自我修复\"功能在误判时会放大破坏**——agent 认为删除是\"错误\"就会恢复，认为恢复是\"错误\"就会再删除\n3. **哨兵规则检测到循环也救不了**——因为规则在 system prompt 里，VS Code 终端里的 agent 有自己的 prompt\n\n## 防护\n\n- 涉及删除/覆盖关键文件时，先用 git 保护\n- 发现 agent 行为异常 → 立即关终端，不要等它\"自己想明白\"\n- [[agent-safety-critical-file-protection]] — 关键文件保护规则", "mtime": "2026-06-27"}, {"file": "legal-article-verification-rule.md", "title": "法律条款引用必须核实条款号与文本", "desc": "引用法条必须核对条款号和文本来源以避免虚假或错号，尤其是当引用律协修订后或地方实施办法时", "body": "**Extracted:** 2026-06-26\n**Context:** 为北京国企劳动争议投诉起草文件时，两次未核实条款号导致错误；用户指出北京2026实施办法已生效，也未主动对比\n\n## Problem\n\n引用法律条款时犯了几个根本性错误：\n1. **凭记忆而非核对**：写了\"工会法第三十七条\"（应为第三十九条）、\"工会法第四十九条\"（应为第五十条）\n2. **未考虑版本变化**：全国《工会法》2021修正后条款号与旧版不同（2022.1.1施行）\n3. **未考虑地方性法规**：用户在北京，但只引用了全国法，完全忽略了《北京市实施〈工会法〉办法》（2026.5.1施行），后者有多项对用户更有利的细化规定\n4. **未向用户汇报核对过程**：条款号修正后才给用户看，而非引用前先验证\n\n## Solution\n\n### 引用法律条款的强制步骤\n\n1. **每次引用法条前必须 WebSearch 对该条款进行原文核验**——不仅仅是对条款号，而是搜索\"某法 某条 原文\"以确认：\n   - 条款号正确（尤其是修正后序号有调整的法律）\n   - 条款内容就是你理解的意思\n   - 没有把你想要的内容记错条款号\n\n2. **写进文件前告知用户**：\"我引用了X法第Y条，内容是Z。让我确认这确实是正确的条款号和有效版本。\"\n\n3. **核实版本链**（层级从高到低）：\n   - 全国法律→现行修正版→施行日期\n   - 行政法规→现行修正版→施行日期\n   - 地方性法规→现行修正版→施行日期（这是最多漏掉的一层）\n   - 地方政府规章→现行修正版→施行日期\n\n4. **地方性法规=加分项**：只要用户所在地有相关实施办法/细则，就应对比全国法和地方法的差异，地方法往往更细化、更有利。\n\n5. **如果条款号有变**：在正文中同时标注现行版本条款号和对应旧版条款号（如\"第五十条（旧版第四十九条）\"），防止用户用旧版核对时发现\"对不上\"。\n\n### 本次会话的实际教训\n\n| 错误 | 原因 | 后果 |\n|------|------|------|\n| 工法37条应为39条 | 凭记忆，内容对但条款号错 | 用户查到37条发现文字不符 → 质疑所有法条 |\n| 工法49条应为50条 | 未考虑2021修正后序号调整 | 同上 |\n| 未引用北京实施办法 | 未主动搜索地方法规 | 错过对用户最有利的条款（15日答复期、加班费独立项、公积金独立项） |\n| 未引用北京劳动合同规定 | 未搜索地方政府规章 | 错过第7条（工会监督合同）+ 第40条（提前30日通知） |\n\n## When to Use\n\n每当在对话中引用任何法律/法规/规章条款时——特别是：\n- 劳动法、工会法相关（修正频繁）\n- 用户已告知所在城市（应同时查地方性法规）\n- 用户提到\"新的\"\"最近生效的\"法律版本\n\n## LLM 生成法律文书时的系统性幻觉分类\n\n经 2026-06-26 会话验证，LLM 在法律文书生成中存在以下可预测的错误模式，写完法律文书后需按此清单逐项排查：\n\n| # | 幻觉类型 | 表现 | 实例 |\n|---|---------|------|------|\n| 1 | **内容混同** | 将两条独立条文的内容合并写入一条 | 《北京市劳动合同规定》第四十条+第四十七条混为一条 |\n| 2 | **条文号记错** | 概念正确但条文号错误（张冠李戴） | 同工同酬→写了第十一条，应为第十八条 |\n| 3 | **过度引用** | 看到关键词就加入无关条文 | 《工会法》第五十条（保护工会组织自身权益，与职工投诉工会无关） |\n| 4 | **名称自行简化** | 法规名称未按规范简称 | \"北京市实施办法\"应为\"北京市实施〈工会法〉办法\" |\n| 5 | **笔误级错号** | 内容正确但条款号打错 | 第三十九条误写为第三十七条 |\n\n### 写后排查流程\n\n写完法律文书后，对每个法条引用执行：\n1. **\"条款号是否确实包含此内容？\"** → 搜索原文核对\n2. **\"内容是否分散在多个条款？\"** → 检查是否需要拆分\n3. **\"该引用与本案诉求是否真正相关？\"** → 删除仅关键词匹配但无关的条文\n4. **\"法规简称是否规范？\"** → 首次用全称+括号注简称\n5. **\"条款号数字是否正确？\"** → 逐一核对阿拉伯数字\n\n## 审查人也需要验证\n\n**教训**：外部审查意见本身也需要按最新版本验证。\n\n2026-06-26 会话中，审查人指出《北京市实施办法》第二十条\"提前五个工作日\"为\"无依据自行添加内容\"，但经核实，2026年3月27日第三次修订版（2026.5.1施行）确实已写入该时限。审查人查阅的是2015旧版，其结论部分错误。\n\n**规则**：收到任何法条审查意见后，不要直接采信：\n1. 确认审查意见所依据的法律版本（现行有效？旧版？）\n2. 对每条\"必须修改\"的意见，独立搜索验证\n3. 特别警惕审查人可能遗漏的最新修订\n\n## 关联规则\n\n- [[legal-enforceability-gap-check]]：法条文本核查后，须继续验证执行路径可行性——条文正确 ≠ 可按预设路径落地。两者互补。\n\n## 关联规则\n\n- [[legal-enforceability-gap-check]]：法条文本核查后，须继续验证执行路径可行性——条文正确 ≠ 可按预设路径落地。两者互补，合为完整的\"法条引用可行性审查\"。", "mtime": "2026-06-27"}, {"file": "legal-enforceability-gap-check.md", "title": "法律法条——执行路径可行性验证规则", "desc": "引用法条后必须验证执行路径的可行性，不能只管条文正确性而忽略实际操作难度", "body": "**Extracted:** 2026-06-27\n**Context:** 在起草劳动争议投诉书时，发现即使法条引用完全正确，实际执行路径与法条预设路径之间的偏差也可能导致当事人的策略选择失误、维权成本增加或程序空转。\n\n## 核心逻辑\n\n```\n法条正确 ≠ 能按预设路径落地\n\n引用法条后追问：\n  → 主管部门真的是谁？\n  → 一线操作惯例是什么？\n  → 对方可能怎样歪曲利用？\n  → 当事人走这条路划不划算？\n\n以上问题厘清后，须结合裁判文书网的具体案例进行对照和平衡：\n  → 同类情形法院/仲裁委过往怎么判？\n  → 判例中对执行路径的评价是否与当前分析一致？\n  → 有无反向判例需要预先应对？\n```\n\n**不要硬搬法条而忽略执行的难易程度，也不要在没有判例参照的情况下对执行路径下结论。**\n\n## 解决方案\n\n对于文中每一个核心法条引用，必须依次完成以下三步：\n\n1. **文本核查**：条款号、内容、版本是否正确\n2. **执行路径分析**：主管部门、操作惯例、对方利用空间、当事人成本\n3. **判例对照**：裁判文书网对照同类案情，检验分析结论的判例支撑\n\n三步全部通过，才能将法条及基于该法条的诉求写入文书。\n\n## 与已有规则的关系\n\n本条规则与 `legal-article-verification-rule` 互补，构成三步法条引用可行性审查链。\n\n## When to Use\n\n- 起草任何引用了具体法条的法律文书时\n- 当文中主张\"单位必须直接履行法定义务\"而对方以\"走程序\"为由推脱时\n- 评估维权路径成本时", "mtime": "2026-06-27"}, {"file": "ffmpeg-silent-crash-diagnosis.md", "title": "FFmpeg 静默崩溃诊断", "desc": "当 Windows 上 FFmpeg 返回 'Command failed with no output' 时，系统性诊断静默崩溃问题。", "body": "**提取日期:** 2026-06-24\n**上下文:** 视频管线中通过包装工具（agnes、Python subprocess、Node child_process）调用 ffmpeg 处理字幕时，出现\"Command failed with no output\"错误。\n\n## 问题\n\n你通过进程包装器（agnes、Python subprocess、Node child_process）运行一条 ffmpeg 命令，得到的却是：\n\n```\nCommand failed with no output\n```\n\n正常情况下，ffmpeg **一定会**向 stderr 输出内容——参数错误、找不到文件、滤镜语法错误——所有这些都会产生日志。完全无输出意味着该进程**异常终止**（崩溃、被杀死，或加载失败），而非常规的参数错误。\n\n## 双层分解\n\n该错误总是一个**双层交互**问题：\n\n| 层 | 发生了什么 | 故障模式 |\n|---|-----------|------------|\n| **第 1 层**: ffmpeg | 进程崩溃、被杀死，或未启动 | 路径解析崩溃、二进制损坏、OOM 终止、文件锁冲突 |\n| **第 2 层**: 包装器 | 包装器未捕获 stderr，或在缓冲区刷新前进程就没了 | stderr 被丢弃、超时熔断、只读取 stdout |\n\n**两者都不是完全有罪——这是交互层面的失效。** 修复第 2 层（让包装器同时捕获 stderr）能让第 1 层的错误**可见**，实现真正的调试。\n\n## Windows 字幕场景的 4 条因果链\n\n当为视频添加 `subtitles=xxx.srt` 滤镜时：\n\n### 1. 滤镜路径带盘符 → 解析崩溃（最高发）\n```\n# 崩溃写法:\n-vf \"subtitles=D:/sub.srt:original_size=1920x1080\"\n# ffmpeg 用 ':' 分割滤镜参数。读到 D: 时语法崩溃 → abort → stdout/stderr 无输出\n\n# 安全写法:\n-vf \"subtitles='D\\\\:/sub.srt':original_size=1920x1080\"\n# 用 \\\\: 转义盘符中的冒号\n```\n**此问题已在** `generate_simple_video.py:150` **修复**（`replace(\":\", \"\\\\:\")`）。其他脚本必须采用相同写法。\n\n### 2. 文件系统异常 → IO 崩溃\nSRT 文件被编辑器/播放器锁定、D 盘离线、权限不足、路径包含不可见字符。\n\n### 3. 包装器丢弃 stderr\n包装器只管道捕获了 stdout。ffmpeg 的**所有错误信息都输出到 stderr**。若只读 stdout → 丢失所有诊断信息 → \"无输出\"。\n\n### 4. FFmpeg 二进制本身损坏\n缺失 DLL 依赖、64/32 位不匹配、旧版 subtitles 滤镜存在原生冒号崩溃 bug。\n\n## 诊断协议（5 步，按顺序执行）\n\n### 第 1 步: 绕过包装器，在 CMD 直接运行\n```cmd\nffmpeg -i \"D:\\input.mp4\" -vf \"subtitles='D\\:/sub.srt':original_size=1920x1080\" -c:a copy \"D:\\out.mp4\"\n```\n- **CMD 能显示错误** → 问题出在第 2 层（包装器丢弃了 stderr）\n- **CMD 一闪而过，无任何输出** → 问题出在第 1 层（ffmpeg 自身崩溃）\n\n### 第 2 步: 检查 `D:` 是否用 `\\:` 转义\n```python\n# 正确格式:\nsrt_safe = srt_path.replace(\"\\\\\", \"/\").replace(\":\", \"\\\\:\")\n# 生成: D\\:/path/to/sub.srt\n```\n这是最常见的触发因素。`generate_simple_video.py:150` 已包含此修复——确保其他脚本也采用相同写法。\n\n### 第 3 步: 确保包装器同时捕获 stderr\nPython 示例:\n```python\nresult = subprocess.run(cmd, capture_output=True, text=True, timeout=120)\n# capture_output=True 同时捕获 stdout 和 stderr\n# 始终打印两者用于调试:\nprint(result.stderr)  # ← ffmpeg 所有错误信息都在这里\n```\n\n### 第 4 步: 延长超时时间\n若存在超时熔断 → 延长至 120 秒。短超时会在 ffmpeg 完成解析和输出日志之前就将其杀死。\n\n### 第 5 步: 在调用 ffmpeg 之前验证文件可读性\n```python\nimport os\nif not os.path.isfile(srt_path):\n    raise FileNotFoundError(f\"SRT not found: {srt_path}\")\nif not os.access(srt_path, os.R_OK):\n    raise PermissionError(f\"SRT not readable: {srt_path}\")\n```\n将文件级别的错误转化为清晰的 Python 异常，而非静默的 ffmpeg 崩溃。\n\n## 使用时机\n\n- 来自任何包装器（agnes、`subprocess.run`、`child_process.exec`）的 ffmpeg 命令返回 `Command failed with no output`\n- ffmpeg 在使用 `subtitles=` 或任何带文件路径的滤镜时静默失败\n- Windows 视频管线故障排查，异常退出码（例如 4294967274 = 无符号溢出 -22）\n- 任何在字幕合成步骤中表现空洞的 `生成 → 合成` 工作流\n\n## 关联\n\n- [[tts-video-srt-fix]] — 针对 `generate_simple_video.py` 的 `\\:` 转义修复\n- [[video-three-track-routing]] — 极速轨引擎（TTS + FFmpeg + 字幕）", "mtime": "2026-06-24"}, {"file": "ai-bg-text-layering-formula.md", "title": "AI 底图 + 文字视频的分层抑制公式", "desc": "AI 图片做视频背景时，确保文字清晰可读的分层抑制公式：prompt 留黑约束 + CSS brightness/saturate 降暗 + radial-gradient 文字垫板", "body": "**提取:** 2026-06-24 | **适用:** CLAW 品质轨（Agnes Image / Wan2.7 / 任何AI生图做视频背景）\n\n## 问题\n\nAI 生成的图片默认倾向\"画面中心放最精彩的东西\"，但视频文字层也在中心。直接叠加 → 前景背景频谱打架，文字不可读。\n\n## 三层抑制公式（按优先级）\n\n### Layer A: Prompt 约束——从源头让 AI 把中心留黑\n\n```\n必须包含:\n  \"Negative space in center 60% of frame\"\n  \"No focal object, bright element, or text in middle third\"\n  \"Dark gradient or soft texture in center area for text overlay\"\n  \"Visual interest only at frame edges\"\n\n必须避免:\n  - 具象物体（塔楼、人物、建筑）在画面中心\n  - \"golden light\" / \"brilliant\" / \"bright center\" 等中心高亮词\n  - 任何文字/UI元素\n\n尺寸: 1792×1024 (16:9), 不裁切\n```\n\n### Layer B: CSS 滤镜——全局降暗降饱和\n\n```css\n.bg-layer img, .bg-layer video {\n  width: 1920px; height: 1080px;\n  object-fit: cover;\n  filter: brightness(0.35) saturate(0.3);  /* 底图降到35%亮度 */\n}\n```\n\n### Layer C: 径向渐变遮罩——中心最暗保护文字\n\n```css\n.text-mat {\n  position: absolute; inset: 0; z-index: 2;\n  pointer-events: none;\n  background: radial-gradient(ellipse at center,\n    rgba(6,6,16,0.65) 35%,   /* 中心: 65%不透明暗色 */\n    rgba(6,6,16,0.85) 70%,   /* 过渡: 85%不透明 */\n    rgba(6,6,16,1) 100%);    /* 边缘: 完全覆盖 */\n}\n```\n\n## 内容类型→底图强度速查\n\n| 内容 | 底图强度 | 滤镜 | 是否需要 AI Image |\n|------|:---:|------|:---:|\n| 技术/代码/数据 | 0% | 不用底图，纯 CSS | ❌ |\n| 教程/知识 | 10-20% | `brightness(0.25) saturate(0.2)` | ⚠️ 可选 |\n| 品牌/产品 | 30-50% | `brightness(0.4) saturate(0.35)` | ✅ |\n| 故事/情感 | 50-70% | `brightness(0.5) saturate(0.4)` | ✅ |\n\n## 自检清单\n\n- [ ] 底图 prompt 是否包含 \"negative space in center\"？\n- [ ] 底图尺寸是否为 1792×1024？\n- [ ] CSS 是否过滤镜 `brightness() saturate()`？\n- [ ] 是否有 radial-gradient 遮罩层？\n- [ ] 文字颜色和叠加后背景的 WCAG 对比度 ≥ 4.5:1？\n\n## 来源\n\n- v3.2 demo 初版失败（赛博塔楼霓虹 vs 白色文字 → 不可读）\n- v3.2-final 修正版（降暗35% + 中心遮罩 → 文字清晰但底图不可见）\n- 未来迭代：根据内容类型查表选底图强度，不要一刀切全暗或全亮", "mtime": "2026-06-24"}, {"file": "python-ml-dependency-defense.md", "title": "Python ML 项目依赖地狱的 4 层防御模式", "desc": "Python ML依赖地狱的4层防御模式：配置容错/导入降级/环境隔离/预检脚本", "body": "**提取:** 2026-06-24\n**上下文:** 安装 GPT-SoVITS 声音克隆时连续遭遇 5 类报错（jieba_fast编译失败、模型config缺key、torchcodec缺FFmpeg DLL、scipy/numpy/gradio版本冲突），最终总结出的可复用防御体系。\n\n## 根本原因\n\n不是电脑硬件问题。所有报错根因是：\n1. **代码缺少兼容容错逻辑** — 模型权重文件和代码版本不同，config 键名变了但代码没写 fallback\n2. **运行环境依赖不统一** — 开发者本地有全套依赖，分发到别的环境就各种缺\n3. **项目工程化不规范** — 没有自检脚本、没有依赖锁定、没有默认参数填充\n\n---\n\n## 第 1 层：配置参数防御（解决 KeyError）\n\n**触发条件:** `config[\"model\"][\"dropout\"]` → `KeyError: 'dropout'`\n\n```python\n# ❌ 原来会崩溃的写法\nself.p_dropout = config[\"model\"][\"dropout\"]\nself.EOS = config[\"model\"][\"EOS\"]\n\n# ✅ 容错写法：所有超参用 .get() 兜底\nself.p_dropout = config[\"model\"].get(\"dropout\", config[\"model\"].get(\"p_dropout\", 0.1))\nself.model_dim = config[\"model\"].get(\"hidden_dim\", config[\"model\"].get(\"hidden_channels\", 192))\nself.num_layers = config[\"model\"].get(\"n_layer\", config[\"model\"].get(\"n_layers\", 6))\nself.EOS = config[\"model\"].get(\"EOS\", self.vocab_size - 1)\n```\n\n**原则:** 每个从配置读取的键都写 fallback，不要假设旧版权重文件的 config 结构。\n\n---\n\n## 第 2 层：依赖分层自动降级（解决 C 扩展编译失败）\n\n**触发条件:** `import jieba_fast` → `ModuleNotFoundError`（C 扩展在 Windows 无编译器时编译失败）\n\n```python\n# ✅ 自动降级：优先加速版，失败切纯 Python 版\ntry:\n    import jieba_fast as jieba\nexcept ImportError:\n    import jieba\n\n# 如果代码需要完整的包结构（含子模块如 jieba_fast.posseg）：\n# 创建一个纯 Python 别名包：\n#  jieba_fast/__init__.py  →  from jieba import *\n#  jieba_fast/posseg.py    →  from jieba.posseg import *\n```\n\n**通用模式:** `jax/cupy/numba` 等 GPU 加速库同理，写 `try/except ImportError` 自动退回 CPU 版本。\n\n---\n\n## 第 3 层：环境隔离 + 依赖锁定\n\n**触发条件:** 安装新项目时 `pip install` 把其他已装工具搞坏\n\n```bash\n# ✅ 创建独立虚拟环境（不污染全局 Python）\npython -m venv ./venv\n\n# ✅ 先装最大的依赖（PyTorch），再装其他的\n./venv/Scripts/pip.exe install torch torchaudio --index-url https://download.pytorch.org/whl/cpu\n./venv/Scripts/pip.exe install -r requirements.txt\n\n# ✅ 锁死有冲突的版本\n./venv/Scripts/pip.exe install \"numpy<2.0\" \"scipy<1.13\" \"gradio<5\"\n```\n\n**原则:**\n- 每个 ML 项目独立 venv，绝不共用\n- 先装 PyTorch，后装其他（避免 pip 解析器乱选版本）\n- 已知冲突的包（numpy/scipy/gradio）提前锁版本\n\n---\n\n## 第 4 层：环境自检脚本（运行前确认）\n\n```python\n# check_env.py — 每次运行前执行\nimport sys, os, platform\n\n# ── 跨系统模型路径自动适配 ──\n# 不写死绝对路径，基于项目根目录推导\nPROJECT_ROOT = os.path.dirname(os.path.abspath(__file__))\nMODEL_DIR = os.path.join(PROJECT_ROOT, \"pretrained_models\")\n\n# 各模型文件路径（一次定义，全局复用）\nMODEL_PATHS = {\n    \"gpt\": os.path.join(MODEL_DIR, \"s2G2333k.pth\"),\n    \"sovits\": os.path.join(MODEL_DIR, \"s2D2333k.pth\"),\n}\n# Windows/Linux/macOS 路径分隔符自动适配，不需要 if-else\n\ndef check():\n    errors = []\n    \n    # 1. Python 版本\n    if sys.version_info < (3, 10):\n        errors.append(\"需要 Python >= 3.10\")\n    \n    # 2. 关键依赖\n    for mod, name in [(\"torch\", \"PyTorch\"), (\"jieba\", \"jieba\"), \n                       (\"soundfile\", \"soundfile\"), (\"numpy\", \"numpy\")]:\n        try:\n            __import__(mod)\n        except ImportError:\n            errors.append(f\"缺少依赖: {name}\")\n    \n    # 3. 模型文件（使用跨系统路径，不写死绝对路径）\n    for name, path in MODEL_PATHS.items():\n        if not os.path.exists(path):\n            errors.append(f\"缺少模型文件 [{name}]: {path}\")\n    \n    if errors:\n        print(\"❌ 环境检查失败:\")\n        for e in errors:\n            print(f\"  - {e}\")\n        sys.exit(1)\n    print(f\"✅ 环境检查通过 ({platform.system()})\")\n\nif __name__ == \"__main__\":\n    check()\n```\n\n**路径原则:**\n- 用 `os.path.join(__file__, \"..\")` 推导项目根，不写绝对路径\n- `os.path.join` / `pathlib.Path` 自动处理 Windows `\\` / Linux `/` 差异\n- 所有路径集中在顶部常量，不散落在代码各处\n\n---\n\n## 本次实战验证：GPT-SoVITS 安装中的 5 个补丁\n\n| # | 报错 | 防御层 | 修复 |\n|---|------|:---:|------|\n| 1 | `numpy 2.0.2` vs `requirement <2.0` + `gradio 6.x` vs `requirement <5` | 第3层 | 独立 venv + 提前锁版本 |\n| 2 | `jieba_fast` C 扩展编译失败 | 第2层 | 创建纯 Python 别名包 |\n| 3 | `config[\"data\"][\"max_sec\"]` / `config[\"model\"][\"hidden_dim\"]` / `config[\"model\"][\"dropout\"]` / `config[\"model\"][\"EOS\"]` 连锁缺失 | 第1层 | 4 个 `.get()` fallback |\n| 4 | `opencc` C 扩展编译失败 | 第2层 | 换 `opencc-python-reimplemented` |\n| 5 | `torchcodec` 需要 FFmpeg 共享 DLL（Windows 无） | 第1层 | `soundfile` 替代 `torchaudio.load()` |\n\n---\n\n## 何时用\n\n- 安装任何 Python ML 开源项目（TTS/语音克隆/视频生成等）\n- 遇到 `KeyError` 在 `config[\"model\"][...]` 读取时\n- 遇到 `ModuleNotFoundError` 但已 pip install 过\n- 安装新工具后发现别的工具坏了（依赖版本冲突）\n- **铁律：运行前先过第4层自检，不要边报错边修**", "mtime": "2026-06-24"}, {"file": "bash-cmd-mklink-silent-failure.md", "title": "Bash 中 mklink /J 静默失败", "desc": "通过Bash(Git Bash)执行cmd /c mklink /J 静默失败——junction不创建且不报错的根本原因和替代方案", "body": "**提取:** 2026-06-23\n**场景:** 在 Git Bash (MSYS2) 中通过 `cmd /c` 调用 Windows mklink 创建 junction\n\n## 问题\n\n在 Bash 中执行以下命令，终端显示\"成功\"但 junction 实际上没有创建：\n\n```bash\ncmd.exe /c \"mklink /J \\\"C:\\target\\\" \\\"E:\\source\\\"\"\n# 输出乱码，没有报错，但 junction 不存在\n```\n\n**根因:** MSYS2/Bash 的 POSIX 路径转换层干扰了 `cmd /c` 的参数传递。中文 Windows 的 GBK 编码进一步导致输出乱码。\n\n## 解决\n\n**用 PowerShell `New-Item -ItemType Junction`（唯一可靠方案）：**\n\n```powershell\nNew-Item -ItemType Junction -Path 'C:\\target\\dir' -Target 'E:\\source\\dir'\n```\n\n**或者在 .bat 文件中执行：**\n1. 写入 `mklink /J \"C:\\target\" \"E:\\source\"` 到 `.bat`\n2. 在文件管理器中双击执行\n\n## 验证 junction 是否生效\n\n```powershell\nGet-Item $path -Force | Select-Object LinkType, Target\n# LinkType: Junction  Target: E:\\source\\dir → 成功\n# LinkType: (空)     Target: (空)        → 失败，是普通空目录\n```\n\n## 关联\n\n- [[bash-powershell-escape-rule]] — Bash 中执行 PowerShell 的通用规则", "mtime": "2026-06-23"}, {"file": "powershell-junction-double-count-trap.md", "title": "PowerShell Junction 扫描双重计数陷阱", "desc": "PowerShell Get-ChildItem -Recurse 会穿过junction/symlink，导致磁盘使用量双倍计算", "body": "**提取:** 2026-06-23\n**场景:** Windows 上用 PowerShell 扫描磁盘使用量（C盘清理、空间分析）\n\n## 问题\n\n`Get-ChildItem -Recurse` 默认会穿过 NTFS reparse point（junction、symbolic link），把目标目录的文件算进当前目录的大小统计。\n\n```\n# 这会把 E盘数据算进 C盘\nGet-ChildItem 'C:\\Users\\xxx\\.claude' -Recurse | Measure-Object Length -Sum\n```\n\n结果：`.claude/models/` 是 junction→E盘，扫描显示 14GB，实际 C盘物理占用 0。\n\n## 解决\n\n**方法1：用 `-Attributes` 过滤掉 reparse point**\n```powershell\nGet-ChildItem $path -Recurse -File | Where-Object {\n    ($_.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -eq 0\n} | Measure-Object Length -Sum\n```\n\n**方法2：先确认是不是 junction 再扫**\n```powershell\n$item = Get-Item $path -Force\nif ($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) {\n    # 跳过，不递归\n}\n```\n\n**方法3：用 cmd `dir` 做交叉验证**\n```cmd\ndir /a C:\\Users\\xxx\\.claude\\models\n```\njunction 会显示 `<JUNCTION>` 标记。\n\n**方法4：用 fsutil 确认真实磁盘可用空间**\n```cmd\nfsutil volume diskfree C:\n```\n不依赖文件系统遍历，是真实的磁盘剩余字节。\n\n## 何时用\n\n- 扫描 C 盘空间时发现某个目录大得不合理\n- 对比两个目录\"内容一样\"但怀疑一个是 junction\n- PowerShell 磁盘报告和 `fsutil volume diskfree` 对不上", "mtime": "2026-06-23"}]</script>
<script>
(function () {
  var NOTES = JSON.parse(document.getElementById('data').textContent);
  var listEl = document.getElementById('list');
  var docEl = document.getElementById('doc');
  var qEl = document.getElementById('q');
  document.getElementById('count').textContent = NOTES.length + ' 篇 · 按时间倒序';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function inline(s) {
    s = esc(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    return s;
  }
  function md(text) {
    var lines = text.split(/\r?\n/), out = [], i = 0;
    var para = [], list = null, quote = [], table = null;
    function flushPara() { if (para.length) { out.push('<p>' + inline(para.join(' ')) + '</p>'); para = []; } }
    function flushList() {
      if (!list) return;
      out.push('<' + list.tag + '>' + list.items.map(function (x) { return '<li>' + inline(x) + '</li>'; }).join('') + '</' + list.tag + '>');
      list = null;
    }
    function flushQuote() { if (quote.length) { out.push('<blockquote>' + inline(quote.join(' ')) + '</blockquote>'); quote = []; } }
    function flushTable() {
      if (!table) return;
      var rows = table.rows, html = '<table>';
      if (table.head) html += '<thead><tr>' + table.head.map(function (c) { return '<th>' + inline(c) + '</th>'; }).join('') + '</tr></thead>';
      html += '<tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inline(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      out.push('<div class="table-wrap">' + html + '</div>'); table = null;
    }
    function flushAll() { flushPara(); flushList(); flushQuote(); flushTable(); }

    while (i < lines.length) {
      var line = lines[i];
      if (/^```/.test(line)) {
        flushAll();
        var buf = [], j = i + 1;
        while (j < lines.length && !/^```/.test(lines[j])) { buf.push(lines[j]); j++; }
        out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        i = j + 1; continue;
      }
      if (!line.trim()) { flushAll(); i++; continue; }
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) { flushAll(); out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
      if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushAll(); out.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(line)) { flushPara(); flushList(); flushTable(); quote.push(line.replace(/^\s*>\s?/, '')); i++; continue; }
      var tbl = /^\s*\|(.+)\|\s*$/.exec(line);
      if (tbl) {
        flushPara(); flushList(); flushQuote();
        var cells = tbl[1].split('|').map(function (c) { return c.trim(); });
        if (!table) table = { head: null, rows: [] };
        if (/^:?-{2,}:?$/.test(cells[0] || '')) { table.head = table.rows.pop() || null; i++; continue; }
        table.rows.push(cells);
        i++; continue;
      }
      var ul = /^\s*[-*+]\s+(.*)$/.exec(line);
      var ol = /^\s*\d+[.)]\s+(.*)$/.exec(line);
      if (ul || ol) {
        flushPara(); flushQuote(); flushTable();
        var tag = ul ? 'ul' : 'ol';
        if (!list || list.tag !== tag) { flushList(); list = { tag: tag, items: [] }; }
        list.items.push((ul || ol)[1]); i++; continue;
      }
      flushList(); flushQuote(); flushTable();
      para.push(line.trim()); i++;
    }
    flushAll();
    return out.join('\n');
  }

  function render(note) {
    docEl.innerHTML = '<div class="doc-head"><h2>' + esc(note.title) + '</h2><p>' + esc(note.file) +
      ' · ' + esc(note.mtime) + (note.desc ? ' · ' + esc(note.desc) : '') + '</p></div>' +
      '<div class="body">' + md(note.body) + '</div>';
    Array.prototype.forEach.call(listEl.children, function (el) {
      el.classList.toggle('on', el.dataset.file === note.file);
    });
    location.hash = note.file;
    window.scrollTo(0, 0);
    docEl.parentElement.scrollTop = 0;
  }

  function paint(filter) {
    var f = (filter || '').trim().toLowerCase();
    listEl.innerHTML = '';
    var shown = 0;
    NOTES.forEach(function (n) {
      var hay = (n.title + ' ' + n.desc + ' ' + n.file + ' ' + n.body).toLowerCase();
      if (f && hay.indexOf(f) < 0) return;
      shown++;
      var a = document.createElement('a');
      a.className = 'item'; a.dataset.file = n.file; a.href = '#' + n.file;
      var b = document.createElement('b'); b.textContent = n.title;
      var s = document.createElement('span'); s.textContent = n.mtime + ' · ' + (n.desc || n.file);
      a.appendChild(b); a.appendChild(s);
      a.addEventListener('click', function (e) { e.preventDefault(); render(n); });
      listEl.appendChild(a);
    });
    if (!shown) { var p = document.createElement('p'); p.className = 'empty'; p.style.padding = '10px 12px'; p.textContent = '没有匹配的条目'; listEl.appendChild(p); }
  }

  qEl.addEventListener('input', function () { paint(qEl.value); });

  var KEY = 'learned-theme';
  function setTheme(dark) {
    document.documentElement.classList.toggle('dark', dark);
    localStorage.setItem(KEY, dark ? '1' : '0');
  }
  document.getElementById('theme').addEventListener('click', function () {
    setTheme(!document.documentElement.classList.contains('dark'));
  });
  setTheme(localStorage.getItem(KEY) === '1');

  paint('');
  var want = decodeURIComponent(location.hash.slice(1));
  var start = NOTES.filter(function (n) { return n.file === want; })[0] || NOTES[0];
  if (start) render(start);
})();
</script>
</body>
</html>
